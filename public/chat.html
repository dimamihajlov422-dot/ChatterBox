<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Messenger</title>

<style>

body{
font-family:Arial;
margin:20px;
}

#chat{
border:1px solid #ccc;
height:300px;
overflow-y:auto;
padding:10px;
margin-bottom:10px;
}

</style>
</head>

<body>

<h2>Messenger</h2>

Ник

<input id="nick">

Ник друга

<input id="friend">

<button onclick="start()">Открыть чат</button>

<div id="chat"></div>

<input id="msg">
<button onclick="send()">Отправить</button>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let nick
let friend

function start(){

nick=document.getElementById("nick").value
friend=document.getElementById("friend").value

socket.emit("join",{nick,friend})

}

function send(){

const text=document.getElementById("msg").value

socket.emit("message",{nick,friend,text})

document.getElementById("msg").value=""

}

socket.on("history",msgs=>{

document.getElementById("chat").innerHTML=""

msgs.forEach(add)

})

socket.on("message",add)

function add(m){

const d=document.createElement("div")

d.innerText=m.from+": "+m.text

document.getElementById("chat").appendChild(d)

}

</script>

</body>
</html>
