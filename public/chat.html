<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Приватный чат с памятью</title>
<style>
  body { font-family: Arial; margin: 20px; }
  #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
  #input { width: 70%; }
  #send { width: 25%; }
</style>
</head>
<body>

<h2>Приватный чат с памятью</h2>

<label>Ник (необязательно): <input id="nick" placeholder="Anon"/></label>


<button id="newChat">Создать новый чат</button>
<input id="chatId" placeholder="Введите ID чата"/>
<button id="joinChat">Присоединиться</button>

<div id="chatSection" style="display:none; margin-top:20px;">
  <div id="messages"></div>
  <input id="input" placeholder="Сообщение"/>
  <button id="send">Отправить</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let currentChat = null;

const messagesDiv = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const chatSection = document.getElementById("chatSection");
const nickInput = document.getElementById("nick");
const chatIdInput = document.getElementById("chatId");

document.getElementById("newChat").onclick = async () => {
  const res = await fetch("/new-chat");
  const data = await res.json();
  chatIdInput.value = data.chatId;
  alert("Новый чат создан! ID: " + data.chatId);
};

document.getElementById("joinChat").onclick = () => {
  const chatId = chatIdInput.value.trim();
  if (!chatId) return alert("Введите ID чата!");
  currentChat = chatId;
  const nick = nickInput.value.trim() || undefined;
  socket.emit("join chat", { chatId, nick });
  chatSection.style.display = "block";
};

sendBtn.onclick = () => {
  const msg = input.value.trim();
  if (!msg) return;
  socket.emit("private message", msg);
  input.value = "";
};

socket.on("chat history", (msgs) => {
  messagesDiv.innerHTML = "";
  msgs.forEach(m => addMessage(m.from, m.msg));
});

socket.on("private message", (m) => {
  addMessage(m.from, m.msg);
});

function addMessage(from, msg) {
  const div = document.createElement("div");
  div.textContent = `${from}: ${msg}`;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}
</script>

</body>
</html>
