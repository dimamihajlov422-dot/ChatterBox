<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Мессенджер</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #f5f5f5;
    transition: background 0.3s;
}
body.dark { background: #121212; }
.auth-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #0084ff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
}
.auth-screen.hidden { display: none; }
.auth-card {
    background: white;
    border-radius: 24px;
    padding: 32px 24px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
body.dark .auth-card { background: #1e1e1e; color: white; }
.auth-card h2 { text-align: center; margin-bottom: 24px; font-size: 24px; }
.auth-card input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 28px;
    font-size: 16px;
    outline: none;
}
body.dark .auth-card input { background: #2d2d2d; color: white; border-color: #444; }
.auth-card button {
    width: 100%;
    padding: 14px;
    background: #0084ff;
    color: white;
    border: none;
    border-radius: 28px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 12px;
}
.auth-card .switch-btn { background: none; color: #0084ff; border: 1px solid #0084ff; }
.error-msg { color: #f44336; text-align: center; font-size: 13px; margin-top: 8px; }
.main-app { display: flex; flex-direction: column; height: 100%; }
.main-app.hidden { display: none; }
.header {
    background: #0084ff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}
.header .nick { color: white; font-weight: bold; flex: 1; font-size: 18px; }
.header button { background: rgba(255,255,255,0.2); border: none; padding: 8px 16px; border-radius: 20px; color: white; font-size: 14px; cursor: pointer; }
.mode-bar {
    background: #0084ff;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
}
.mode-bar button { background: white; color: #0084ff; border: none; padding: 8px 16px; border-radius: 24px; font-weight: bold; font-size: 14px; cursor: pointer; }
.mode-bar span { color: white; font-weight: bold; flex: 1; text-align: center; font-size: 15px; }
.chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    background: #e4e6eb;
    align-self: flex-start;
    word-break: break-word;
    position: relative;
}
body.dark .message { background: #2d2d2d; color: white; }
.message.own { background: #0084ff; color: white; align-self: flex-end; }
.message img { max-width: 100%; border-radius: 12px; margin-top: 5px; cursor: pointer; max-height: 200px; object-fit: cover; }
.message .reply-header { font-size: 11px; opacity: 0.7; margin-bottom: 5px; padding-left: 8px; border-left: 3px solid; }
.system {
    text-align: center;
    font-size: 11px;
    color: #666;
    background: #e0e0e0;
    padding: 6px 12px;
    border-radius: 16px;
    align-self: center;
    max-width: 85%;
}
body.dark .system { background: #2d2d2d; color: #aaa; }
.input-bar {
    background: white;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    border-top: 1px solid #ddd;
    flex-shrink: 0;
}
body.dark .input-bar { background: #1e1e1e; border-top-color: #333; }
.input-bar input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 28px;
    font-size: 16px;
    background: #f9f9f9;
    outline: none;
}
body.dark .input-bar input { background: #2d2d2d; color: white; border-color: #444; }
.input-bar button {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #0084ff;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
}
#attachBtn { background: #6c757d; }
.menu-btn {
    position: fixed;
    bottom: 80px;
    right: 16px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #0084ff;
    border: none;
    color: white;
    font-size: 24px;
    z-index: 200;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
}
.menu-panel {
    position: fixed;
    bottom: 140px;
    right: 16px;
    width: 280px;
    background: white;
    border-radius: 20px;
    display: none;
    z-index: 300;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
body.dark .menu-panel { background: #1e1e1e; }
.menu-panel.open { display: block; }
.menu-header {
    padding: 16px;
    background: #0084ff;
    color: white;
    font-weight: bold;
    border-radius: 20px 20px 0 0;
    display: flex;
    justify-content: space-between;
}
.menu-header button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
.menu-body { padding: 12px; }
.menu-item {
    padding: 12px;
    background: #f0f0f0;
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex;
    gap: 10px;
}
body.dark .menu-item { background: #2d2d2d; color: white; }
.search-box {
    padding: 8px;
    margin-bottom: 12px;
    background: #f0f0f0;
    border-radius: 12px;
}
.search-box input {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
}
body.dark .search-box { background: #2d2d2d; }
body.dark .search-box input { background: #1e1e1e; color: white; }
.user-list { max-height: 250px; overflow-y: auto; }
.user-item {
    padding: 10px;
    background: #f0f0f0;
    margin-bottom: 6px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
body.dark .user-item { background: #2d2d2d; }
.user-item .online-dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; display: inline-block; margin-right: 6px; }
.user-item .offline-dot { width: 8px; height: 8px; background: #999; border-radius: 50%; display: inline-block; margin-right: 6px; }
.user-item button { background: #4caf50; border: none; padding: 4px 12px; border-radius: 16px; color: white; font-size: 12px; cursor: pointer; }
.call-indicator {
    position: fixed;
    bottom: 140px;
    left: 16px;
    right: 16px;
    background: #4caf50;
    color: white;
    padding: 12px;
    border-radius: 28px;
    text-align: center;
    font-size: 14px;
    z-index: 150;
    display: none;
}
.call-indicator button { background: #f44336; border: none; padding: 4px 12px; border-radius: 20px; color: white; margin-left: 12px; cursor: pointer; }
.context-menu {
    position: fixed;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    z-index: 1000;
    overflow: hidden;
    display: none;
    min-width: 160px;
}
body.dark .context-menu { background: #2d2d2d; color: white; }
.context-menu div {
    padding: 12px 20px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s;
}
.context-menu div:hover { background: #f0f0f0; }
body.dark .context-menu div:hover { background: #1e1e1e; }
.hidden { display: none; }
</style>
</head>

<body>

<div class="auth-screen" id="authScreen">
    <div class="auth-card">
        <h2 id="authTitle">Вход</h2>
        <input type="text" id="authNick" placeholder="Ник (2-16 символов)">
        <input type="password" id="authPassword" placeholder="Пароль">
        <button id="authActionBtn">Войти</button>
        <button id="authSwitchBtn" class="switch-btn">Нет аккаунта? Регистрация</button>
        <div id="authError" class="error-msg"></div>
    </div>
</div>

<div class="main-app hidden" id="mainApp">
    <div class="header">
        <span class="nick" id="currentNick">--</span>
        <button id="logoutBtn">Выйти</button>
    </div>
    <div class="mode-bar hidden" id="modeBar">
        <button id="backBtn">← Общий чат</button>
        <span id="modeTitle"></span>
    </div>
    <div class="chat" id="chat"></div>
    <div class="input-bar" id="inputBar">
        <input type="text" id="msgInput" placeholder="Сообщение...">
        <button id="attachBtn">📎</button>
        <button id="sendBtn">➤</button>
    </div>
</div>

<button class="menu-btn hidden" id="menuBtn">☰</button>

<div class="menu-panel" id="menuPanel">
    <div class="menu-header">
        <span>Меню</span>
        <button id="closeMenu">✕</button>
    </div>
    <div class="menu-body">
        <div class="menu-item" id="themeItem">🌓 Сменить тему</div>
        <div class="menu-item" id="soundItem">🔊 Звук: Вкл</div>
        <div class="search-box">
            <input type="text" id="searchUser" placeholder="🔍 Поиск пользователя...">
        </div>
        <div id="usersList" class="user-list"></div>
    </div>
</div>

<div class="call-indicator" id="callIndicator"></div>
<div class="context-menu" id="contextMenu"></div>

<script>
const authScreen = document.getElementById("authScreen");
const authTitle = document.getElementById("authTitle");
const authNick = document.getElementById("authNick");
const authPassword = document.getElementById("authPassword");
const authActionBtn = document.getElementById("authActionBtn");
const authSwitchBtn = document.getElementById("authSwitchBtn");
const authError = document.getElementById("authError");
const mainApp = document.getElementById("mainApp");
const currentNickSpan = document.getElementById("currentNick");
const logoutBtn = document.getElementById("logoutBtn");
const modeBar = document.getElementById("modeBar");
const modeTitle = document.getElementById("modeTitle");
const backBtn = document.getElementById("backBtn");
const chatDiv = document.getElementById("chat");
const inputBar = document.getElementById("inputBar");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const attachBtn = document.getElementById("attachBtn");
const menuBtn = document.getElementById("menuBtn");
const menuPanel = document.getElementById("menuPanel");
const closeMenu = document.getElementById("closeMenu");
const themeItem = document.getElementById("themeItem");
const soundItem = document.getElementById("soundItem");
const usersListDiv = document.getElementById("usersList");
const searchUser = document.getElementById("searchUser");
const callIndicator = document.getElementById("callIndicator");
const contextMenu = document.getElementById("contextMenu");

let ws;
let logged = false;
let currentNick = "";
let currentMode = "public";
let currentPrivateWith = "";
let usersOnline = [];
let allUsers = [];
let isLoginMode = true;
let soundEnabled = true;
let replyToMsg = null;
let pendingImage = null;

let pc = null;
let localStream = null;
let currentCallWith = null;

const servers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

function connect() {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);
    ws.onerror = (e) => console.log("ws error");
    ws.onclose = () => { if (logged) addSystem("❌ Соединение потеряно"); setTimeout(connect, 2000); };
    ws.onmessage = (e) => {
        let d; try { d = JSON.parse(e.data); } catch { return; }
        if (d.type === "error") {
            if (!authScreen.classList.contains("hidden")) authError.textContent = d.text;
            else alert("❌ " + d.text);
            return;
        }
        if (d.type === "register_success") {
            authError.style.color = "#4caf50";
            authError.textContent = d.text;
            setTimeout(() => {
                isLoginMode = true;
                authTitle.textContent = "Вход";
                authActionBtn.textContent = "Войти";
                authSwitchBtn.textContent = "Нет аккаунта? Регистрация";
                authError.textContent = "";
                authPassword.value = "";
            }, 1500);
            return;
        }
        if (d.type === "login_success") {
            logged = true;
            currentNick = d.nick;
            currentNickSpan.textContent = currentNick;
            authScreen.classList.add("hidden");
            mainApp.classList.remove("hidden");
            menuBtn.classList.remove("hidden");
            document.title = "Чат: " + currentNick;
            addSystem(`✅ Вы вошли как ${currentNick}`);
            switchToPublic();
            return;
        }
        if (!logged) return;
        if (d.type === "history" && currentMode === "public") { renderMessages(d.data); return; }
        if (d.type === "msg" && currentMode === "public") { addMessage(d.data); notify(d.data.text); return; }
        if (d.type === "system") { addSystem(d.text); notify(d.text); return; }
        if (d.type === "users") { 
            usersOnline = d.users; 
            allUsers = [...new Set([...allUsers, ...usersOnline])];
            renderUsersList();
        }
        if (d.type === "private_msg") {
            if (currentMode === "private" && currentPrivateWith === d.with) addPrivateMessage(d.data);
            else addSystem(`💬 Новое сообщение от ${d.with}`);
            notify(`📩 ${d.with}: ${d.data.text}`);
        }
        if (d.type === "private_history" && currentMode === "private" && currentPrivateWith === d.with) { renderPrivateMessages(d.data); return; }
        if (d.type === "delete") { const el = document.getElementById(d.id); if (el) el.remove(); }
        if (d.type === "edit") { 
            const el = document.getElementById(d.id);
            if (el) {
                const textSpan = el.querySelector(".msg-text") || el;
                textSpan.textContent = d.newText;
            }
        }
        if (d.type === "signal") handleSignal(d.from, d.signal);
    };
}
connect();

function notify(text) {
    if (!soundEnabled) return;
    if (Notification.permission === "granted") {
        new Notification("Новое сообщение", { body: text.substring(0, 100) });
    } else if (Notification.permission !== "denied") {
        Notification.requestPermission();
    }
}

function setAuthMode(login) {
    isLoginMode = login;
    if (isLoginMode) {
        authTitle.textContent = "Вход";
        authActionBtn.textContent = "Войти";
        authSwitchBtn.textContent = "Нет аккаунта? Регистрация";
    } else {
        authTitle.textContent = "Регистрация";
        authActionBtn.textContent = "Зарегистрироваться";
        authSwitchBtn.textContent = "Уже есть аккаунт? Вход";
    }
    authError.textContent = "";
}

authActionBtn.onclick = () => {
    const nick = authNick.value.trim();
    const password = authPassword.value.trim();
    if (!nick || nick.length < 2) { authError.textContent = "Ник от 2 символов"; return; }
    if (!password || password.length < 3) { authError.textContent = "Пароль от 3 символов"; return; }
    if (isLoginMode) ws.send(JSON.stringify({ type: "login", nick, password }));
    else ws.send(JSON.stringify({ type: "register", nick, password }));
};
authSwitchBtn.onclick = () => setAuthMode(!isLoginMode);
logoutBtn.onclick = () => { if (ws) ws.close(); location.reload(); };

function renderMessages(messages) { chatDiv.innerHTML = ""; messages.forEach(m => addMessage(m)); }
function addMessage(m) {
    const div = document.createElement("div"); div.className = "message";
    if (m.owner === currentNick) div.classList.add("own");
    div.id = m.id;
    if (m.replyTo) {
        const replyDiv = document.createElement("div");
        replyDiv.className = "reply-header";
        replyDiv.textContent = `↩️ Ответ на: ${(m.replyTo.text || "").substring(0, 50)}`;
        div.appendChild(replyDiv);
    }
    if (m.image) {
        const img = document.createElement("img");
        img.src = m.image;
        img.style.maxWidth = "200px";
        img.style.borderRadius = "12px";
        img.onclick = () => window.open(m.image);
        div.appendChild(img);
    }
    const textSpan = document.createElement("span");
    textSpan.className = "msg-text";
    textSpan.textContent = m.text || "";
    div.appendChild(textSpan);
    attachContextMenu(div, m);
    chatDiv.appendChild(div); chatDiv.scrollTop = chatDiv.scrollHeight;
}
function renderPrivateMessages(messages) { chatDiv.innerHTML = ""; messages.forEach(m => addPrivateMessage(m)); }
function addPrivateMessage(m) {
    const div = document.createElement("div"); div.className = "message";
    const isOwn = (m.from === currentNick);
    if (isOwn) div.classList.add("own");
    div.id = m.id;
    if (m.replyTo) {
        const replyDiv = document.createElement("div");
        replyDiv.className = "reply-header";
        replyDiv.textContent = `↩️ Ответ на: ${(m.replyTo.text || "").substring(0, 50)}`;
        div.appendChild(replyDiv);
    }
    if (m.image) {
        const img = document.createElement("img");
        img.src = m.image;
        img.style.maxWidth = "200px";
        img.style.borderRadius = "12px";
        img.onclick = () => window.open(m.image);
        div.appendChild(img);
    }
    const textSpan = document.createElement("span");
    textSpan.className = "msg-text";
    textSpan.textContent = (isOwn ? "→ " : "← ") + (m.text || "");
    div.appendChild(textSpan);
    attachContextMenu(div, m);
    chatDiv.appendChild(div); chatDiv.scrollTop = chatDiv.scrollHeight;
}

// ===== МЕНЮ СООБЩЕНИЯ (СПРАВА ОТ КУРСОРА/ПАЛЬЦА) =====
function attachContextMenu(div, msg) {
    const showMenu = (x, y) => {
        contextMenu.innerHTML = "";
        const items = [
            { text: "✏️ Изменить", action: () => editMessage(msg) },
            { text: "📋 Копировать", action: () => copyMessage(msg) },
            { text: "↪️ Ответить", action: () => replyToMessage(msg) },
            { text: "➡️ Переслать", action: () => forwardMessage(msg) },
            { text: "🗑️ Удалить", action: () => deleteMessage(msg) }
        ];
        items.forEach(item => {
            const itemDiv = document.createElement("div");
            itemDiv.textContent = item.text;
            itemDiv.onclick = () => { contextMenu.style.display = "none"; item.action(); };
            contextMenu.appendChild(itemDiv);
        });
        
        // Позиционирование справа от курсора/пальца
        let left = x + 10;
        let top = y + 10;
        
        // Корректировка, чтобы не выходило за правый край
        if (left + 200 > window.innerWidth) {
            left = x - 210;
        }
        // Корректировка, чтобы не выходило за нижний край
        if (top + 200 > window.innerHeight) {
            top = y - 210;
        }
        
        contextMenu.style.left = left + "px";
        contextMenu.style.top = top + "px";
        contextMenu.style.display = "block";
        
        const closeMenu = () => {
            contextMenu.style.display = "none";
            document.removeEventListener("click", closeMenu);
            document.removeEventListener("touchstart", closeMenu);
        };
        setTimeout(() => {
            document.addEventListener("click", closeMenu);
            document.addEventListener("touchstart", closeMenu);
        }, 50);
    };
    
    div.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        showMenu(e.clientX, e.clientY);
    });
    
    let timer;
    div.addEventListener("touchstart", (e) => {
        timer = setTimeout(() => {
            const touch = e.touches[0];
            showMenu(touch.clientX, touch.clientY);
        }, 600);
    });
    div.addEventListener("touchend", () => clearTimeout(timer));
    div.addEventListener("touchmove", () => clearTimeout(timer));
}

function editMessage(msg) {
    const newText = prompt("Редактировать сообщение:", msg.text);
    if (newText && newText.trim()) {
        ws.send(JSON.stringify({ type: "edit", id: msg.id, text: newText.trim() }));
    }
}
function copyMessage(msg) { 
    const text = msg.text || "";
    navigator.clipboard.writeText(text); 
    addSystem("📋 Скопировано"); 
}
function replyToMessage(msg) { 
    replyToMsg = msg; 
    msgInput.placeholder = `↩️ Ответ: ${(msg.text || "").substring(0, 30)}...`; 
    msgInput.focus();
}
function forwardMessage(msg) { 
    msgInput.value = msg.text || ""; 
    msgInput.focus(); 
}
function deleteMessage(msg) { 
    if (confirm("Удалить сообщение?")) 
        ws.send(JSON.stringify({ type: "delete", id: msg.id })); 
}

function addSystem(text) {
    const div = document.createElement("div"); div.className = "system"; div.textContent = text;
    chatDiv.appendChild(div); chatDiv.scrollTop = chatDiv.scrollHeight;
}

function sendText() {
    if (!logged) return;
    let text = msgInput.value.trim();
    if (!text && !pendingImage) return;
    const replyId = replyToMsg ? replyToMsg.id : null;
    const replyText = replyToMsg ? replyToMsg.text : null;
    if (currentMode === "public") {
        ws.send(JSON.stringify({ type: "chat", text, image: pendingImage, replyTo: replyId ? { id: replyId, text: replyText } : null }));
    } else if (currentMode === "private" && currentPrivateWith) {
        ws.send(JSON.stringify({ type: "private_chat", target: currentPrivateWith, text, image: pendingImage, replyTo: replyId ? { id: replyId, text: replyText } : null }));
    }
    msgInput.value = ""; 
    replyToMsg = null; 
    pendingImage = null;
    msgInput.placeholder = "Сообщение...";
}

attachBtn.onclick = () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.onchange = () => {
        const file = input.files[0];
        if (file && file.size > 5 * 1024 * 1024) {
            addSystem("❌ Файл слишком большой (макс 5MB)");
            return;
        }
        const reader = new FileReader();
        reader.onload = () => { 
            pendingImage = reader.result; 
            addSystem("🖼️ Изображение прикреплено. Напишите сообщение и отправьте."); 
        };
        reader.readAsDataURL(file);
    };
    input.click();
};
msgInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendText(); });
sendBtn.onclick = sendText;

function switchToPublic() {
    currentMode = "public"; currentPrivateWith = ""; modeBar.classList.add("hidden");
    chatDiv.innerHTML = ""; ws.send(JSON.stringify({ type: "get_history" }));
}
function switchToPrivate(withNick) {
    if (withNick === currentNick) { addSystem("❌ Нельзя писать себе"); return; }
    currentMode = "private"; currentPrivateWith = withNick; modeBar.classList.remove("hidden");
    modeTitle.textContent = `💬 ЛС с ${withNick}`; chatDiv.innerHTML = "";
    ws.send(JSON.stringify({ type: "get_private_history", with: withNick }));
}
backBtn.onclick = switchToPublic;

menuBtn.onclick = () => { menuPanel.classList.toggle("open"); if (menuPanel.classList.contains("open")) renderUsersList(); };
closeMenu.onclick = () => menuPanel.classList.remove("open");
document.addEventListener("click", (e) => {
    if (menuPanel.classList.contains("open") && e.target !== menuBtn && !menuPanel.contains(e.target)) menuPanel.classList.remove("open");
});

function renderUsersList() {
    let searchText = searchUser.value.toLowerCase();
    let filtered = allUsers.filter(u => u !== currentNick);
    if (searchText) filtered = filtered.filter(u => u.toLowerCase().includes(searchText));
    if (filtered.length === 0) { usersListDiv.innerHTML = '<div style="padding: 12px; text-align: center; color: gray;">👤 Никого не найдено</div>'; return; }
    usersListDiv.innerHTML = "";
    filtered.forEach(u => {
        const isOnline = usersOnline.includes(u);
        const div = document.createElement("div"); div.className = "user-item";
        div.innerHTML = `<div><span class="${isOnline ? 'online-dot' : 'offline-dot'}"></span> ${u} ${isOnline ? '🟢' : '⚫'}</div><button onclick="switchToPrivate('${u}'); menuPanel.classList.remove('open');">💬</button>`;
        usersListDiv.appendChild(div);
    });
}
searchUser.addEventListener("input", renderUsersList);
setInterval(() => { if (usersOnline.length) { allUsers = [...new Set([...allUsers, ...usersOnline])]; if (menuPanel.classList.contains("open")) renderUsersList(); } }, 5000);

let isDark = localStorage.getItem("theme") === "dark";
if (isDark) document.body.classList.add("dark");
themeItem.onclick = () => {
    isDark = !isDark;
    if (isDark) document.body.classList.add("dark"); else document.body.classList.remove("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
};
soundItem.onclick = () => {
    soundEnabled = !soundEnabled;
    soundItem.innerHTML = soundEnabled ? "🔊 Звук: Вкл" : "🔇 Звук: Выкл";
};

async function callUser(targetNick) {
    if (currentCallWith === targetNick) { endCall(); return; }
    if (currentCallWith) endCall();
    currentCallWith = targetNick; updateCallIndicator();
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        pc = new RTCPeerConnection(servers);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        pc.ontrack = (event) => { const audio = new Audio(); audio.srcObject = event.streams[0]; audio.play(); addSystem(`🔊 Говорим с ${targetNick}`); };
        pc.onicecandidate = (event) => { if (event.candidate) ws.send(JSON.stringify({ type: "signal", target: targetNick, signal: { candidate: event.candidate } })); };
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: "signal", target: targetNick, signal: { sdp: offer } }));
        addSystem(`📞 Звоним ${targetNick}...`);
    } catch(e) { addSystem("❌ Ошибка звонка"); endCall(); }
}
function endCall() {
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    if (pc) { pc.close(); pc = null; }
    if (currentCallWith) { addSystem(`📴 Звонок с ${currentCallWith} завершён`); currentCallWith = null; updateCallIndicator(); }
}
function updateCallIndicator() {
    if (currentCallWith) { callIndicator.innerHTML = `📞 В звонке: ${currentCallWith} <button onclick="endCall()">Завершить</button>`; callIndicator.style.display = "block";
    setTimeout(() => { if (!currentCallWith) callIndicator.style.display = "none"; }, 3000);
    } else callIndicator.style.display = "none";
}
async function handleSignal(from, signal) {
    if (!pc && signal.sdp && signal.sdp.type === "offer") {
        if (!confirm(`📞 ${from} звонит. Ответить?`)) return;
        currentCallWith = from; updateCallIndicator();
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            pc = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            pc.ontrack = (event) => { const audio = new Audio(); audio.srcObject = event.streams[0]; audio.play(); addSystem(`🔊 Говорим с ${from}`); };
            pc.onicecandidate = (event) => { if (event.candidate) ws.send(JSON.stringify({ type: "signal", target: from, signal: { candidate: event.candidate } })); };
            await pc.setRemoteDescription(signal.sdp);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: "signal", target: from, signal: { sdp: answer } }));
            addSystem(`📞 Разговор с ${from}`);
        } catch(e) { endCall(); }
        return;
    }
    if (!pc) return;
    if (signal.sdp) await pc.setRemoteDescription(signal.sdp);
    if (signal.candidate) await pc.addIceCandidate(signal.candidate);
}
window.switchToPrivate = switchToPrivate;
window.endCall = endCall;
window.callUser = callUser;
</script>
