<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мессенджер</title>
<script src="/socket.io/socket.io.js"></script>
<style>
body{font-family:Arial;margin:20px;display:flex;flex-direction:column;max-width:800px;}
#container{display:flex;height:400px;}
#contacts{width:150px;border-right:1px solid #ccc;overflow-y:auto;}
#contacts div{padding:5px;cursor:pointer;border-bottom:1px solid #eee;display:flex;justify-content:space-between;}
#contacts div:hover{background:#f0f0f0;}
#chatArea{flex:1;display:flex;flex-direction:column;}
#chat{flex:1;border-bottom:1px solid #ccc;overflow-y:auto;padding:5px;}
.message{padding:2px 5px;margin:2px 0;}
.message.selected{background:#eef;}
.online{color:green;font-weight:bold;}
#input{display:flex;margin-top:5px;}
#input input{flex:1;padding:5px;}
#input button{padding:5px;}
</style>
</head>
<body>
<h2>Простой Мессенджер</h2>
<div>
  Ник: <input id="nick" type="text">
  Друг: <input id="friend" type="text">
  <button onclick="start()">Открыть чат</button>
</div>
<div id="container">
  <div id="contacts"></div>
  <div id="chatArea">
    <div id="chat"></div>
    <div id="input">
      <input id="msg" type="text" placeholder="Напиши сообщение...">
      <button onclick="send()">Отправить</button>
    </div>
  </div>
</div>

<script>
const socket = io();
let nick="", friend="";

window.onload=()=>{
  const savedNick=localStorage.getItem("nick");
  const savedFriend=localStorage.getItem("friend");
  if(savedNick) document.getElementById("nick").value=savedNick;
  if(savedFriend) document.getElementById("friend").value=savedFriend;
  if(savedNick && savedFriend) start();
}

function start(){
  nick=document.getElementById("nick").value.trim();
  friend=document.getElementById("friend").value.trim();
  if(!nick || !friend){ alert("Введите ник и друга"); return; }

  localStorage.setItem("nick", nick);
  localStorage.setItem("friend", friend);

  socket.emit("join",{nick, friend});
  document.getElementById("chat").innerHTML="";
}

function send(){
  // Пока не трогаем отправку сообщений
}

socket.on("chat history", messages=>{
  const chat=document.getElementById("chat");
  messages.forEach(m=>{
    const div=document.createElement("div");
    div.className="message";
    div.textContent=m.from+": "+(m.msg||"");
    chat.appendChild(div);
  });
});

socket.on("update contacts", data=>{
  const contDiv=document.getElementById("contacts");
  contDiv.innerHTML="";
  const userContacts=data[nick]||[];
  userContacts.forEach(c=>{
    const d=document.createElement("div");
    d.textContent=c;
    const btn=document.createElement("button");
    btn.textContent="❌";
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      contDiv.removeChild(d);
      // удаление контакта
      socket.emit("remove contact", c);
    });
    d.appendChild(btn);
    d.addEventListener("click", ()=>{document.getElementById("friend").value=c; start();});
    contDiv.appendChild(d);
  });
});

socket.on("update online", online=>{
  const contDiv=document.getElementById("contacts");
  Array.from(contDiv.children).forEach(d=>{
    const name=d.firstChild.textContent;
    if(online.includes(name)) d.classList.add("online");
    else d.classList.remove("online");
  });
});
</script>
</body>
</html>
