<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatterBox v3.6</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    display:flex;
    flex-direction:column;
    height:100vh;
}

body.light{
    background:white;
    color:black;
}

/* TOP */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    border-bottom:1px solid #333;
}

body.light .top{
    border-bottom:1px solid #ddd;
}

/* CHAT */
#chat{
    flex:1;
    overflow:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg{
    background:#1e1e1e;
    padding:10px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
    word-break:break-word;
}

body.light .msg{
    background:#eee;
}

.pinned{
    border:2px solid gold;
}

/* BOTTOM */
.bottom{
    display:flex;
    gap:10px;
    padding:10px;
    border-top:1px solid #333;
}

body.light .bottom{
    border-top:1px solid #ddd;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

button{
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}
</style>
</head>

<body>

<div class="top">
    <div>💬 ChatterBox v3.6</div>

    <div style="display:flex; gap:6px;">
        <input id="nick" placeholder="Ник" style="width:90px">
        <button onclick="setNick()">OK</button>
        <button onclick="toggleTheme()">🌙</button>
    </div>
</div>

<div id="chat"></div>

<div class="bottom">
    <input id="msg" placeholder="Сообщение">
    <button onclick="send()">➤</button>
</div>

<script>

let ws;

function connect(){
    ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);

    ws.onmessage = (e)=>{
        const data = JSON.parse(e.data);

        if(data.type==="msg"){
            render(data.data);
        }

        if(data.type==="pin"){
            const el = document.getElementById(data.id);
            if(el) el.classList.add("pinned");
        }

        if(data.type==="error"){
            alert(data.text);
        }
    };
}

connect();

/* NICK */
function setNick(){
    const n = nick.value.trim();
    if(!n) return;

    ws.send(JSON.stringify({
        type:"nick",
        nick:n
    }));
}

/* SEND */
function send(){
    const text = msg.value.trim();
    if(!text) return;

    ws.send(JSON.stringify({
        type:"chat",
        text
    }));

    msg.value="";
}

/* RENDER MSG */
function render(m){

    const div = document.createElement("div");
    div.className="msg";
    div.id=m.id;

    const text = document.createElement("div");
    text.textContent = m.text;

    const pin = document.createElement("button");
    pin.textContent="📌";
    pin.onclick = ()=>{
        ws.send(JSON.stringify({
            type:"pin",
            id:m.id
        }));
    };

    const del = document.createElement("button");
    del.textContent="🗑";
    del.onclick = ()=>{
        div.remove(); // локально
    };

    const right = document.createElement("div");
    right.style.display="flex";
    right.style.gap="5px";

    right.appendChild(pin);
    right.appendChild(del);

    div.appendChild(text);
    div.appendChild(right);

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* ENTER */
msg.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") send();
});

/* THEME */
if(localStorage.getItem("theme")==="light"){
    document.body.classList.add("light");
}

function toggleTheme(){
    document.body.classList.toggle("light");

    localStorage.setItem(
        "theme",
        document.body.classList.contains("light")
            ? "light"
            : "dark"
    );
}

</script>

</body>
</html>
