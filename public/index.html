<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chat v26 — с личными сообщениями</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
}

body.light {
    background: #f5f5f5;
    color: #000;
}

body.dark {
    background: #121212;
    color: #fff;
}

body.dark #chat {
    background: #1e1e1e;
}

body.dark .msg {
    background: #2d2d2d;
    color: #fff;
}

body.dark .msg.own {
    background: #005c4b;
    color: #fff;
}

body.dark .system {
    background: #2d2d2d;
    color: #aaa;
}

body.dark #inputArea {
    background: #1e1e1e;
    border-top-color: #333;
}

body.dark #msgInput {
    background: #2d2d2d;
    color: #fff;
    border-color: #444;
}

body.dark #menuPanel {
    background: #1e1e1e;
}

body.dark .user-item {
    background: #2d2d2d;
}

body.dark .menu-item {
    background: #2d2d2d;
    color: white;
}

/* ===== ВЕРХНИЕ КНОПКИ ===== */
#menuBtn {
    position: fixed;
    top: 12px;
    left: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,132,255,0.95);
    border: none;
    color: white;
    font-size: 24px;
    z-index: 200;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

#dmArrow {
    position: fixed;
    top: 12px;
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,132,255,0.95);
    border: none;
    color: white;
    font-size: 20px;
    z-index: 200;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

/* ===== ШАПКА ЛОГИНА ===== */
#header {
    background: #0084ff;
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
}

#nickInput {
    flex: 1;
    padding: 10px 14px;
    border: none;
    border-radius: 24px;
    font-size: 16px;
    outline: none;
}

#loginBtn {
    background: white;
    color: #0084ff;
    border: none;
    padding: 10px 20px;
    border-radius: 24px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
}

#loginBtn:disabled {
    opacity: 0.6;
}

/* ===== ВЕРХНЯЯ ПАНЕЛЬ РЕЖИМА ===== */
#modeBar {
    background: #0084ff;
    padding: 10px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
}

#backToPublic {
    background: white;
    color: #0084ff;
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

#privateWithSpan {
    flex: 1;
    color: white;
    font-weight: bold;
    text-align: center;
}

/* ===== ЧАТ ===== */
#chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    word-break: break-word;
    background: #e4e6eb;
    align-self: flex-start;
}

.msg.own {
    background: #0084ff;
    color: white;
    align-self: flex-end;
}

.system {
    text-align: center;
    font-size: 11px;
    color: #666;
    padding: 6px 12px;
    background: #e0e0e0;
    border-radius: 16px;
    align-self: center;
    max-width: 85%;
}

/* ===== НИЖНЯЯ ПАНЕЛЬ ===== */
#inputArea {
    background: white;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    border-top: 1px solid #ddd;
    flex-shrink: 0;
}

#msgInput {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 28px;
    font-size: 16px;
    background: #f9f9f9;
    outline: none;
}

#sendBtn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #0084ff;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
}

/* ===== МЕНЮ ===== */
#menuPanel {
    position: fixed;
    top: 0;
    left: 0;
    width: 280px;
    height: 100%;
    background: white;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    z-index: 300;
    box-shadow: 2px 0 12px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
}

#menuPanel.open {
    transform: translateX(0);
}

#menuHeader {
    padding: 20px;
    background: #0084ff;
    color: white;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#closeMenu {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

#menuBody {
    flex: 1;
    padding: 16px;
}

.menu-item {
    padding: 14px;
    margin-bottom: 8px;
    background: #f0f0f0;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
}

#menuUsersList {
    margin-top: 16px;
    max-height: 300px;
    overflow-y: auto;
}

.user-item {
    padding: 12px;
    background: #f0f0f0;
    margin-bottom: 8px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.user-item button {
    background: #4caf50;
    border: none;
    padding: 6px 12px;
    border-radius: 20px;
    color: white;
    cursor: pointer;
}

/* ===== ИНДИКАТОР ЗВОНКА ===== */
#callIndicator {
    position: fixed;
    bottom: 80px;
    left: 16px;
    right: 16px;
    background: #4caf50;
    color: white;
    padding: 10px;
    border-radius: 28px;
    text-align: center;
    font-size: 13px;
    z-index: 150;
    display: none;
}

#callIndicator button {
    background: #f44336;
    border: none;
    padding: 4px 12px;
    border-radius: 20px;
    color: white;
    margin-left: 12px;
    cursor: pointer;
}

.hidden {
    display: none;
}
</style>
</head>

<body class="light">

<button id="menuBtn">☰</button>
<button id="dmArrow" onclick="alert('Меню → Кто в сети → ЛС')">💬</button>

<div id="menuPanel">
    <div id="menuHeader">
        <span>Меню</span>
        <button id="closeMenu">✕</button>
    </div>
    <div id="menuBody">
        <div class="menu-item" onclick="toggleTheme()">
            <span>🌓</span>
            <span>Сменить тему</span>
        </div>
        <div class="menu-item" onclick="toggleUsersInMenu()">
            <span>👥</span>
            <span>Кто в сети</span>
        </div>
        <div id="menuUsersList" style="display: none;"></div>
    </div>
</div>

<div id="header">
    <input type="text" id="nickInput" placeholder="Ваш ник (2-16 символов)" autocomplete="off">
    <button id="loginBtn" onclick="login()">Войти</button>
</div>

<div id="modeBar" class="hidden">
    <button id="backToPublic" onclick="switchToPublic()">← Общий чат</button>
    <span id="privateWithSpan"></span>
</div>

<div id="chat"></div>

<div id="inputArea" class="hidden">
    <input type="text" id="msgInput" placeholder="Сообщение...">
    <button id="sendBtn">➤</button>
</div>

<div id="callIndicator"></div>

<script>
let ws;
let logged = false;
let currentNick = "";

let currentMode = "public"; // public или private
let currentPrivateWith = "";

let pc = null;
let localStream = null;
let currentCallWith = null;

let usersOnline = [];

const chatDiv = document.getElementById("chat");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const nickInput = document.getElementById("nickInput");
const loginBtn = document.getElementById("loginBtn");
const inputArea = document.getElementById("inputArea");
const header = document.getElementById("header");
const modeBar = document.getElementById("modeBar");
const privateWithSpan = document.getElementById("privateWithSpan");
const menuBtn = document.getElementById("menuBtn");
const menuPanel = document.getElementById("menuPanel");
const closeMenu = document.getElementById("closeMenu");
const menuUsersList = document.getElementById("menuUsersList");
const callIndicator = document.getElementById("callIndicator");

const servers = {
    iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
    ]
};

/* ===== CONNECT ===== */
function connect() {
    ws = new WebSocket(
        (location.protocol === "https:" ? "wss://" : "ws://") + location.host
    );

    ws.onerror = (e) => console.log("ws error", e);

    ws.onclose = () => {
        console.log("ws closed, reconnecting...");
        setTimeout(connect, 2000);
    };

    ws.onopen = () => {
        console.log("ws connected");
    };

    ws.onmessage = (e) => {
        let d;
        try { d = JSON.parse(e.data); }
        catch { return; }

        if (d.type === "error") {
            alert("❌ " + d.text);
            if (d.text.includes("Ник")) {
                resetLogin();
            }
            return;
        }

        if (d.type === "login_success") {
            onLoginSuccess(d.nick);
            return;
        }

        if (d.type === "history") {
            if (currentMode === "public") {
                renderMessages(d.data, false);
            }
            return;
        }

        if (d.type === "msg") {
            if (currentMode === "public") {
                addMessageToChat(d.data, false);
            }
            return;
        }

        if (d.type === "system") {
            addSystem(d.text);
            return;
        }

        if (d.type === "users") {
            usersOnline = d.users;
            renderUsersInMenu();
            return;
        }

        if (d.type === "private_msg") {
            if (currentMode === "private" && currentPrivateWith === d.with) {
                addMessageToChat(d.data, true);
            } else if (currentMode === "public") {
                // Можно показать уведомление
                addSystem(`💬 Новое сообщение от ${d.with} (откройте ЛС чтобы прочитать)`);
            }
            return;
        }

        if (d.type === "private_history") {
            if (currentMode === "private" && currentPrivateWith === d.with) {
                renderMessages(d.data, true);
            }
            return;
        }

        if (d.type === "delete") {
            const el = document.getElementById(d.id);
            if (el) el.remove();
            return;
        }

        if (d.type === "signal") {
            handleSignal(d.from, d.signal);
            return;
        }
    };
}

connect();

/* ===== LOGIN ===== */
function login() {
    if (logged) return;

    const nick = nickInput.value.trim();
    if (!nick || nick.length < 2) {
        alert("Ник должен быть от 2 символов");
        return;
    }

    if (ws.readyState !== 1) {
        alert("Подключение к серверу... попробуйте ещё раз");
        return;
    }

    ws.send(JSON.stringify({
        type: "login",
        nick: nick
    }));
}

function onLoginSuccess(nick) {
    logged = true;
    currentNick = nick;
    nickInput.disabled = true;
    loginBtn.disabled = true;
    inputArea.classList.remove("hidden");
    header.classList.add("hidden");
    document.title = "Чат: " + nick;
    addSystem(`✅ Вы вошли как ${nick}`);
    switchToPublic();
}

function resetLogin() {
    logged = false;
    currentNick = "";
    nickInput.disabled = false;
    loginBtn.disabled = false;
    inputArea.classList.add("hidden");
    header.classList.remove("hidden");
    modeBar.classList.add("hidden");
    nickInput.value = "";
    document.title = "Chat";
    currentMode = "public";
    currentPrivateWith = "";
    chatDiv.innerHTML = "";
}

/* ===== ОТОБРАЖЕНИЕ СООБЩЕНИЙ ===== */
function renderMessages(messages, isPrivate) {
    chatDiv.innerHTML = "";
    messages.forEach(m => addMessageToChat(m, isPrivate));
}

function addMessageToChat(m, isPrivate) {
    const div = document.createElement("div");
    div.className = "msg";
    
    let isOwn = false;
    let displayText = "";
    
    if (isPrivate) {
        isOwn = (m.from === currentNick);
        displayText = (isOwn ? "→ " : "← ") + m.text;
    } else {
        isOwn = (m.owner === currentNick);
        displayText = m.text;
    }
    
    if (isOwn) div.classList.add("own");
    div.id = m.id;
    div.textContent = displayText;
    
    // Долгий тап для удаления
    let pressTimer;
    div.ontouchstart = () => {
        pressTimer = setTimeout(() => {
            if (confirm("Удалить сообщение?")) {
                ws.send(JSON.stringify({ type: "delete", id: m.id }));
            }
        }, 600);
    };
    div.ontouchend = () => clearTimeout(pressTimer);
    div.ontouchmove = () => clearTimeout(pressTimer);
    
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

function addSystem(text) {
    const div = document.createElement("div");
    div.className = "system";
    div.textContent = text;
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

/* ===== ОТПРАВКА СООБЩЕНИЯ ===== */
function sendText() {
    if (!logged) {
        alert("Сначала войдите");
        return;
    }
    
    const text = msgInput.value.trim();
    if (!text) return;
    
    if (currentMode === "public") {
        ws.send(JSON.stringify({
            type: "chat",
            text: text
        }));
    } else if (currentMode === "private" && currentPrivateWith) {
        ws.send(JSON.stringify({
            type: "private_chat",
            target: currentPrivateWith,
            text: text
        }));
    }
    
    msgInput.value = "";
}

msgInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendText();
});
sendBtn.onclick = sendText;

/* ===== ПЕРЕКЛЮЧЕНИЕ МЕЖДУ ОБЩИМ ЧАТОМ И ЛС ===== */
function switchToPublic() {
    currentMode = "public";
    currentPrivateWith = "";
    modeBar.classList.add("hidden");
    header.classList.add("hidden");
    chatDiv.innerHTML = "";
    
    // Запросить историю общего чата
    ws.send(JSON.stringify({ type: "get_history" }));
}

function switchToPrivate(withNick) {
    if (withNick === currentNick) {
        addSystem("❌ Нельзя писать самому себе");
        return;
    }
    
    currentMode = "private";
    currentPrivateWith = withNick;
    modeBar.classList.remove("hidden");
    privateWithSpan.textContent = `💬 ЛС с ${withNick}`;
    chatDiv.innerHTML = "";
    
    // Запросить историю ЛС
    ws.send(JSON.stringify({
        type: "get_private_history",
        with: withNick
    }));
}

/* ===== WEBRTC CALL ===== */
async function callUser(targetNick) {
    if (currentCallWith === targetNick) {
        endCall();
        return;
    }
    
    if (currentCallWith) endCall();
    currentCallWith = targetNick;
    updateCallIndicator();
    
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        pc = new RTCPeerConnection(servers);
        
        localStream.getTracks().forEach(track => {
            pc.addTrack(track, localStream);
        });
        
        pc.ontrack = (event) => {
            const audio = new Audio();
            audio.srcObject = event.streams[0];
            audio.play();
            addSystem(`🔊 Говорим с ${targetNick}`);
        };
        
        pc.onicecandidate = (event) => {
            if (event.candidate) {
                ws.send(JSON.stringify({
                    type: "signal",
                    target: targetNick,
                    signal: { candidate: event.candidate }
                }));
            }
        };
        
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        
        ws.send(JSON.stringify({
            type: "signal",
            target: targetNick,
            signal: { sdp: offer }
        }));
        
        addSystem(`📞 Звоним ${targetNick}...`);
    } catch(e) {
        addSystem("❌ Ошибка звонка");
        endCall();
    }
}

function endCall() {
    if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
    }
    if (pc) {
        pc.close();
        pc = null;
    }
    if (currentCallWith) {
        addSystem(`📴 Звонок с ${currentCallWith} завершён`);
        currentCallWith = null;
        updateCallIndicator();
    }
}

function updateCallIndicator() {
    if (currentCallWith) {
        callIndicator.innerHTML = `📞 В звонке: ${currentCallWith} <button onclick="endCall()">Завершить</button>`;
        callIndicator.style.display = "flex";
        setTimeout(() => {
            if (!currentCallWith) callIndicator.style.display = "none";
        }, 3000);
    } else {
        callIndicator.style.display = "none";
    }
}

async function handleSignal(from, signal) {
    if (!pc && signal.sdp && signal.sdp.type === "offer") {
        const answer = confirm(`📞 ${from} звонит. Ответить?`);
        if (!answer) return;
        
        currentCallWith = from;
        updateCallIndicator();
        
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            pc = new RTCPeerConnection(servers);
            
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });
            
            pc.ontrack = (event) => {
                const audio = new Audio();
                audio.srcObject = event.streams[0];
                audio.play();
                addSystem(`🔊 Говорим с ${from}`);
            };
            
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        type: "signal",
                        target: from,
                        signal: { candidate: event.candidate }
                    }));
                }
            };
            
            await pc.setRemoteDescription(signal.sdp);
            const answerSdp = await pc.createAnswer();
            await pc.setLocalDescription(answerSdp);
            
            ws.send(JSON.stringify({
                type: "signal",
                target: from,
                signal: { sdp: answerSdp }
            }));
            
            addSystem(`📞 Разговор с ${from}`);
        } catch(e) {
            endCall();
        }
        return;
    }
    
    if (!pc) return;
    if (signal.sdp) await pc.setRemoteDescription(signal.sdp);
    if (signal.candidate) await pc.addIceCandidate(signal.candidate);
}

/* ===== МЕНЮ ===== */
menuBtn.onclick = () => menuPanel.classList.add("open");
closeMenu.onclick = () => menuPanel.classList.remove("open");

function toggleTheme() {
    const body = document.body;
    if (body.classList.contains("light")) {
        body.classList.remove("light");
        body.classList.add("dark");
        localStorage.setItem("theme", "dark");
    } else {
        body.classList.remove("dark");
        body.classList.add("light");
        localStorage.setItem("theme", "light");
    }
}

let usersVisible = false;
function toggleUsersInMenu() {
    usersVisible = !usersVisible;
    menuUsersList.style.display = usersVisible ? "block" : "none";
    if (usersVisible) renderUsersInMenu();
}

function renderUsersInMenu() {
    if (!usersVisible) return;
    menuUsersList.innerHTML = "";
    usersOnline.forEach(u => {
        if (u === currentNick) return;
        
        const div = document.createElement("div");
        div.className = "user-item";
        
        const name = document.createElement("span");
        name.textContent = u;
        
        const btn = document.createElement("button");
        btn.textContent = "💬";
        btn.onclick = () => {
            switchToPrivate(u);
            menuPanel.classList.remove("open");
        };
        
        div.appendChild(name);
        div.appendChild(btn);
        menuUsersList.appendChild(div);
    });
}

/* ===== INIT ===== */
const savedTheme = localStorage.getItem("theme");
if (savedTheme === "dark") {
    document.body.classList.remove("light");
    document.body.classList.add("dark");
}

// Клик вне меню — закрыть
document.body.addEventListener("click", (e) => {
    if (!menuPanel.contains(e.target) && e.target !== menuBtn) {
        menuPanel.classList.remove("open");
    }
});
</script>

</body>
</html>
