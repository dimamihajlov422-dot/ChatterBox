<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatterBox</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#fff;   /* 🌞 СВЕТЛАЯ ПО УМОЛЧАНИЮ */
    color:#000;
    height:100vh;
    display:flex;
    flex-direction:column;
}

body.dark{
    background:#111;
    color:#fff;
}

/* TOP */
.top{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #ccc;
}

body.dark .top{
    border-bottom:1px solid #333;
}

.top-left{
    display:flex;
    gap:8px;
    align-items:center;
}

input{
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

body.dark input{
    background:#222;
    color:#fff;
    border:1px solid #444;
}

button{
    min-width:44px;
    min-height:44px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

/* CHAT */
#chat{
    flex:1;
    overflow:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg{
    background:#eee;
    padding:10px;
    border-radius:10px;
    word-break:break-word;
}

body.dark .msg{
    background:#1e1e1e;
}

/* BOTTOM */
.bottom{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid #ccc;
}

body.dark .bottom{
    border-top:1px solid #333;
}

#msg{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
}

body.dark #msg{
    background:#222;
    color:#fff;
    border:1px solid #444;
}
</style>
</head>

<body>

<div class="top">
    <div class="top-left">
        <input id="nick" placeholder="ник">
        <button onclick="setNick()">OK</button>
    </div>

    <div>
        <button onclick="toggleTheme()">🌙</button>
        <button onclick="logout()">🚪</button>
    </div>
</div>

<div id="chat"></div>

<div class="bottom">
    <input id="msg" placeholder="сообщение">
    <button onclick="send()">➤</button>
</div>

<script>

let ws;
let nickSet = false;

/* CONNECT */
function connect(){

    ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);

    ws.onmessage = (e)=>{

        let d;
        try{ d = JSON.parse(e.data); }
        catch{return;}

        const div = document.createElement("div");
        div.className="msg";

        if(d.type==="msg") div.textContent = d.text;
        if(d.type==="system") div.textContent = d.text;

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    };
}

connect();

/* SET NICK */
function setNick(){

    const n = nick.value.trim();
    if(!n) return;

    ws.send(JSON.stringify({
        type:"nick",
        nick:n
    }));

    nickSet = true;
}

/* SEND */
function send(){

    const text = msg.value.trim();
    if(!text) return;

    ws.send(JSON.stringify({
        type:"chat",
        text
    }));

    msg.value="";
}

/* THEME (по умолчанию светлая) */
function toggleTheme(){
    document.body.classList.toggle("dark");
}

/* 🚪 LOGOUT */
function logout(){

    nick.value = "";
    nickSet = false;

    chat.innerHTML = "";

    // просто переподключаемся
    ws.close();
    connect();
}

msg.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") send();
});

</script>

</body>
</html>
