<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatterBox v3.8</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;
}

body.light{
    background:#fff;
    color:#000;
}

/* TOP */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    border-bottom:1px solid #333;
}

#status{
    font-size:14px;
    opacity:0.8;
}

/* CHAT */
#chat{
    flex:1;
    overflow:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg{
    background:#1e1e1e;
    padding:10px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    gap:8px;
    max-width:100%;
    word-break:break-word;
}

body.light .msg{
    background:#eee;
}

/* BOTTOM */
.bottom{
    display:flex;
    gap:10px;
    padding:10px;
    border-top:1px solid #333;
}

input{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    outline:none;
    font-size:16px;
}

button{
    min-width:48px;
    min-height:48px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.pinned{
    border:2px solid gold;
}
</style>
</head>

<body>

<div class="top">
    <div>💬 ChatterBox v3.8</div>

    <div style="display:flex; gap:6px;">
        <input id="nick" placeholder="ник" style="width:80px">
        <button onclick="setNick()">OK</button>
        <button onclick="toggleTheme()">🌙</button>
    </div>
</div>

<div id="status">🌍 Общий чат</div>

<div id="chat"></div>

<div class="bottom">
    <input id="msg" placeholder="Сообщение">
    <button onclick="send()">➤</button>
</div>

<script>

let ws;
let currentDM = localStorage.getItem("dm") || null;

if(currentDM){
    document.getElementById("status").innerText = "💌 ЛС: " + currentDM;
}

/* =====================
   CONNECT
===================== */
function connect(){
    ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);

    ws.onmessage = (e)=>{
        let data;

        try{
            data = JSON.parse(e.data);
        }catch{
            return;
        }

        if(data.type==="msg"){
            render(data.data);
        }

        if(data.type==="dm"){
            renderDM(data);
        }

        if(data.type==="error"){
            alert(data.text);
        }
    };
}

connect();

/* =====================
   NICK
===================== */
function setNick(){
    const n = nick.value.trim();
    if(!n) return;

    ws.send(JSON.stringify({
        type:"nick",
        nick:n
    }));
}

/* =====================
   SEND
===================== */
function send(){
    const text = msg.value.trim();
    if(!text) return;

    if(currentDM){
        ws.send(JSON.stringify({
            type:"dm",
            to: currentDM,
            text
        }));
    }else{
        ws.send(JSON.stringify({
            type:"chat",
            text
        }));
    }

    msg.value="";
}

/* =====================
   RENDER MSG
===================== */
function render(m){

    const div = document.createElement("div");
    div.className="msg";
    div.id=m.id;

    const text = document.createElement("div");
    text.textContent = m.text;

    const dmBtn = document.createElement("button");
    dmBtn.textContent="💌";
    dmBtn.onclick=()=>{

        const name = prompt("ЛС с кем?");
        if(!name) return;

        currentDM = name;
        localStorage.setItem("dm", name);

        document.getElementById("status").innerText = "💌 ЛС: " + name;
    };

    const pinBtn = document.createElement("button");
    pinBtn.textContent="📌";
    pinBtn.onclick=()=>{
        div.classList.toggle("pinned");
    };

    const delBtn = document.createElement("button");
    delBtn.textContent="🗑";
    delBtn.onclick=()=>{
        div.remove();
    };

    div.appendChild(text);
    div.appendChild(dmBtn);
    div.appendChild(pinBtn);
    div.appendChild(delBtn);

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* =====================
   DM
===================== */
function renderDM(d){

    const div = document.createElement("div");
    div.className="msg";

    div.textContent = `💌 ${d.from} → ${d.to}: ${d.text}`;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* =====================
   EXIT DM
===================== */
function exitDM(){
    currentDM = null;
    localStorage.removeItem("dm");
    document.getElementById("status").innerText = "🌍 Общий чат";
}

/* =====================
   ENTER
===================== */
msg.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") send();
});

/* =====================
   THEME
===================== */
if(localStorage.getItem("theme")==="light"){
    document.body.classList.add("light");
}

function toggleTheme(){
    document.body.classList.toggle("light");
    localStorage.setItem("theme",
        document.body.classList.contains("light") ? "light":"dark"
    );
}

</script>

</body>
</html>
