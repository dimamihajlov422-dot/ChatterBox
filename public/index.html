<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Мессенджер</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #f5f5f5;
    transition: background 0.3s;
}
body.dark { background: #121212; }

/* ========== АВТОРИЗАЦИЯ ========== */
.auth-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #0084ff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
}
.auth-screen.hidden { display: none; }
.auth-card {
    background: white;
    border-radius: 24px;
    padding: 32px 24px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
body.dark .auth-card { background: #1e1e1e; color: white; }
.auth-card h2 { text-align: center; margin-bottom: 24px; font-size: 24px; }
.auth-card input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 28px;
    font-size: 16px;
    outline: none;
}
body.dark .auth-card input { background: #2d2d2d; color: white; border-color: #444; }
.auth-card button {
    width: 100%;
    padding: 14px;
    background: #0084ff;
    color: white;
    border: none;
    border-radius: 28px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 12px;
}
.auth-card .switch-btn { background: none; color: #0084ff; border: 1px solid #0084ff; }
.auth-card .remember { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 14px; }
.error-msg { color: #f44336; text-align: center; font-size: 13px; margin-top: 8px; }

/* ========== ОСНОВНОЙ ИНТЕРФЕЙС ========== */
.main-app { display: flex; flex-direction: column; height: 100%; }
.main-app.hidden { display: none; }

/* ========== ШАПКА ========== */
.header {
    background: #0084ff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}
.header .nick { color: white; font-weight: bold; flex: 1; font-size: 18px; cursor: pointer; }
.header button { background: rgba(255,255,255,0.2); border: none; padding: 8px 16px; border-radius: 20px; color: white; font-size: 14px; cursor: pointer; }

/* ========== ВЕРХНЯЯ ПАНЕЛЬ ========== */
.top-bar {
    background: #0084ff;
    padding: 8px 12px;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
}
.top-bar input {
    flex: 1;
    padding: 8px 12px;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
}
.top-bar button {
    background: white;
    color: #0084ff;
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

/* ========== ПАНЕЛЬ РЕЖИМА ========== */
.mode-bar {
    background: #0084ff;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
}
.mode-bar button { background: white; color: #0084ff; border: none; padding: 8px 16px; border-radius: 24px; font-weight: bold; font-size: 14px; cursor: pointer; }
.mode-bar span { color: white; font-weight: bold; flex: 1; text-align: center; font-size: 15px; }

/* ========== ЧАТ ========== */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.message {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 18px;
    font-size: 15px;
    background: #e4e6eb;
    align-self: flex-start;
    word-break: break-word;
    position: relative;
}
body.dark .message { background: #2d2d2d; color: white; }
.message.own { background: #0084ff; color: white; align-self: flex-end; }
.message .author {
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 4px;
    color: #0084ff;
    cursor: pointer;
}
.message.own .author { color: rgba(255,255,255,0.8); }
.message .mention {
    background: rgba(0,132,255,0.2);
    border-radius: 12px;
    padding: 2px 6px;
    cursor: pointer;
}
.message img { max-width: 100%; border-radius: 12px; margin-top: 5px; cursor: pointer; max-height: 200px; object-fit: cover; }
.message .location { display: flex; align-items: center; gap: 8px; margin-top: 5px; padding: 6px; background: rgba(0,0,0,0.05); border-radius: 8px; cursor: pointer; }
.message .file-attach { display: flex; align-items: center; gap: 8px; margin-top: 5px; padding: 6px; background: rgba(0,0,0,0.05); border-radius: 8px; cursor: pointer; }
.message .reply-header { font-size: 11px; opacity: 0.7; margin-bottom: 5px; padding-left: 8px; border-left: 3px solid; }
.message .time { font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: right; }
.message .reactions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.message .reaction { font-size: 14px; cursor: pointer; padding: 2px 6px; background: rgba(0,0,0,0.05); border-radius: 16px; }
.typing-indicator { font-size: 12px; color: #666; padding: 5px 12px; font-style: italic; }
.system {
    text-align: center;
    font-size: 11px;
    color: #666;
    background: #e0e0e0;
    padding: 6px 12px;
    border-radius: 16px;
    align-self: center;
    max-width: 85%;
}

/* ========== ПАНЕЛЬ ВВОДА ========== */
.input-bar {
    background: white;
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    border-top: 1px solid #ddd;
    flex-shrink: 0;
}
body.dark .input-bar { background: #1e1e1e; border-top-color: #333; }
.input-bar input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 28px;
    font-size: 16px;
    background: #f9f9f9;
    outline: none;
}
body.dark .input-bar input { background: #2d2d2d; color: white; border-color: #444; }
.input-bar button {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #0084ff;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
}
#sendBtn { background: #0084ff; }
#attachBtn { background: #6c757d; }

/* ========== ПАНЕЛЬ ВЛОЖЕНИЙ ========== */
.attach-panel {
    position: fixed;
    bottom: 80px;
    left: 16px;
    right: 16px;
    background: white;
    border-radius: 28px;
    padding: 12px;
    display: none;
    gap: 16px;
    justify-content: space-around;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    z-index: 250;
}
body.dark .attach-panel { background: #2d2d2d; }
.attach-panel.open { display: flex; }
.attach-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
}
.attach-item span:first-child { font-size: 28px; }
.attach-item span:last-child { font-size: 11px; }

/* ========== МЕНЮ СООБЩЕНИЯ (СПРАВА) ========== */
.message-menu {
    position: fixed;
    background: white;
    border-radius: 16px;
    padding: 8px;
    display: none;
    gap: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    z-index: 1000;
    flex-direction: column;
    min-width: 140px;
}
body.dark .message-menu { background: #2d2d2d; }
.message-menu span {
    padding: 10px 16px;
    cursor: pointer;
    font-size: 16px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.message-menu span:active { background: rgba(0,0,0,0.1); }

/* ========== КНОПКА МЕНЮ ========== */
.menu-btn {
    position: fixed;
    bottom: 80px;
    right: 16px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #0084ff;
    border: none;
    color: white;
    font-size: 24px;
    z-index: 200;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* ========== ВЫЕЗЖАЮЩЕЕ МЕНЮ ========== */
.menu-panel {
    position: fixed;
    bottom: 140px;
    right: 16px;
    width: 300px;
    background: white;
    border-radius: 20px;
    display: none;
    z-index: 300;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    max-height: 70vh;
    overflow-y: auto;
}
body.dark .menu-panel { background: #1e1e1e; }
.menu-panel.open { display: block; }
.menu-header {
    padding: 16px;
    background: #0084ff;
    color: white;
    font-weight: bold;
    border-radius: 20px 20px 0 0;
    display: flex;
    justify-content: space-between;
    position: sticky;
    top: 0;
}
.menu-header button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
.menu-body { padding: 12px; }
.menu-item {
    padding: 12px;
    background: #f0f0f0;
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex;
    gap: 10px;
}
body.dark .menu-item { background: #2d2d2d; color: white; }
.section-title { font-weight: bold; padding: 8px; margin-top: 8px; color: #0084ff; }
.chat-item {
    padding: 10px;
    background: #f0f0f0;
    margin-bottom: 6px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}
.user-list { max-height: 250px; overflow-y: auto; }
.user-item {
    padding: 10px;
    background: #f0f0f0;
    margin-bottom: 6px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
}
.user-item .online-dot { width: 10px; height: 10px; background: #4caf50; border-radius: 50%; display: inline-block; margin-right: 6px; }
.user-item .offline-dot { width: 10px; height: 10px; background: #999; border-radius: 50%; display: inline-block; margin-right: 6px; }
.user-item .unread-badge {
    background: #f44336;
    color: white;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    right: 70px;
    top: -5px;
}
.user-item button { background: #4caf50; border: none; padding: 4px 12px; border-radius: 16px; color: white; font-size: 12px; cursor: pointer; margin-left: 4px; }
.group-item {
    padding: 10px;
    background: #f0f0f0;
    margin-bottom: 6px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}
.group-create {
    padding: 12px;
    background: #f0f0f0;
    border-radius: 12px;
    margin-bottom: 8px;
}
.group-create input { width: 60%; padding: 8px; border-radius: 20px; border: none; margin-right: 8px; }
.group-info {
    display: flex;
    align-items: center;
    gap: 12px;
}
.group-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
}
.group-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.call-indicator {
    position: fixed;
    bottom: 140px;
    left: 16px;
    right: 16px;
    background: #4caf50;
    color: white;
    padding: 12px;
    border-radius: 28px;
    text-align: center;
    z-index: 150;
    display: none;
}
.call-indicator button { background: #f44336; border: none; padding: 4px 12px; border-radius: 20px; color: white; margin-left: 12px; cursor: pointer; }
.modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}
.modal.open { display: flex; }
.modal img { max-width: 90%; max-height: 90%; border-radius: 12px; }
.modal .close { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }
.profile-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: white;
    z-index: 1500;
    display: none;
    flex-direction: column;
    overflow-y: auto;
}
body.dark .profile-screen { background: #121212; color: white; }
.profile-screen.open { display: flex; }
.profile-header {
    background: #0084ff;
    padding: 20px;
    color: white;
    display: flex;
    align-items: center;
    gap: 16px;
}
.profile-header button { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
.profile-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    overflow: hidden;
    cursor: pointer;
}
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-body { padding: 20px; }
.profile-field { margin-bottom: 20px; }
.profile-field label { display: block; font-weight: bold; margin-bottom: 8px; }
.profile-field input, .profile-field textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
}
.profile-save {
    background: #0084ff;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 28px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
}
.hidden { display: none; }
</style>
</head>

<body>

<div class="auth-screen" id="authScreen">
    <div class="auth-card">
        <h2 id="authTitle">Вход</h2>
        <input type="text" id="authNick" placeholder="Ник (2-16 символов)">
        <input type="password" id="authPassword" placeholder="Пароль">
        <div class="remember"><input type="checkbox" id="rememberMe"> <label>Запомнить меня</label></div>
        <button id="authActionBtn">Войти</button>
        <button id="authSwitchBtn" class="switch-btn">Нет аккаунта? Регистрация</button>
        <div id="authError" class="error-msg"></div>
    </div>
</div>

<div class="main-app hidden" id="mainApp">
    <div class="header">
        <span class="nick" id="currentNick">--</span>
        <button id="logoutBtn">Выйти</button>
    </div>
    <div class="top-bar">
        <input type="text" id="searchInput" placeholder="🔍 Поиск сообщений...">
        <button id="searchBtn">Найти</button>
    </div>
    <div class="mode-bar hidden" id="modeBar">
        <button id="backBtn">← Общий чат</button>
        <div class="group-info hidden" id="groupInfo">
            <div class="group-avatar" id="groupAvatar">👥</div>
            <span id="modeTitle"></span>
        </div>
        <button id="inviteBtn" class="hidden">➕</button>
    </div>
    <div class="chat" id="chat"><div id="typingIndicator" class="typing-indicator hidden"></div></div>
    <div class="input-bar" id="inputBar">
        <input type="text" id="msgInput" placeholder="Сообщение...">
        <button id="sendBtn">➤</button>
        <button id="attachBtn">📎</button>
    </div>
</div>

<div class="attach-panel" id="attachPanel">
    <div class="attach-item" id="attachPhoto"><span>🖼️</span><span>Фото</span></div>
    <div class="attach-item" id="attachFile"><span>📁</span><span>Файл</span></div>
    <div class="attach-item" id="attachLocation"><span>📍</span><span>Гео</span></div>
</div>

<div class="message-menu" id="messageMenu">
    <span id="menuEdit">✏️ Редактировать</span>
    <span id="menuCopy">📋 Копировать</span>
    <span id="menuReply">↩️ Ответить</span>
    <span id="menuForward">➡️ Переслать</span>
    <span id="menuReaction">👍 Реакция</span>
    <span id="menuProfile">👤 Профиль</span>
    <span id="menuDelete">🗑️ Удалить</span>
</div>

<button class="menu-btn hidden" id="menuBtn">☰</button>
<div class="menu-panel" id="menuPanel">
    <div class="menu-header"><span>Меню</span><button id="closeMenu">✕</button></div>
    <div class="menu-body">
        <div class="menu-item" id="themeItem">🌓 Сменить тему</div>
        <div class="menu-item" id="soundItem">🔊 Звук: Вкл</div>
        <div class="section-title">📋 Последние чаты</div>
        <div id="lastChatsList" class="user-list"></div>
        <div class="section-title">👥 Группы</div>
        <div class="group-create"><input type="text" id="newGroupName" placeholder="Название группы"><button id="createGroupBtn">Создать</button></div>
        <div id="groupsList" class="user-list"></div>
        <div class="section-title">👤 Пользователи</div>
        <div class="search-box"><input type="text" id="searchUser" placeholder="🔍 Поиск пользователя..."></div>
        <div id="usersList" class="user-list"></div>
    </div>
</div>

<div class="call-indicator" id="callIndicator"></div>
<div class="modal" id="modal"><span class="close">&times;</span><img id="modalImg" src=""></div>
<div class="profile-screen" id="profileScreen">
    <div class="profile-header"><button id="closeProfile">←</button><span id="profileTitle">Мой профиль</span></div>
    <div class="profile-body">
        <div class="profile-field" style="text-align: center;"><div class="profile-avatar" id="avatarPicker"><span id="avatarEmoji">👤</span><img id="avatarImg" style="display: none;"></div></div>
        <div class="profile-field"><label>О себе</label><textarea id="profileBio" rows="3" placeholder="Расскажите о себе..."></textarea></div>
        <div class="profile-field"><label>Возраст</label><input type="number" id="profileAge" placeholder="Например: 25"></div>
        <div class="profile-field"><label>Телефон</label><input type="tel" id="profilePhone" placeholder="+7 XXX XXX XX XX"></div>
        <button class="profile-save" id="saveProfile">Сохранить</button>
    </div>
</div>

<script>
// DOM элементы
const authScreen = document.getElementById("authScreen");
const authTitle = document.getElementById("authTitle");
const authNick = document.getElementById("authNick");
const authPassword = document.getElementById("authPassword");
const rememberMe = document.getElementById("rememberMe");
const authActionBtn = document.getElementById("authActionBtn");
const authSwitchBtn = document.getElementById("authSwitchBtn");
const authError = document.getElementById("authError");
const mainApp = document.getElementById("mainApp");
const currentNickSpan = document.getElementById("currentNick");
const logoutBtn = document.getElementById("logoutBtn");
const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const modeBar = document.getElementById("modeBar");
const modeTitle = document.getElementById("modeTitle");
const groupInfo = document.getElementById("groupInfo");
const groupAvatar = document.getElementById("groupAvatar");
const backBtn = document.getElementById("backBtn");
const inviteBtn = document.getElementById("inviteBtn");
const chatDiv = document.getElementById("chat");
const typingIndicator = document.getElementById("typingIndicator");
const inputBar = document.getElementById("inputBar");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const attachBtn = document.getElementById("attachBtn");
const attachPanel = document.getElementById("attachPanel");
const menuBtn = document.getElementById("menuBtn");
const menuPanel = document.getElementById("menuPanel");
const closeMenu = document.getElementById("closeMenu");
const themeItem = document.getElementById("themeItem");
const soundItem = document.getElementById("soundItem");
const usersListDiv = document.getElementById("usersList");
const lastChatsListDiv = document.getElementById("lastChatsList");
const groupsListDiv = document.getElementById("groupsList");
const searchUser = document.getElementById("searchUser");
const newGroupName = document.getElementById("newGroupName");
const createGroupBtn = document.getElementById("createGroupBtn");
const callIndicator = document.getElementById("callIndicator");
const messageMenu = document.getElementById("messageMenu");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
const modalClose = document.querySelector(".modal .close");
const profileScreen = document.getElementById("profileScreen");
const profileTitle = document.getElementById("profileTitle");
const closeProfile = document.getElementById("closeProfile");
const avatarPicker = document.getElementById("avatarPicker");
const avatarEmoji = document.getElementById("avatarEmoji");
const avatarImg = document.getElementById("avatarImg");
const profileBio = document.getElementById("profileBio");
const profileAge = document.getElementById("profileAge");
const profilePhone = document.getElementById("profilePhone");
const saveProfile = document.getElementById("saveProfile");

let ws = null;
let logged = false;
let currentNick = "";
let currentMode = "public";
let currentPrivateWith = "";
let currentGroupId = null;
let currentGroup = null;
let usersOnline = [];
let allUsers = [];
let myGroups = [];
let myLastChats = [];
let isLoginMode = true;
let soundEnabled = true;
let replyToMsg = null;
let pendingImage = null;
let pendingFile = null;
let typingTimer = null;
let unreadCounts = {};
let currentMsgTarget = null;

let pc = null;
let localStream = null;
let currentCallWith = null;
const servers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] };

function connect() {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);
    ws.onopen = () => { console.log("✅ WebSocket подключен"); tryAutoLogin(); };
    ws.onerror = () => { authError.textContent = "Ошибка подключения к серверу"; };
    ws.onclose = () => { if (logged) addSystem("❌ Соединение потеряно"); setTimeout(connect, 2000); };
    ws.onmessage = (e) => {
        let d; try { d = JSON.parse(e.data); } catch { return; }
        if (d.type === "error") { if (!authScreen.classList.contains("hidden")) authError.textContent = d.text; else alert("❌ " + d.text); return; }
        if (d.type === "register_success") { authError.style.color = "#4caf50"; authError.textContent = d.text; setTimeout(() => { isLoginMode = true; authTitle.textContent = "Вход"; authActionBtn.textContent = "Войти"; authSwitchBtn.textContent = "Нет аккаунта? Регистрация"; authError.textContent = ""; authPassword.value = ""; }, 1500); return; }
        if (d.type === "login_success") {
            logged = true; currentNick = d.nick; currentNickSpan.textContent = currentNick;
            authScreen.classList.add("hidden"); mainApp.classList.remove("hidden"); menuBtn.classList.remove("hidden");
            document.title = "Чат: " + currentNick;
            if (d.token && rememberMe.checked) localStorage.setItem("chat_token", d.token);
            if (d.groups) myGroups = d.groups;
            if (d.lastChats) myLastChats = d.lastChats;
            if (d.profile) updateProfileUI(d.profile, false);
            addSystem(`✅ Вы вошли как ${currentNick}`);
            renderLastChatsList();
            renderGroupsList();
            switchToPublic();
            loadUnreadCounts();
            return;
        }
        if (!logged) return;
        if (d.type === "history" && currentMode === "public") { renderMessages(d.data); return; }
        if (d.type === "msg" && currentMode === "public") { addMessage(d.data); notify(d.data.text); markUnread("public", d.data.id); return; }
        if (d.type === "system") { addSystem(d.text); notify(d.text); return; }
        if (d.type === "users") { usersOnline = d.users; allUsers = [...new Set([...allUsers, ...usersOnline])]; renderUsersList(); }
        if (d.type === "private_msg") {
            if (currentMode === "private" && currentPrivateWith === d.with) addPrivateMessage(d.data);
            else { addSystem(`💬 Новое сообщение от ${d.with}`); markUnread(`private_${d.with}`, d.data.id); }
            notify(`📩 ${d.with}: ${d.data.text}`);
            updateLastChats();
        }
        if (d.type === "private_history" && currentMode === "private" && currentPrivateWith === d.with) { renderPrivateMessages(d.data); return; }
        if (d.type === "group_msg" && currentMode === "group" && currentGroupId === d.groupId) { addGroupMessage(d.data); return; }
        if (d.type === "group_history" && currentMode === "group" && currentGroupId === d.groupId) { renderGroupMessages(d.data); return; }
        if (d.type === "group_update") { myGroups = myGroups.map(g => g.id === d.group.id ? d.group : g); if (!myGroups.find(g => g.id === d.group.id)) myGroups.push(d.group); renderGroupsList(); if (currentGroupId === d.group.id) { currentGroup = d.group; updateGroupUI(); } }
        if (d.type === "group_created") { myGroups.push(d.group); renderGroupsList(); addSystem(`✅ Группа "${d.group.name}" создана`); }
        if (d.type === "group_info") { currentGroup = d.group; updateGroupUI(); }
        if (d.type === "my_groups") { myGroups = d.groups; renderGroupsList(); }
        if (d.type === "last_chats") { myLastChats = d.data; renderLastChatsList(); }
        if (d.type === "delete") { const el = document.getElementById(d.id); if (el) el.remove(); }
        if (d.type === "edit") { const el = document.getElementById(d.id); if (el) { const textSpan = el.querySelector(".msg-text") || el; textSpan.textContent = d.newText; } }
        if (d.type === "typing") { if (currentMode === "private" && currentPrivateWith === d.from) { if (d.isTyping) showTyping(d.from); else hideTyping(); } }
        if (d.type === "profile_data") { updateProfileUI(d.profile, d.nick !== currentNick); profileTitle.textContent = d.nick === currentNick ? "Мой профиль" : `Профиль ${d.nick}`; }
        if (d.type === "reaction_update") { updateReactionUI(d.id, d.from, d.reaction, d.remove); }
        if (d.type === "search_results") { renderSearchResults(d.results); }
        if (d.type === "signal") handleSignal(d.from, d.signal);

function attachMessageMenu(div, msg, chatType, chatId) {
    const showMenu = (x, y) => {
        currentMsgTarget = { msg, chatType, chatId };
        let left = x + 10;
        let top = y - 60;
        if (left + 200 > window.innerWidth) left = x - 210;
        if (top < 0) top = 10;
        messageMenu.style.left = left + "px";
        messageMenu.style.top = top + "px";
        messageMenu.style.display = "flex";
        setTimeout(() => {
            document.addEventListener("click", () => messageMenu.style.display = "none", { once: true });
        }, 100);
    };
    div.addEventListener("contextmenu", (e) => { e.preventDefault(); showMenu(e.clientX, e.clientY); });
    let timer;
    div.addEventListener("touchstart", (e) => {
        timer = setTimeout(() => {
            const touch = e.touches[0];
            showMenu(touch.clientX, touch.clientY);
        }, 600);
    });
    div.addEventListener("touchend", () => clearTimeout(timer));
    div.addEventListener("touchmove", () => clearTimeout(timer));

}
msgInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendText(); });
sendBtn.onclick = sendText;

chatDiv.addEventListener("click", (e) => {
    const mention = e.target.closest(".mention");
    if (mention) { const nick = mention.dataset.nick; if (nick) viewProfile(nick); }
});

function switchToPublic() { currentMode = "public"; currentPrivateWith = null; currentGroupId = null; modeBar.classList.remove("hidden"); groupInfo.classList.add("hidden"); inviteBtn.classList.add("hidden"); backBtn.classList.remove("hidden"); chatDiv.innerHTML = ""; if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "get_history" })); }
function switchToPrivate(withNick) { if (withNick === currentNick) { addSystem("❌ Нельзя писать себе"); return; } currentMode = "private"; currentPrivateWith = withNick; currentGroupId = null; modeBar.classList.remove("hidden"); groupInfo.classList.add("hidden"); inviteBtn.classList.add("hidden"); backBtn.classList.remove("hidden"); modeTitle.textContent = `💬 ЛС с ${withNick}`; chatDiv.innerHTML = ""; if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "get_private_history", with: withNick })); clearUnread(`private_${withNick}`); }
function switchToGroup(groupId) { currentMode = "group"; currentGroupId = groupId; currentPrivateWith = null; modeBar.classList.remove("hidden"); groupInfo.classList.remove("hidden"); inviteBtn.classList.remove("hidden"); backBtn.classList.add("hidden"); modeTitle.textContent = `👥 ${currentGroup ? currentGroup.name : "Группа"}`; chatDiv.innerHTML = ""; if (ws && ws.readyState === 1) { ws.send(JSON.stringify({ type: "get_group_history", groupId })); ws.send(JSON.stringify({ type: "get_group_info", groupId })); } clearUnread(`group_${groupId}`); }
function updateGroupUI() {
    if (currentGroup) {
        modeTitle.textContent = currentGroup.name;
        if (currentGroup.avatar) {
            groupAvatar.innerHTML = `<img src="${currentGroup.avatar}">`;
        } else {
            groupAvatar.innerHTML = "👥";
        }
    }
}
groupAvatar.onclick = () => {
    const input = document.createElement("input"); input.type = "file"; input.accept = "image/*";
    input.onchange = () => {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = () => {
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "update_group_avatar", groupId: currentGroupId, avatar: reader.result }));
        };
        reader.readAsDataURL(file);
    };
    input.click();
};
backBtn.onclick = switchToPublic;
inviteBtn.onclick = () => {
    const nick = prompt("Введите ник пользователя для приглашения:");
    if (nick && nick.trim() && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "invite_to_group", groupId: currentGroupId, nick: nick.trim() }));
};
searchBtn.onclick = () => { const query = searchInput.value.trim(); if (!query) return; ws.send(JSON.stringify({ type: "search_messages", query })); };

// МЕНЮ
menuBtn.onclick = () => { menuPanel.classList.toggle("open"); if (menuPanel.classList.contains("open")) { renderUsersList(); renderGroupsList(); renderLastChatsList(); } };
closeMenu.onclick = () => menuPanel.classList.remove("open");
document.addEventListener("click", (e) => { if (menuPanel.classList.contains("open") && e.target !== menuBtn && !menuPanel.contains(e.target)) menuPanel.classList.remove("open"); });

function renderGroupsList() { groupsListDiv.innerHTML = ""; myGroups.forEach(g => { const div = document.createElement("div"); div.className = "group-item"; div.innerHTML = `<span>👥 ${g.name}</span><span style="font-size: 11px;">${g.members.length} уч.</span>`; div.onclick = () => switchToGroup(g.id); groupsListDiv.appendChild(div); }); }
createGroupBtn.onclick = () => { const name = newGroupName.value.trim(); if (!name) { addSystem("❌ Введите название группы"); return; } ws.send(JSON.stringify({ type: "create_group", name })); newGroupName.value = ""; };

function renderUsersList() {
    let searchText = searchUser.value.toLowerCase();
    let filtered = allUsers.filter(u => u !== currentNick);
    if (searchText) filtered = filtered.filter(u => u.toLowerCase().includes(searchText));
    if (filtered.length === 0) { usersListDiv.innerHTML = '<div style="padding: 12px; text-align: center; color: gray;">👤 Никого не найдено</div>'; return; }
    usersListDiv.innerHTML = "";
    filtered.forEach(u => { const isOnline = usersOnline.includes(u); const unread = getUnreadCount(`private_${u}`); const div = document.createElement("div"); div.className = "user-item"; div.innerHTML = `<div><span class="${isOnline ? 'online-dot' : 'offline-dot'}"></span> ${u} ${isOnline ? '🟢' : '⚫'}</div><div><button onclick="switchToPrivate('${u}'); menuPanel.classList.remove('open');">💬</button><button onclick="viewProfile('${u}')">👤</button><button onclick="callUser('${u}')">📞</button>${unread > 0 ? `<span class="unread-badge">${unread}</span>` : ''}</div>`; usersListDiv.appendChild(div); });
}
function viewProfile(nick) { profileScreen.classList.add("open"); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "get_profile", nick })); }
searchUser.addEventListener("input", renderUsersList);
setInterval(() => { if (usersOnline.length) { allUsers = [...new Set([...allUsers, ...usersOnline])]; if (menuPanel.classList.contains("open")) renderUsersList(); } }, 5000);
currentNickSpan.onclick = () => viewProfile(currentNick);
closeProfile.onclick = () => profileScreen.classList.remove("open");
saveProfile.onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "update_profile", bio: profileBio.value, age: profileAge.value, phone: profilePhone.value })); profileScreen.classList.remove("open"); };
function updateProfileUI(profile, isOther = false) {
    if (profile.avatar) { avatarImg.src = profile.avatar; avatarImg.style.display = "block"; avatarEmoji.style.display = "none"; }
    else { avatarEmoji.style.display = "block"; avatarImg.style.display = "none"; }
    profileBio.value = profile.bio || "";
    profileAge.value = profile.age || "";
    profilePhone.value = profile.phone || "";
}
avatarPicker.onclick = () => { const input = document.createElement("input"); input.type = "file"; input.accept = "image/*"; input.onchange = () => { const file = input.files[0]; const reader = new FileReader(); reader.onload = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "update_profile", avatar: reader.result })); }; reader.readAsDataURL(file); }; input.click(); };

let isDark = localStorage.getItem("theme") === "dark";
if (isDark) document.body.classList.add("dark");
themeItem.onclick = () => { isDark = !isDark; if (isDark) document.body.classList.add("dark"); else document.body.classList.remove("dark"); localStorage.setItem("theme", isDark ? "dark" : "light"); };
soundItem.onclick = () => { soundEnabled = !soundEnabled; soundItem.innerHTML = soundEnabled ? "🔊 Звук: Вкл" : "🔇 Звук: Выкл"; };

async function callUser(targetNick) {
    if (!logged) { addSystem("❌ Сначала войдите"); return; }
    if (currentCallWith === targetNick) { endCall(); return; }
    if (currentCallWith) endCall();
    currentCallWith = targetNick;
    updateCallIndicator();
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        pc = new RTCPeerConnection(servers);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        pc.ontrack = (event) => {
            const audio = new Audio();
            audio.srcObject = event.streams[0];
            audio.play();
            addSystem(`🔊 Говорим с ${targetNick}`);
        };
        pc.onicecandidate = (event) => {
            if (event.candidate) { ws.send(JSON.stringify({ type: "signal", target: targetNick, signal: { candidate: event.candidate } })); }
        };
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: "signal", target: targetNick, signal: { sdp: offer } }));
        addSystem(`📞 Звоним ${targetNick}...`);
    } catch(e) { addSystem("❌ Ошибка звонка"); endCall(); }
}
function endCall() {
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    if (pc) { pc.close(); pc = null; }
    if (currentCallWith) { addSystem(`📴 Звонок с ${currentCallWith} завершён`); currentCallWith = null; updateCallIndicator(); }
}
function updateCallIndicator() {
    if (currentCallWith) {
        callIndicator.innerHTML = `📞 В звонке: ${currentCallWith} <button onclick="endCall()">Завершить</button>`;
        callIndicator.style.display = "block";
        setTimeout(() => { if (!currentCallWith) callIndicator.style.display = "none"; }, 5000);
    } else { callIndicator.style.display = "none"; }
}
async function handleSignal(from, signal) {
    if (!pc && signal.sdp && signal.sdp.type === "offer") {
        const answer = confirm(`📞 ${from} звонит. Ответить?`);
        if (!answer) return;
        currentCallWith = from;
        updateCallIndicator();
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            pc = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            pc.ontrack = (event) => {
                const audio = new Audio();
                audio.srcObject = event.streams[0];
                audio.play();
                addSystem(`🔊 Говорим с ${from}`);
            };
            pc.onicecandidate = (event) => {
                if (event.candidate) { ws.send(JSON.stringify({ type: "signal", target: from, signal: { candidate: event.candidate } })); }
            };
            await pc.setRemoteDescription(signal.sdp);
            const answerSdp = await pc.createAnswer();
            await pc.setLocalDescription(answerSdp);
            ws.send(JSON.stringify({ type: "signal", target: from, signal: { sdp: answerSdp } }));
            addSystem(`📞 Разговор с ${from}`);
        } catch(e) { endCall(); }
        return;
    }
    if (!pc) return;
    if (signal.sdp) await pc.setRemoteDescription(signal.sdp);
    if (signal.candidate) await pc.addIceCandidate(signal.candidate);
}
window.switchToPrivate = switchToPrivate;
window.switchToGroup = switchToGroup;
window.viewProfile = viewProfile;
window.endCall = endCall;
window.callUser = callUser;
</script>
