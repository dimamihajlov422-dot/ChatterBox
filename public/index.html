<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<style>

body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
}

#left{
width:260px;
border-right:1px solid #ccc;
display:flex;
flex-direction:column;
}

#users{
flex:1;
overflow-y:auto;
}

.user{
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.online{
color:green;
font-size:12px;
}

#chat{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow-y:auto;
overflow-x:hidden;
padding:10px;
background:#fafafa;
}

.message{
max-width:60%;
padding:8px;
margin:5px 0;
border-radius:10px;
background:#eee;
word-wrap:break-word;
cursor:pointer;
}

.me{
background:#bde0fe;
margin-left:auto;
}

.reply{
font-size:12px;
opacity:0.7;
border-left:3px solid #888;
padding-left:5px;
margin-bottom:3px;
}

.time{
font-size:10px;
opacity:0.6;
}

#input{
display:flex;
border-top:1px solid #ccc;
}

#text{
flex:1;
padding:10px;
border:none;
}

#send{
width:80px;
}

</style>

</head>

<body>

<div id="left">

<div id="users"></div>

</div>

<div id="chat">

<div id="messages"></div>

<div id="input">

<input id="text" placeholder="Сообщение">
<button id="send" onclick="send()">Send</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket=io()

let myNick=prompt("Введите ник")

let currentChat=null

let replyTo=null

socket.emit("login",myNick)

function loadUsers(){

fetch("/users")
.then(r=>r.json())
.then(users=>{

const list=document.getElementById("users")
list.innerHTML=""

for(let nick in users){

if(nick===myNick) continue

let div=document.createElement("div")

div.className="user"

let status=users[nick].online?"<div class='online'>в сети</div>":""

div.innerHTML=nick+status

div.onclick=()=>{
currentChat=nick
loadMessages()
}

list.appendChild(div)

}

})

}

function loadMessages(){

fetch("/messages/"+myNick+"/"+currentChat)
.then(r=>r.json())
.then(msgs=>{

const box=document.getElementById("messages")

box.innerHTML=""

msgs.forEach(m=>{

let div=document.createElement("div")

div.className="message"

if(m.from===myNick) div.classList.add("me")

let replyHTML=""

if(m.reply){

replyHTML="<div class='reply'>"+m.reply+"</div>"

}

div.innerHTML=
replyHTML+
"<b>"+m.from+"</b>
"+
m.text+
"<div class='time'>"+m.time+"</div>"

div.onclick=()=>{
replyTo=m.from+": "+m.text
}

box.appendChild(div)

})

box.scrollTop=box.scrollHeight

})

}

function send(){

const text=document.getElementById("text").value

if(!text||!currentChat) return

socket.emit("message",{
from:myNick,
to:currentChat,
text:text,
reply:replyTo
})

document.getElementById("text").value=""

replyTo=null

}

socket.on("users",loadUsers)

socket.on("message",data=>{

if(data.from===currentChat||data.to===currentChat){

loadMessages()

}

})

loadUsers()

</script>

</body>

</html>
