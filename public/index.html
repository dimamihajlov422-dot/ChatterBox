<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Общий чат</title>
<style>
body { margin:0; font-family:Arial; display:flex; flex-direction:column; height:100vh; background:#1e1e1e; color:#fff; }
#messages { flex:1; padding:10px; overflow-y:auto; background:#2e2e2e; }
.message { margin-bottom:5px; padding:5px 10px; border-radius:5px; background:#4e90ff; display:inline-block; max-width:70%; word-break:break-word; }
#input { display:flex; border-top:1px solid #444; }
#input input { flex:1; padding:5px; border:none; background:#3e3e3e; color:#fff; }
#input button { padding:5px; border:none; background:#007bff; color:white; cursor:pointer; }
</style>
</head>
<body>
<div id="messages"></div>
<div id="input">
  <input id="msg" placeholder="Введите сообщение"/>
  <button id="send">Отправить</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io(window.location.origin); // важная правка для Render
const messagesDiv = document.getElementById("messages");
const input = document.getElementById("msg");
const sendBtn = document.getElementById("send");

let nick = prompt("Введите свой ник:") || "Anon";

function addMessage(user, text) {
  const div = document.createElement("div");
  div.className = "message";
  div.textContent = `${user}: ${text}`;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// Получаем историю
socket.on("history", msgs => msgs.forEach(m => addMessage(m.nick, m.msg)));

// Новые сообщения
socket.on("new message", data => addMessage(data.nick, data.msg));

// Отправка
function sendMessage() {
  const msg = input.value.trim();
  if(!msg) return;
  socket.emit("new message", { nick, msg });
  input.value = "";
}

sendBtn.onclick = sendMessage;
input.addEventListener("keydown", e => { if(e.key==="Enter") sendMessage(); });
</script>
</body>
</html>
