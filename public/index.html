<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatterBox</title>
    <style>
        /* --- Общий сброс --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            height: 100vh;
            background: #0b0f1a; /* резервный тёмный фон */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Основной контейнер (экран телефона) --- */
        .phone-frame {
            position: relative;
            width: 380px;
            height: 780px;
            background: #b3d9e8; /* базовый цвет под волны */
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            /* Волны — фон с градиентом и размытием */
            background: radial-gradient(circle at 10% 20%, #d4eef7 0%, #b5d9e8 40%, #a3d0c0 80%, #f7e3c0 100%);
        }

        /* --- Волны (абстрактные формы поверх фона) --- */
        .waves-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            filter: blur(2px);
            opacity: 0.5;
        }

        .wave {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .wave1 {
            width: 440px;
            height: 440px;
            top: -80px;
            left: -120px;
            background: radial-gradient(circle, rgba(175, 220, 240, 0.4) 0%, rgba(150, 210, 200, 0.1) 70%);
        }
        .wave2 {
            width: 500px;
            height: 500px;
            bottom: -100px;
            right: -150px;
            background: radial-gradient(circle, rgba(250, 235, 180, 0.35) 0%, rgba(200, 225, 200, 0.1) 70%);
        }
        .wave3 {
            width: 300px;
            height: 300px;
            top: 250px;
            left: 180px;
            background: radial-gradient(circle, rgba(210, 240, 255, 0.3) 0%, rgba(180, 220, 230, 0.05) 80%);
        }
        .wave4 {
            width: 200px;
            height: 200px;
            bottom: 150px;
            left: 20px;
            background: radial-gradient(circle, rgba(230, 245, 210, 0.3) 0%, rgba(200, 230, 210, 0.05) 80%);
        }

        /* --- Полупрозрачный оверлей для контента --- */
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(0.5px); /* лёгкий общий blur */
        }

        /* --- Верхняя панель (Top App Bar) --- */
        .top-bar {
            padding: 20px 20px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .menu-icon, .icons-right {
            display: flex;
            gap: 18px;
            color: white;
            font-size: 22px;
            opacity: 0.9;
            cursor: default;
        }

        .menu-icon span, .icons-right span {
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            letter-spacing: -0.3px;
        }

        /* --- Вкладки (как в Telegram) --- */
        .tabs {
            display: flex;
            gap: 4px;
            padding: 10px 20px 6px;
            background: transparent;
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.65);
            border-radius: 30px;
            transition: 0.2s;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            cursor: default;
        }

        .tab.active {
            background: rgba(70, 130, 200, 0.35);
            backdrop-filter: blur(8px);
            color: white;
            box-shadow: 0 2px 10px rgba(70, 130, 200, 0.2);
        }

        /* --- Список чатов --- */
        .chat-list {
            flex: 1;
            padding: 12px 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        /* --- Карточка чата (Material You) --- */
        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04), 0 2px 6px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: 0.15s;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(200, 220, 240, 0.4);
            backdrop-filter: blur(4px);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(0,0,0,0.1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .chat-name {
            font-weight: 600;
            font-size: 16px;
            color: white;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .chat-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }

        .chat-message {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        /* --- Нижняя навигация --- */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 16px 18px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .nav-item {
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: default;
            transition: 0.2s;
        }

        .nav-item.active {
            color: #8ab4ff;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* --- Стили для второго экрана (вход) --- */
        .auth-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 24px;
            backdrop-filter: blur(2px);
        }

        .auth-card {
            width: 100%;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 36px 28px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .auth-card .app-title {
            text-align: center;
            font-size: 30px;
            color: white;
            margin-bottom: 6px;
        }

        .auth-card input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            font-size: 16px;
            color: white;
            outline: none;
            transition: 0.2s;
        }

        .auth-card input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .auth-card input:focus {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .auth-card .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .auth-card .remember input {
            width: 16px;
            height: 16px;
            accent-color: #8ab4ff;
        }

        .auth-btn {
            padding: 14px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            text-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        .auth-btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.35);
        }

        .auth-switch {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            cursor: pointer;
            padding: 6px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .auth-error {
            color: #ffb4a2;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
        }

        /* --- Скрытие экранов --- */
        .hidden {
            display: none !important;
        }

        /* --- Адаптивность --- */
        @media (max-width: 420px) {
            .phone-frame {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

<div class="phone-frame" id="appContainer">
    <!-- Волны (фон) -->
    <div class="waves-layer">
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="wave wave3"></div>
        <div class="wave wave4"></div>
    </div>

    <!-- ===== ЭКРАН ВХОДА ===== -->
    <div class="auth-container" id="authScreen">
        <div class="auth-card">
            <div class="app-title">ChatterBox</div>
            <input type="text" id="authNick" placeholder="Ник (2-16 символов)" autocomplete="off">
            <input type="password" id="authPassword" placeholder="Пароль">
            <div class="remember">
                <input type="checkbox" id="rememberMe" checked>
                <label for="rememberMe">Запомнить меня</label>
            </div>
            <button class="auth-btn" id="authActionBtn">Войти</button>
            <button class="auth-switch" id="authSwitchBtn">Нет аккаунта? Регистрация</button>
            <div class="auth-error" id="authError"></div>
        </div>
    </div>

    <!-- ===== ОСНОВНОЙ ЭКРАН (ЧАТЫ) ===== -->
    <div class="content hidden" id="mainApp">
        <!-- Top App Bar -->
        <div class="top-bar">
            <div class="menu-icon"><span>☰</span></div>
            <div class="app-title">ChatterBox</div>
            <div class="icons-right">
                <span>🔍</span>
                <span>➕</span>
            </div>
        </div>

        <!-- Вкладки -->
        <div class="tabs">
            <div class="tab active">Все</div>
            <div class="tab">Личные</div>
            <div class="tab">Группы</div>
            <div class="tab">Боты</div>
        </div>

        <!-- Список чатов -->
        <div class="chat-list" id="chatList">
            <!-- Сообщения будут добавлены через JS -->
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <span>💬</span>
                <span class="nav-label">Чаты</span>
            </div>
            <div class="nav-item">
                <span>👤</span>
                <span class="nav-label">Профиль</span>
            </div>
            <div class="nav-item">
                <span>⚙️</span>
                <span class="nav-label">Настройки</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== ДЕМОНСТРАЦИОННЫЕ ДАННЫЕ =====
    const demoChats = [
        { name: 'Анна', message: 'Привет! Как дела?', time: '12:34', emoji: '🌸' },
        { name: 'Михаил', message: 'Созвон в 15:00', time: '11:20', emoji: '💼' },
        { name: 'Лена', message: 'Спасибо за помощь!', time: '10:05', emoji: '✨' },
        { name: 'Дима', message: 'Привет, какая погода в Лос-Анджелесе?', time: '09:15', emoji: '🌤️' },
        { name: 'Ночной друг', message: 'Привет, сейчас ночь.', time: '02:45', emoji: '🌙' }
    ];

    // ===== ОТРИСОВКА ЧАТОВ =====
    function renderChats() {
        const container = document.getElementById('chatList');
        container.innerHTML = '';
        demoChats.forEach(chat => {
            const item = document.createElement('div');
            item.className = 'chat-item';
            item.innerHTML = `
                <div class="avatar">${chat.emoji || '👤'}</div>
                <div class="chat-info">
                    <div class="chat-header">
                        <span class="chat-name">${chat.name}</span>
                        <span class="chat-time">${chat.time}</span>
                    </div>
                    <div class="chat-message">${chat.message}</div>
                </div>
            `;
            container.appendChild(item);
        });
    }

    // ===== ПЕРЕКЛЮЧЕНИЕ МЕЖДУ ЭКРАНАМИ =====
    const authScreen = document.getElementById('authScreen');
    const mainApp = document.getElementById('mainApp');

    // Просто для демонстрации: по клику на кнопку "Войти" показываем чаты
    document.getElementById('authActionBtn').addEventListener('click', function(e) {
        e.preventDefault();
        // Здесь можно добавить проверку полей
        authScreen.classList.add('hidden');
        mainApp.classList.remove('hidden');
        renderChats();
    });

    // Переключение между "Вход" и "Регистрация" (демонстрация)
    let isLogin = true;
    document.getElementById('authSwitchBtn').addEventListener('click', function() {
        isLogin = !isLogin;
        this.textContent = isLogin ? 'Нет аккаунта? Регистрация' : 'Уже есть аккаунт? Вход';
        document.getElementById('authActionBtn').textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
        document.getElementById('authError').textContent = '';
    });

    // Обработка Enter в полях ввода
    document.querySelectorAll('#authNick, #authPassword').forEach(input => {
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('authActionBtn').click();
        });
    });

    // Инициализация (если нужно сразу показать чаты — раскомментировать)
    // authScreen.classList.add('hidden');
    // mainApp.classList.remove('hidden');
    // renderChats();
</script>

</body>
</html>
