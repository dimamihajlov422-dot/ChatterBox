<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatterBox</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* TOP */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    border-bottom:1px solid #333;
    gap:10px;
}

.left, .right{
    display:flex;
    align-items:center;
    gap:10px;
}

input, button{
    border:none;
    border-radius:8px;
    padding:10px;
    font-size:14px;
}

input{
    background:#222;
    color:white;
    outline:none;
}

button{
    cursor:pointer;
    background:#2a2a2a;
    color:white;
}

button:hover{
    background:#3a3a3a;
}

/* CHAT */
#chat{
    flex:1;
    overflow:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg{
    padding:10px;
    border-radius:10px;
    background:#1e1e1e;
    max-width:80%;
    word-wrap:break-word;
}

/* INPUT */
.bottom{
    display:flex;
    gap:10px;
    padding:10px;
    border-top:1px solid #333;
}

/* LIGHT */
body.light{
    background:white;
    color:black;
}

body.light .msg{
    background:#eee;
}

body.light input{
    background:#f0f0f0;
    color:black;
}

body.light button{
    background:#ddd;
    color:black;
}

/* MOBILE */
@media(max-width:600px){
    .topbar{
        flex-direction:column;
        align-items:stretch;
    }

    .msg{
        max-width:100%;
    }
}
</style>
</head>

<body>

<div class="topbar">

    <div class="left">
        💬 ChatterBox
    </div>

    <div class="right">
        <input id="nick" placeholder="Ник" style="width:120px">
        <button onclick="setNick()">Войти</button>
        <button onclick="toggleTheme()">🌙</button>
    </div>

</div>

<div id="chat"></div>

<div class="bottom">
    <input id="msg" placeholder="Сообщение">
    <button onclick="send()">Отправить</button>
</div>

<script>

let ws;

function connect(){
    ws = new WebSocket(
        (location.protocol==="https:"?"wss://":"ws://")+location.host
    );

    ws.onmessage = (e)=>{
        const data = JSON.parse(e.data);

        if(data.type==="msg"){
            addMsg(data.text);
        }
    };
}

function addMsg(text){
    const div=document.createElement("div");
    div.className="msg";
    div.textContent=text;

    chat.appendChild(div);
    chat.scrollTop=chat.scrollHeight;
}

connect();

// ---------- NICK ----------
function setNick(){
    const n = nick.value.trim();
    if(!n) return;

    localStorage.setItem("nick", n);

    ws.send(JSON.stringify({
        type:"nick",
        nick:n
    }));
}

// ---------- SEND ----------
function send(){
    const text = msg.value.trim();
    if(!text) return;

    ws.send(JSON.stringify({
        type:"chat",
        text
    }));

    msg.value="";
}

// ---------- ENTER ----------
msg.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") send();
});

// ---------- THEME ----------
if(localStorage.getItem("theme")==="light"){
    document.body.classList.add("light");
}

function toggleTheme(){
    document.body.classList.toggle("light");

    localStorage.setItem(
        "theme",
        document.body.classList.contains("light")
        ? "light"
        : "dark"
    );
}

</script>

</body>
</html>
