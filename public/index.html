<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatterBox v5</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;
}

body.light{
    background:#fff;
    color:#000;
}

.top{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #333;
}

#chat{
    flex:1;
    overflow:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg{
    background:#1e1e1e;
    padding:10px;
    border-radius:10px;
}

body.light .msg{
    background:#eee;
}

.bottom{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid #333;
}

input{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
}

button{
    min-width:48px;
    min-height:48px;
    border:none;
    border-radius:10px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="top">
    <div>💬 Telegram-like v5</div>
    <div>
        <button onclick="toggleTheme()">🌙</button>
    </div>
</div>

<div id="chat"></div>

<div class="bottom">
    <input id="nick" placeholder="ник">
    <input id="msg" placeholder="сообщение">
    <button onclick="send()">➤</button>
</div>

<script>

let ws;
let nickName = localStorage.getItem("nick") || "";

function connect(){

    ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);

    ws.onopen = ()=>{

        if(nickName){
            ws.send(JSON.stringify({
                type:"nick",
                nick:nickName
            }));
        }
    };

    ws.onmessage = (e)=>{

        let d;
        try{ d = JSON.parse(e.data); }
        catch{return;}

        if(d.type==="msg" || d.type==="system"){
            const div = document.createElement("div");
            div.className="msg";
            div.textContent = d.data ? d.data.text : d.text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
    };
}

connect();

/* SEND */
function send(){

    const text = msg.value.trim();
    if(!text) return;

    if(nick.value){
        nickName = nick.value;
        localStorage.setItem("nick",nickName);

        ws.send(JSON.stringify({
            type:"nick",
            nick:nickName
        }));
    }

    ws.send(JSON.stringify({
        type:"chat",
        text
    }));

    msg.value="";
}

/* THEME */
function toggleTheme(){
    document.body.classList.toggle("light");
    localStorage.setItem("theme",
        document.body.classList.contains("light") ? "light":"dark"
    );
}

if(localStorage.getItem("theme")==="light"){
    document.body.classList.add("light");
}

</script>

</body>
</html>
