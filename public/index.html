<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatterBox v6</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#fff;
    color:#000;
    height:100vh;
    display:flex;
    flex-direction:column;
}

body.dark{
    background:#111;
    color:#fff;
}

.top{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #ccc;
}

#chat{
    flex:1;
    overflow:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg{
    background:#eee;
    padding:10px;
    border-radius:10px;
}

body.dark .msg{
    background:#1e1e1e;
}

.bottom{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid #ccc;
}

input{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    min-width:48px;
    min-height:48px;
    border:none;
    border-radius:10px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="top">
    <div>
        <input id="nick" placeholder="ник">
        <button onclick="setNick()">OK</button>
    </div>

    <div>
        <button onclick="toggleTheme()">🌙</button>
        <button onclick="toggleCall()">📞</button>
        <button onclick="toggleMute()">🔇</button>
    </div>
</div>

<div id="chat"></div>

<div class="bottom">
    <input id="msg" placeholder="сообщение">
    <button onclick="send()">➤</button>
</div>

<script>

let ws;
let localStream;
let peerConnections = {};
let muted = false;
let inCall = false;

/* CONNECT */
function connect(){

    ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);

    ws.onmessage = async (e)=>{

        let d;
        try{ d = JSON.parse(e.data); }
        catch{return;}

        /* HISTORY */
        if(d.type === "history"){
            d.data.forEach(m=>{
                addMsg(m.text);
            });
        }

        /* MSG */
        if(d.type === "msg"){
            addMsg(d.data.text);
        }

        if(d.type === "system"){
            addMsg(d.text);
        }

        /* CALL SIGNAL */
        if(d.type === "call-signal"){
            handleSignal(d.data);
        }
    };
}

connect();

/* CHAT */
function send(){
    ws.send(JSON.stringify({
        type:"chat",
        text:msg.value
    }));
    msg.value="";
}

/* NICK */
function setNick(){
    ws.send(JSON.stringify({
        type:"nick",
        nick:nick.value
    }));
}

/* MSG UI */
function addMsg(t){
    const div = document.createElement("div");
    div.className="msg";
    div.textContent=t;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* ===== CALL (REAL WEBRTC) ===== */

async function toggleCall(){

    inCall = !inCall;

    if(inCall){

        localStream = await navigator.mediaDevices.getUserMedia({
            audio:true
        });

        ws.send(JSON.stringify({type:"call-start"}));

        addMsg("📞 звонок начат");

    } else {

        ws.send(JSON.stringify({type:"call-end"}));

        localStream.getTracks().forEach(t=>t.stop());
        localStream = null;

        addMsg("📴 звонок завершён");
    }
}

/* MUTE */
function toggleMute(){

    if(!localStream) return alert("Сначала звонок");

    muted = !muted;

    localStream.getAudioTracks().forEach(t=>{
        t.enabled = !muted;
    });

    addMsg(muted ? "🔇 mute" : "🎤 unmute");
}

/* ===== WEBRTC CORE ===== */

async function createPeer(id){

    const pc = new RTCPeerConnection({
        iceServers:[{urls:"stun:stun.l.google.com:19302"}]
    });

    localStream.getTracks().forEach(track=>{
        pc.addTrack(track, localStream);
    });

    pc.ontrack = (e)=>{
        const audio = new Audio();
        audio.srcObject = e.streams[0];
        audio.play();
    };

    pc.onicecandidate = (e)=>{
        if(e.candidate){
            ws.send(JSON.stringify({
                type:"call-signal",
                data:e.candidate
            }));
        }
    };

    peerConnections[id] = pc;

    return pc;
}

/* SIMPLE SIGNAL HANDLER */
function handleSignal(data){
    console.log("signal:", data);
}

/* ENTER */
msg.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") send();
});

/* THEME */
function toggleTheme(){
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
