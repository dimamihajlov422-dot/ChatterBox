<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>ChatterBox</title>

<style>

body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
}

#left{
width:260px;
border-right:1px solid #ccc;
display:flex;
flex-direction:column;
}

#search{
padding:10px;
border:none;
border-bottom:1px solid #ccc;
}

#users{
flex:1;
overflow-y:auto;
}

.user{
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.user:hover{
background:#f2f2f2;
}

.online{
color:green;
font-size:12px;
}

#chat{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
overflow-y:auto;
overflow-x:hidden;
padding:10px;
background:#fafafa;
}

.message{
max-width:60%;
padding:8px;
margin:5px 0;
border-radius:10px;
background:#e6e6e6;
word-wrap:break-word;
}

.me{
background:#bde0fe;
margin-left:auto;
}

.time{
font-size:10px;
opacity:0.6;
}

#input{
display:flex;
border-top:1px solid #ccc;
}

#text{
flex:1;
padding:10px;
border:none;
}

#send{
width:80px;
}

#auth{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:10px;
}

#auth input{
padding:10px;
width:200px;
}

</style>

</head>

<body>

<div id="auth">

<h2>ChatterBox</h2>

<input id="nick" placeholder="Ник">
<input id="password" placeholder="Пароль">
<input id="name" placeholder="Имя">
<input id="lastname" placeholder="Фамилия">

<button onclick="register()">Регистрация</button>
<button onclick="login()">Вход</button>

</div>

<div id="left">

<input id="search" placeholder="Поиск">

<div id="users"></div>

</div>

<div id="chat">

<div id="messages"></div>

<div id="input">

<input id="text" placeholder="Сообщение">
<button id="send" onclick="send()">Send</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io()

let myNick = null
let currentChat = null

function register(){

fetch("/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
nick:document.getElementById("nick").value,
password:document.getElementById("password").value,
name:document.getElementById("name").value,
lastname:document.getElementById("lastname").value,
avatar:""
})
})
.then(r=>r.json())
.then(d=>{

if(d.error) alert(d.error)
else alert("Аккаунт создан")

})

}

function login(){

fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
nick:document.getElementById("nick").value,
password:document.getElementById("password").value
})
})
.then(r=>r.json())
.then(d=>{

if(d.error){
alert(d.error)
return
}

myNick=d.user.nick || document.getElementById("nick").value

document.getElementById("auth").style.display="none"

socket.emit("login",myNick)

loadUsers()

})

}

function loadUsers(){

fetch("/users")
.then(r=>r.json())
.then(users=>{

const list=document.getElementById("users")
list.innerHTML=""

for(let nick in users){

if(nick===myNick) continue

let div=document.createElement("div")
div.className="user"

let status=users[nick].online?"<div class='online'>в сети</div>":""

div.innerHTML=
users[nick].name+" "+users[nick].lastname+
"
@"+nick+
status

div.onclick=()=>{
currentChat=nick
loadMessages()
}

list.appendChild(div)

}

})

}

function loadMessages(){

fetch("/messages/"+myNick+"/"+currentChat)
.then(r=>r.json())
.then(msgs=>{

const box=document.getElementById("messages")
box.innerHTML=""

msgs.forEach(m=>{

let div=document.createElement("div")

div.className="message"

if(m.from===myNick) div.classList.add("me")

div.innerHTML=
"<b>"+m.from+"</b>
"+
m.text+
"<div class='time'>"+m.time+"</div>"

box.appendChild(div)

})

box.scrollTop=box.scrollHeight

})

}

function send(){

const text=document.getElementById("text").value

if(!text||!currentChat) return

socket.emit("message",{
from:myNick,
to:currentChat,
text:text
})

document.getElementById("text").value=""

}

socket.on("message",data=>{

if(data.from===currentChat||data.to===currentChat){

loadMessages()

}

})

socket.on("users",loadUsers)

</script>

</body>

</html>
