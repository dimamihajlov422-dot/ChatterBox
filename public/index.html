<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat v10</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#fff;
    height:100vh;
    display:flex;
    flex-direction:column;
}

body.dark{
    background:#111;
    color:#fff;
}

.top{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #ccc;
}

#chat{
    flex:1;
    overflow:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg{
    background:#eee;
    padding:10px;
    border-radius:10px;
}

body.dark .msg{
    background:#1e1e1e;
}

.bottom{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid #ccc;
}

input{
    flex:1;
    padding:10px;
}

button{
    min-width:45px;
    min-height:45px;
    border-radius:8px;
    border:none;
    cursor:pointer;
}

/* ===== COLORS ===== */
.call-on{
    background:#00c853 !important; /* зелёный */
    color:white;
}

.call-off{
  background:#333 !important;
    color:white;
}

.mute-on{
    background:#d50000 !important; /* красный */
    color:white;
}
</style>
</head>

<body>

<div class="top">
    <div>
        <input id="nick" placeholder="ник">
        <button onclick="setNick()">OK</button>
    </div>

    <div>
        <button id="callBtn" class="call-off" onclick="toggleCall()">📞</button>
        <button id="muteBtn" onclick="toggleMute()">🔇</button>
        <button onclick="toggleTheme()">🌙</button>
    </div>
</div>

<div id="chat"></div>

<div class="bottom">
    <input id="msg">
    <button onclick="send()">➤</button>
</div>

<script>

let ws;
let stream;
let muted = false;
let inCall = false;

/* CONNECT */
function connect(){

    ws = new WebSocket(location.origin.replace("http","ws"));

    ws.onmessage = async (e)=>{

        let d;
        try{ d = JSON.parse(e.data); }
        catch{return;}

        if(d.type==="history"){
            d.data.forEach(m=>add(m.text));
        }

        if(d.type==="msg"){
            add(d.data.text);
        }

        if(d.type==="system"){
            add(d.text);
        }

        if(d.type==="voice"){
            play(d.data);
        }

        if(d.type==="call-state"){
            updateCallUI(d.active);
        }
    };
}

connect();

/* CHAT */
function send(){
    ws.send(JSON.stringify({
        type:"chat",
        text:msg.value
    }));
    msg.value="";
}

/* NICK */
function setNick(){
    ws.send(JSON.stringify({
        type:"nick",
        nick:nick.value
    }));
}

/* UI */
function add(t){
    const d=document.createElement("div");
    d.className="msg";
    d.textContent=t;
    chat.appendChild(d);
    chat.scrollTop=chat.scrollHeight;
}

/* ===== CALL ===== */
async function toggleCall(){

    inCall = !inCall;

    if(inCall){

        stream = await navigator.mediaDevices.getUserMedia({audio:true});

        const ctx = new AudioContext();
        const source = ctx.createMediaStreamSource(stream);
        const processor = ctx.createScriptProcessor(2048,1,1);

        source.connect(processor);
        processor.connect(ctx.destination);

        processor.onaudioprocess = (e)=>{

            if(muted) return;

            const data = e.inputBuffer.getChannelData(0);

            ws.send(JSON.stringify({
                type:"voice",
                data:Array.from(data)
            }));
        };

        ws.send(JSON.stringify({type:"call-start"}));

        updateCallUI(true);
        add("📞 звонок начат");

    } else {

        stream.getTracks().forEach(t=>t.stop());
        stream = null;

        ws.send(JSON.stringify({type:"call-end"}));

        updateCallUI(false);
        add("📴 звонок завершён");
    }
}

/* ===== CALL UI ===== */
function updateCallUI(active){

    const btn = document.getElementById("callBtn");

    if(active){
        btn.classList.add("call-on");
        btn.classList.remove("call-off");
    } else {
        btn.classList.remove("call-on");
        btn.classList.add("call-off");
    }
}

/* ===== MUTE ===== */
function toggleMute(){

    muted = !muted;

    const btn = document.getElementById("muteBtn");

    if(muted){
        btn.classList.add("mute-on");
    } else {
        btn.classList.remove("mute-on");
    }

    add(muted ? "🔇 mute" : "🎤 unmute");
}

/* ===== VOICE PLAY ===== */
let audioCtx;

function play(data){

    if(!audioCtx){
        audioCtx = new AudioContext();
    }

    const buffer = audioCtx.createBuffer(1, data.length, audioCtx.sampleRate);
    buffer.copyToChannel(new Float32Array(data),0);

    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(audioCtx.destination);
    src.start();
}

/* ENTER */
msg.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") send();
});

/* THEME */
function toggleTheme(){
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
