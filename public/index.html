<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ChatterBox</title>
<style>
body{margin:0;font-family:Arial,sans-serif;display:flex;height:100vh;background:#f0f0f0}
#contacts{width:150px;background:#ddd;overflow-y:auto;padding:5px}
#contacts div{padding:6px;cursor:pointer;border-radius:4px;margin-bottom:3px;background:#eee}
#contacts div:hover{background:#ccc}
#chat-area{flex:1;display:flex;flex-direction:column}
#messages{flex:1;overflow-y:auto;padding:10px;background:white;word-wrap:break-word}
.message{padding:6px 8px;margin:4px 0;background:#e3e3e3;border-radius:8px;display:flex;justify-content:space-between;flex-wrap:wrap}
.nick{font-weight:bold;margin-right:6px}
#input-area{display:flex;padding:5px;background:#ddd}
#message-input{flex:1;padding:6px;border-radius:6px;border:none;font-size:16px}
#send-btn{padding:6px 12px;border:none;border-radius:6px;background:#4CAF50;color:white;margin-left:5px;cursor:pointer;font-size:16px}
#current-chat{padding:5px;background:#bbb;font-weight:bold}
</style>
</head>
<body>

<div id="contacts"></div>

<div id="chat-area">
    <div id="current-chat">Общий чат</div>
    <div id="messages"></div>
    <div id="input-area">
        <input id="message-input" placeholder="Введите сообщение..." />
        <button id="send-btn">Отправить</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let nick = prompt("Введите ник") || "Гость";
let currentChat = "Общий чат"; // по умолчанию общий

socket.emit("set nick", nick);

const messagesDiv = document.getElementById("messages");
const contactsDiv = document.getElementById("contacts");
const currentChatDiv = document.getElementById("current-chat");
const input = document.getElementById("message-input");

function addMessage(msg, sender) {
    const div = document.createElement("div");
    div.className = "message";
    div.innerHTML = <span class="nick">${sender}:</span> <span>${msg}</span>;
    messagesDiv.appendChild(div);
    div.scrollIntoView();
}

// Обновление списка контактов
socket.on("update users", users => {
    contactsDiv.innerHTML = "";
    users.filter(u=>u!==nick).forEach(user=>{
        const div = document.createElement("div");
        div.textContent = user;
        div.addEventListener("click", ()=>{
            currentChat = user;
            currentChatDiv.textContent = "Чат с: " + user;
            messagesDiv.innerHTML = "";
        });
        contactsDiv.appendChild(div);
    });
});

// Общий чат (только чтение)
socket.on("general chat", msgs => {
    messagesDiv.innerHTML = "";
    msgs.forEach(m=>addMessage(m.msg, m.nick));
});

// Отправка приватного сообщения
document.getElementById("send-btn").addEventListener("click", ()=>{
    const msg = input.value.trim();
    if(msg==="") return;
    if(currentChat==="Общий чат") return alert("Пока пишем только приватно");
    socket.emit("private message",{fromNick:nick,toNick:currentChat,msg});
    input.value="";
});

input.addEventListener("keypress",e=>{
    if(e.key==="Enter") document.getElementById("send-btn").click();
});

// Получение приватного сообщения
socket.on("private message", data=>{
    if((data.fromNick===currentChat && data.toNick===nick) || (data.fromNick===nick && data.toNick===currentChat)){
        addMessage(data.msg, data.fromNick);
    }
});
</script>

</body>
</html>
