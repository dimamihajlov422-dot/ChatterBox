<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ChatterBox</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
}

body.light{
    background:white;
    color:black;
}

.topbar{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #333;
}

#chat{
    height:80vh;
    overflow:auto;
    padding:10px;
}

.msg{
    margin:6px 0;
    padding:8px;
    background:#1e1e1e;
    border-radius:8px;
}

body.light .msg{
    background:#eee;
}

.bottom{
    display:flex;
    gap:10px;
    padding:10px;
    border-top:1px solid #333;
}

input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:6px;
    outline:none;
}

button{
    padding:10px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
    <div>💬 ChatterBox</div>

    <div>
        <input id="nick" placeholder="Ник" style="width:120px">
        <button onclick="setNick()">Войти</button>
        <button onclick="toggleTheme()">🌙/☀️</button>
    </div>
</div>

<div id="chat"></div>

<div class="bottom">
    <input id="msg" placeholder="Сообщение">
    <button onclick="send()">Отправить</button>
</div>

<script>

let ws;

function connect(){
    ws = new WebSocket(
        (location.protocol==="https:"?"wss://":"ws://")+location.host
    );

    ws.onmessage = (e)=>{
        const div=document.createElement("div");
        div.className="msg";
        div.textContent=e.data;

        chat.appendChild(div);
        chat.scrollTop=chat.scrollHeight;
    };
}

connect();

// ---------- nick ----------
function setNick(){
    const n = nick.value.trim();
    if(!n) return;

    localStorage.setItem("nick", n);

    ws.send(JSON.stringify({
        type:"nick",
        nick:n
    }));
}

// ---------- send ----------
function send(){
    const text = msg.value.trim();
    if(!text) return;

    ws.send(JSON.stringify({
        type:"chat",
        text:text
    }));

    msg.value="";
}

// ---------- enter ----------
msg.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") send();
});

// ---------- theme ----------
if(localStorage.getItem("theme")==="light"){
    document.body.classList.add("light");
}

function toggleTheme(){
    document.body.classList.toggle("light");

    localStorage.setItem(
        "theme",
        document.body.classList.contains("light")
            ? "light"
            : "dark"
    );
}

</script>

</body>
</html>
