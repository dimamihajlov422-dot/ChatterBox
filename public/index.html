<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat v18 FINAL</title>

<style>
body{
    margin:0;
    font-family:Arial;
    display:flex;
    height:100vh;
}

#left{
    width:140px;
    border-right:1px solid #ccc;
    overflow:auto;
    padding:5px;
}

.user{
    padding:6px;
    background:#eee;
    margin:4px;
    border-radius:6px;
}

#right{
    flex:1;
    display:flex;
    flex-direction:column;
}

#chat{
    flex:1;
    overflow:auto;
    padding:10px;
}

.msg{
    background:#eee;
    margin:5px;
    padding:8px;
    border-radius:6px;
    word-break:break-word;
}

#top{
    padding:5px;
    border-bottom:1px solid #ccc;
    display:flex;
    gap:5px;
}

#bottom{
    padding:5px;
    display:flex;
    gap:5px;
}

input,button{
    padding:8px;
}
</style>
</head>

<body>

<div id="left"></div>

<div id="right">

<div id="top">
    <input id="nick" placeholder="ник (2-16 символов)">
    <button id="loginBtn" onclick="login()">login</button>
</div>

<div id="chat"></div>

<div id="bottom">
    <input id="msg" placeholder="сообщение" style="flex:1">
    <button onclick="send()">➤</button>
    <button id="callBtn" onclick="toggleCall()">📞</button>
</div>

</div>

<script>

let ws;
let logged = false;
let callActive = false;

const chat = document.getElementById("chat");
const left = document.getElementById("left");
const msg = document.getElementById("msg");
const nick = document.getElementById("nick");
const loginBtn = document.getElementById("loginBtn");
const callBtn = document.getElementById("callBtn");

/* ===== CONNECT SAFE + RECONNECT ===== */
function connect(){

    ws = new WebSocket(
        (location.protocol === "https:" ? "wss://" : "ws://") + location.host
    );

    ws.onerror = (e) => console.log("ws error", e);

    ws.onclose = () => setTimeout(connect, 1000);

    ws.onmessage = (e) => {

        let d;
        try { d = JSON.parse(e.data); }
        catch { return; }

        if(d.type === "error"){
            alert("❌ " + d.text);
            if(d.text.includes("логин") || d.text.includes("Ник")){
                logged = false;
                nick.disabled = false;
                loginBtn.disabled = false;
            }
            return;
        }

        if(d.type === "history"){
            chat.innerHTML = "";
            d.data.forEach(add);
        }

        if(d.type === "msg") add(d.data);
        if(d.type === "delete") remove(d.id);

        if(d.type === "users") renderUsers(d.users);
        if(d.type === "system") system(d.text);
    };
}

connect();

/* ===== LOGIN ===== */
function login(){

    if(logged) return;

    const nickVal = nick.value.trim();
    if(!nickVal) return;

    ws.send(JSON.stringify({
        type: "login",
        nick: nickVal
    }));

    logged = true;
    nick.disabled = true;
    loginBtn.disabled = true;

    document.title = "Чат: " + nickVal;
}

/* ===== SEND ===== */
function send(){

    if(!logged){
        alert("Сначала залогинься");
        return;
    }

    if(ws.readyState !== 1) return;

    if(!msg.value.trim()) return;

    ws.send(JSON.stringify({
        type: "chat",
        text: msg.value
    }));

    msg.value = "";
}

/* ===== ADD MESSAGE ===== */
function add(m){

    const div = document.createElement("div");
    div.className = "msg";
    div.id = m.id;
    div.textContent = m.text;

    /* DELETE ONLY OWN MESSAGES (right click) */
    div.oncontextmenu = (e) => {
        e.preventDefault();
        if(confirm("Удалить сообщение?")){
            ws.send(JSON.stringify({
                type: "delete",
                id: m.id
            }));
        }
    };

    /* LONG TAP FOR MOBILE */
    let pressTimer;
    div.ontouchstart = () => {
        pressTimer = setTimeout(() => {
            if(confirm("Удалить сообщение?")){
                ws.send(JSON.stringify({
                    type: "delete",
                    id: m.id
                }));
            }
        }, 600);
    };
    div.ontouchend = () => clearTimeout(pressTimer);

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* ===== REMOVE MESSAGE ===== */
function remove(id){
    const el = document.getElementById(id);
    if(el) el.remove();
}

/* ===== USERS ===== */
function renderUsers(list){
    left.innerHTML = "";
    list.forEach(u => {
        const d = document.createElement("div");
        d.className = "user";
        d.textContent = u;
        left.appendChild(d);
    });
}

/* ===== SYSTEM MESSAGE ===== */
function system(t){
    const d = document.createElement("div");
    d.style.opacity = "0.7";
    d.style.fontSize = "12px";
    d.style.margin = "5px";
    d.textContent = t;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
}

/* ===== CALL TOGGLE ===== */
function toggleCall(){

    if(!logged){
        alert("Сначала залогинься");
        return;
    }

    callActive = !callActive;

    ws.send(JSON.stringify({
        type: callActive ? "call-start" : "call-end"
    }));

    callBtn.style.background = callActive ? "#4caf50" : "";
    callBtn.textContent = callActive ? "📞 (в звонке)" : "📞";
}

/* ===== ENTER TO SEND ===== */
msg.addEventListener("keydown", (e) => {
    if(e.key === "Enter") send();
});

/* ===== AUTO-FOCUS NICK IF NOT LOGGED ===== */
if(!logged) nick.focus();

</script>

</body>
</html>
