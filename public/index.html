<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatterBox Stable</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;
}

body.light{
    background:#fff;
    color:#000;
}

.top{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #333;
}

#chat{
    flex:1;
    overflow:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg{
    background:#1e1e1e;
    padding:10px;
    border-radius:10px;
    word-break:break-word;
}

body.light .msg{
    background:#eee;
}

.bottom{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid #333;
}

input{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
}

button{
    min-width:48px;
    min-height:48px;
    border:none;
    border-radius:10px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="top">
    <div>
        <input id="nick" placeholder="ник">
        <button onclick="setNick()">OK</button>
    </div>

    <button onclick="toggleTheme()">🌙</button>
</div>

<div id="chat"></div>

<div class="bottom">
    <input id="msg" placeholder="сообщение">
    <button onclick="send()">➤</button>
</div>

<script>

let ws;
let nickSet = false;

/* CONNECT */
function connect(){

    ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);

    ws.onmessage = (e)=>{

        let d;
        try { d = JSON.parse(e.data); }
        catch { return; }

        const div = document.createElement("div");
        div.className="msg";

        if(d.type === "msg") div.textContent = d.text;
        if(d.type === "system") div.textContent = d.text;

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    };

    ws.onclose = ()=>{
        setTimeout(connect, 2000);
    };
}

connect();

/* NICK */
function setNick(){

    const n = nick.value.trim();
    if(!n) return;

    ws.send(JSON.stringify({
        type:"nick",
        nick:n
    }));

    nickSet = true;
}

/* SEND */
function send(){

    const text = msg.value.trim();
    if(!text) return;

    ws.send(JSON.stringify({
        type:"chat",
        text
    }));

    msg.value="";
}

/* ENTER */
msg.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") send();
});

/* THEME */
function toggleTheme(){
    document.body.classList.toggle("light");
}

</script>

</body>
</html>
