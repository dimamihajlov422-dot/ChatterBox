<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Мессенджер</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #f5f5f5;
    transition: background 0.3s;
}
body.dark { background: #121212; }

/* ===== ЭКРАН ВХОДА ===== */
.auth-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #0084ff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
}
.auth-screen.hidden { display: none; }
.auth-card {
    background: white;
    border-radius: 24px;
    padding: 32px 24px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
body.dark .auth-card { background: #1e1e1e; color: white; }
.auth-card h2 { text-align: center; margin-bottom: 24px; font-size: 24px; }
.auth-card input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 28px;
    font-size: 16px;
    outline: none;
}
body.dark .auth-card input { background: #2d2d2d; color: white; border-color: #444; }
.auth-card button {
    width: 100%;
    padding: 14px;
    background: #0084ff;
    color: white;
    border: none;
    border-radius: 28px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 12px;
}
.auth-card .switch-btn { background: none; color: #0084ff; border: 1px solid #0084ff; }
.error-msg { color: #f44336; text-align: center; font-size: 13px; margin-top: 8px; }

/* ===== ОСНОВНОЙ ИНТЕРФЕЙС ===== */
.main-app { display: flex; flex-direction: column; height: 100%; }
.main-app.hidden { display: none; }

/* ===== ШАПКА ===== */
.header {
    background: #0084ff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}
.header .nick {
    color: white;
    font-weight: bold;
    flex: 1;
    font-size: 18px;
    cursor: pointer;
}
.header button {
    background: rgba(255,255,255,0.2);
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

/* ===== ПАНЕЛЬ РЕЖИМА (ЛС) ===== */
.mode-bar {
    background: #0084ff;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
}
.mode-bar button {
    background: white;
    color: #0084ff;
    border: none;
    padding: 8px 16px;
    border-radius: 24px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
}
.mode-bar span {
    color: white;
    font-weight: bold;
    flex: 1;
    text-align: center;
    font-size: 15px;
}

/* ===== ЧАТ ===== */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    background: #e4e6eb;
    align-self: flex-start;
    word-break: break-word;
    position: relative;
}
body.dark .message { background: #2d2d2d; color: white; }
.message.own { background: #0084ff; color: white; align-self: flex-end; }
.message img {
    max-width: 100%;
    border-radius: 12px;
    margin-top: 5px;
    cursor: pointer;
    max-height: 200px;
    object-fit: cover;
}
.message .reply-header {
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 5px;
    padding-left: 8px;
    border-left: 3px solid;
}
.message .time {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 4px;
    text-align: right;
}
.typing-indicator {
    font-size: 12px;
    color: #666;
    padding: 5px 12px;
    font-style: italic;
}
body.dark .typing-indicator { color: #aaa; }
.system {
    text-align: center;
    font-size: 11px;
    color: #666;
    background: #e0e0e0;
    padding: 6px 12px;
    border-radius: 16px;
    align-self: center;
    max-width: 85%;
}
body.dark .system { background: #2d2d2d; color: #aaa; }

/* ===== ПАНЕЛЬ ВВОДА ===== */
.input-bar {
    background: white;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    border-top: 1px solid #ddd;
    flex-shrink: 0;
}
body.dark .input-bar { background: #1e1e1e; border-top-color: #333; }
.input-bar input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 28px;
    font-size: 16px;
    background: #f9f9f9;
    outline: none;
}
body.dark .input-bar input { background: #2d2d2d; color: white; border-color: #444; }
.input-bar button {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #0084ff;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
}
#attachBtn { background: #6c757d; }

/* ===== КНОПКА МЕНЮ ===== */
.menu-btn {
    position: fixed;
    bottom: 80px;
    right: 16px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #0084ff;
    border: none;
    color: white;
    font-size: 24px;
    z-index: 200;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ===== ВЫЕЗЖАЮЩЕЕ МЕНЮ ===== */
.menu-panel {
    position: fixed;
    bottom: 140px;
    right: 16px;
    width: 280px;
    background: white;
    border-radius: 20px;
    display: none;
    z-index: 300;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
body.dark .menu-panel { background: #1e1e1e; }
.menu-panel.open { display: block; }
.menu-header {
    padding: 16px;
    background: #0084ff;
    color: white;
    font-weight: bold;
    border-radius: 20px 20px 0 0;
    display: flex;
    justify-content: space-between;
}
.menu-header button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
.menu-body { padding: 12px; }
.menu-item {
    padding: 12px;
    background: #f0f0f0;
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex;
    gap: 10px;
}
body.dark .menu-item { background: #2d2d2d; color: white; }
.search-box {
    padding: 8px;
    margin-bottom: 12px;
    background: #f0f0f0;
    border-radius: 12px;
}
.search-box input {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
}
body.dark .search-box { background: #2d2d2d; }
body.dark .search-box input { background: #1e1e1e; color: white; }
.user-list { max-height: 250px; overflow-y: auto; }
.user-item {
    padding: 10px;
    background: #f0f0f0;
    margin-bottom: 6px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
body.dark .user-item { background: #2d2d2d; }
.user-item .online-dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; display: inline-block; margin-right: 6px; }
.user-item .offline-dot { width: 8px; height: 8px; background: #999; border-radius: 50%; display: inline-block; margin-right: 6px; }
.user-item button {
    background: #4caf50;
    border: none;
    padding: 4px 12px;
    border-radius: 16px;
    color: white;
    font-size: 12px;
    cursor: pointer;
}

/* ===== ИНДИКАТОР ЗВОНКА ===== */
.call-indicator {
    position: fixed;
    bottom: 140px;
    left: 16px;
    right: 16px;
    background: #4caf50;
    color: white;
    padding: 12px;
    border-radius: 28px;
    text-align: center;
    font-size: 14px;
    z-index: 150;
    display: none;
}
.call-indicator button { background: #f44336; border: none; padding: 4px 12px; border-radius: 20px; color: white; margin-left: 12px; cursor: pointer; }

/* ===== КОНТЕКСТНОЕ МЕНЮ ===== */
.context-menu {
    position: fixed;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    z-index: 1000;
    overflow: hidden;
    display: none;
    min-width: 160px;
}
body.dark .context-menu { background: #2d2d2d; color: white; }
.context-menu div {
    padding: 12px 20px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s;
}
.context-menu div:hover { background: #f0f0f0; }
body.dark .context-menu div:hover { background: #1e1e1e; }

/* ===== МОДАЛЬНОЕ ОКНО ДЛЯ ФОТО ===== */
.modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}
.modal.open { display: flex; }
.modal img { max-width: 90%; max-height: 90%; border-radius: 12px; }
.modal .close {
    position: absolute;
    top: 20px;
    right: 30px;
    color: white;
    font-size: 40px;
    cursor: pointer;
}

/* ===== ПРОФИЛЬ ===== */
.profile-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: white;
    z-index: 1500;
    display: none;
    flex-direction: column;
    overflow-y: auto;
}
body.dark .profile-screen { background: #121212; color: white; }
.profile-screen.open { display: flex; }
.profile-header {
    background: #0084ff;
    padding: 20px;
    color: white;
    display: flex;
    align-items: center;
    gap: 16px;
}
.profile-header button {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
}
.profile-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    overflow: hidden;
    cursor: pointer;
}
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-body { padding: 20px; }
.profile-field {
    margin-bottom: 20px;
}
.profile-field label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}
.profile-field input, .profile-field textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
}
body.dark .profile-field input, body.dark .profile-field textarea {
    background: #2d2d2d;
    color: white;
    border-color: #444;
}
.profile-save {
    background: #0084ff;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 28px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
}

.hidden { display: none; }
</style>
</head>

<body>

<!-- ЭКРАН ВХОДА -->
<div class="auth-screen" id="authScreen">
    <div class="auth-card">
        <h2 id="authTitle">Вход</h2>
        <input type="text" id="authNick" placeholder="Ник (2-16 символов)">
        <input type="password" id="authPassword" placeholder="Пароль">
        <button id="authActionBtn">Войти</button>
        <button id="authSwitchBtn" class="switch-btn">Нет аккаунта? Регистрация</button>
        <div id="authError" class="error-msg"></div>
    </div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
<div class="main-app hidden" id="mainApp">
    <div class="header">
        <span class="nick" id="currentNick">--</span>
        <button id="logoutBtn">Выйти</button>
    </div>
    <div class="mode-bar hidden" id="modeBar">
        <button id="backBtn">← Общий чат</button>
        <span id="modeTitle"></span>
    </div>
    <div class="chat" id="chat">
        <div id="typingIndicator" class="typing-indicator hidden"></div>
    </div>
    <div class="input-bar" id="inputBar">
        <input type="text" id="msgInput" placeholder="Сообщение...">
        <button id="attachBtn">📎</button>
        <button id="sendBtn">➤</button>
    </div>
</div>

<!-- КНОПКА МЕНЮ -->
<button class="menu-btn hidden" id="menuBtn">☰</button>

<!-- ВЫЕЗЖАЮЩЕЕ МЕНЮ -->
<div class="menu-panel" id="menuPanel">
    <div class="menu-header">
        <span>Меню</span>
        <button id="closeMenu">✕</button>
    </div>
    <div class="menu-body">
        <div class="menu-item" id="themeItem">🌓 Сменить тему</div>
        <div class="menu-item" id="soundItem">🔊 Звук: Вкл</div>
        <div class="search-box">
            <input type="text" id="searchUser" placeholder="🔍 Поиск пользователя...">
        </div>
        <div id="usersList" class="user-list"></div>
    </div>
</div>

<!-- ИНДИКАТОР ЗВОНКА -->
<div class="call-indicator" id="callIndicator"></div>

<!-- КОНТЕКСТНОЕ МЕНЮ -->
<div class="context-menu" id="contextMenu"></div>

<!-- МОДАЛЬНОЕ ОКНО ДЛЯ ФОТО -->
<div class="modal" id="modal">
    <span class="close">&times;</span>
    <img id="modalImg" src="">
</div>

<!-- ПРОФИЛЬ -->
<div class="profile-screen" id="profileScreen">
    <div class="profile-header">
        <button id="closeProfile">←</button>
        <span>Мой профиль</span>
    </div>
    <div class="profile-body">
        <div class="profile-field" style="text-align: center;">
            <div class="profile-avatar" id="avatarPicker">
                <span id="avatarEmoji">👤</span>
                <img id="avatarImg" style="display: none;">
            </div>
        </div>
        <div class="profile-field">
            <label>О себе</label>
            <textarea id="profileBio" rows="3" placeholder="Расскажите о себе..."></textarea>
        </div>
        <div class="profile-field">
            <label>Возраст</label>
            <input type="number" id="profileAge" placeholder="Например: 25">
        </div>
        <button class="profile-save" id="saveProfile">Сохранить</button>
    </div>
</div>

<script>
// ========== DOM ЭЛЕМЕНТЫ ==========
const authScreen = document.getElementById("authScreen");
const authTitle = document.getElementById("authTitle");
const authNick = document.getElementById("authNick");
const authPassword = document.getElementById("authPassword");
const authActionBtn = document.getElementById("authActionBtn");
const authSwitchBtn = document.getElementById("authSwitchBtn");
const authError = document.getElementById("authError");
const mainApp = document.getElementById("mainApp");
const currentNickSpan = document.getElementById("currentNick");
const logoutBtn = document.getElementById("logoutBtn");
const modeBar = document.getElementById("modeBar");
const modeTitle = document.getElementById("modeTitle");
const backBtn = document.getElementById("backBtn");
const chatDiv = document.getElementById("chat");
const typingIndicator = document.getElementById("typingIndicator");
const inputBar = document.getElementById("inputBar");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const attachBtn = document.getElementById("attachBtn");
const menuBtn = document.getElementById("menuBtn");
const menuPanel = document.getElementById("menuPanel");
const closeMenu = document.getElementById("closeMenu");
const themeItem = document.getElementById("themeItem");
const soundItem = document.getElementById("soundItem");
const usersListDiv = document.getElementById("usersList");
const searchUser = document.getElementById("searchUser");
const callIndicator = document.getElementById("callIndicator");
const contextMenu = document.getElementById("contextMenu");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
const modalClose = document.querySelector(".modal .close");
const profileScreen = document.getElementById("profileScreen");
const closeProfile = document.getElementById("closeProfile");
const avatarPicker = document.getElementById("avatarPicker");
const avatarEmoji = document.getElementById("avatarEmoji");
const avatarImg = document.getElementById("avatarImg");
const profileBio = document.getElementById("profileBio");
const profileAge = document.getElementById("profileAge");
const saveProfile = document.getElementById("saveProfile");

let ws;
let logged = false;
let currentNick = "";
let currentMode = "public";
let currentPrivateWith = "";
let usersOnline = [];
let allUsers = [];
let isLoginMode = true;
let soundEnabled = true;
let replyToMsg = null;
let pendingImage = null;
let typingTimeout = null;
let typingTimer = null;
let unreadCounts = {};

let pc = null;
let localStream = null;
let currentCallWith = null;

const servers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

// ========== ПОДКЛЮЧЕНИЕ ==========
function connect() {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);
    ws.onerror = (e) => console.log("ws error");
    ws.onclose = () => { if (logged) addSystem("❌ Соединение потеряно"); setTimeout(connect, 2000); };
    ws.onmessage = (e) => {
        let d; try { d = JSON.parse(e.data); } catch { return; }
        
        if (d.type === "error") {
            if (!authScreen.classList.contains("hidden")) authError.textContent = d.text;
            else alert("❌ " + d.text);
            return;
        }
        if (d.type === "register_success") {
            authError.style.color = "#4caf50";
            authError.textContent = d.text;
            setTimeout(() => {
                isLoginMode = true;
                authTitle.textContent = "Вход";
                authActionBtn.textContent = "Войти";
                authSwitchBtn.textContent = "Нет аккаунта? Регистрация";
                authError.textContent = "";
                authPassword.value = "";
            }, 1500);
            return;
        }
        if (d.type === "login_success") {
            logged = true;
            currentNick = d.nick;
            currentNickSpan.textContent = currentNick;
            authScreen.classList.add("hidden");
            mainApp.classList.remove("hidden");
            menuBtn.classList.remove("hidden");
            document.title = "Чат: " + currentNick;
            addSystem(`✅ Вы вошли как ${currentNick}`);
            switchToPublic();
            loadUnreadCounts();
            return;
        }
        if (!logged) return;
        
        if (d.type === "history" && currentMode === "public") { renderMessages(d.data); return; }
        if (d.type === "msg" && currentMode === "public") { addMessage(d.data); notify(d.data.text); markUnread("public", d.data.id); return; }
        if (d.type === "system") { addSystem(d.text); notify(d.text); return; }
        if (d.type === "users") { 
            usersOnline = d.users; 
            allUsers = [...new Set([...allUsers, ...usersOnline])];
            renderUsersList();
        }
        if (d.type === "private_msg") {
            if (currentMode === "private" && currentPrivateWith === d.with) {
                addPrivateMessage(d.data);
            } else {
                addSystem(`💬 Новое сообщение от ${d.with}`);
                markUnread(`private_${d.with}`, d.data.id);
            }
            notify(`📩 ${d.with}: ${d.data.text}`);
        }
        if (d.type === "private_history" && currentMode === "private" && currentPrivateWith === d.with) { renderPrivateMessages(d.data); return; }
        if (d.type === "delete") { const el = document.getElementById(d.id); if (el) el.remove(); }
        if (d.type === "edit") { 
            const el = document.getElementById(d.id);
            if (el) {
                const textSpan = el.querySelector(".msg-text") || el;
                textSpan.textContent = d.newText;
            }
        }
        if (d.type === "typing") {
            if (currentMode === "private" && currentPrivateWith === d.from) {
                if (d.isTyping) showTyping(d.from);
                else hideTyping();
            }
        }
        if (d.type === "signal") handleSignal(d.from, d.signal);
    };
}
connect();

// ========== НЕПРОЧИТАННЫЕ ==========
function markUnread(chatId, msgId) {
    if (currentMode === "public" && chatId === "public") return;
    if (currentMode === "private" && chatId === `private_${currentPrivateWith}`) return;
    if (!unreadCounts[chatId]) unreadCounts[chatId] = [];
    unreadCounts[chatId].push(msgId);
    saveUnreadCounts();
    updateUnreadBadges();
}
function clearUnread(chatId) {
    if (unreadCounts[chatId]) delete unreadCounts[chatId];
    saveUnreadCounts();
    updateUnreadBadges();
}
function saveUnreadCounts() {
    localStorage.setItem(`unreads_${currentNick}`, JSON.stringify(unreadCounts));
}
function loadUnreadCounts() {
    const saved = localStorage.getItem(`unreads_${currentNick}`);
    if (saved) unreadCounts = JSON.parse(saved);
}
function updateUnreadBadges() {
    // Обновляем в списке пользователей
    renderUsersList();
}

// ========== УВЕДОМЛЕНИЯ ==========
function notify(text) {
    if (!soundEnabled) return;
    if (Notification.permission === "granted") {
        new Notification("Новое сообщение", { body: text.substring(0, 100) });
    } else if (Notification.permission !== "denied") {
        Notification.requestPermission();
    }
}

// ========== ПЕЧАТАЕТ ==========
function showTyping(from) {
    typingIndicator.textContent = `${from} печатает...`;
    typingIndicator.classList.remove("hidden");
}
function hideTyping() {
    typingIndicator.classList.add("hidden");
}
function sendTyping(isTyping) {
    if (currentMode === "private" && currentPrivateWith) {
        ws.send(JSON.stringify({ type: "typing", to: currentPrivateWith, isTyping }));
    }
}
msgInput.addEventListener("input", () => {
    if (typingTimer) clearTimeout(typingTimer);
    sendTyping(true);
    typingTimer = setTimeout(() => sendTyping(false), 1000);
});

// ========== АВТОРИЗАЦИЯ ==========
function setAuthMode(login) {
    isLoginMode = login;
    if (isLoginMode) {
        authTitle.textContent = "Вход";
        authActionBtn.textContent = "Войти";
        authSwitchBtn.textContent = "Нет аккаунта? Регистрация";
    } else {
        authTitle.textContent = "Регистрация";

}
authActionBtn.onclick = () => {
    const nick = authNick.value.trim();
    const password = authPassword.value.trim();
    if (!nick || nick.length < 2) { authError.textContent = "Ник от 2 символов"; return; }
    if (!password || password.length < 3) { authError.textContent = "Пароль от 3 символов"; return; }
    if (isLoginMode) ws.send(JSON.stringify({ type: "login", nick, password }));
    else ws.send(JSON.stringify({ type: "register", nick, password }));
};
authSwitchBtn.onclick = () => setAuthMode(!isLoginMode);

function renderMessages(messages) { chatDiv.innerHTML = ""; messages.forEach(m => addMessage(m)); clearUnread("public"); }
function addMessage(m) {
    const div = document.createElement("div"); div.className = "message";
    if (m.owner === currentNick) div.classList.add("own");
    div.id = m.id;
    if (m.replyTo) {
        const replyDiv = document.createElement("div");
        replyDiv.className = "reply-header";
        replyDiv.textContent = `↩️ Ответ на: ${(m.replyTo.text || "").substring(0, 50)}`;
        div.appendChild(replyDiv);
    }
    if (m.image) {
        const img = document.createElement("img");
        img.src = m.image;
        img.onclick = (e) => { e.stopPropagation(); openModal(m.image); };
        div.appendChild(img);
    }
    const textSpan = document.createElement("span");
    textSpan.className = "msg-text";
    textSpan.textContent = m.text || "";
    div.appendChild(textSpan);
    const timeSpan = document.createElement("div");
    timeSpan.className = "time";
    timeSpan.textContent = m.timeFormatted || "";
    div.appendChild(timeSpan);
    attachContextMenu(div, m);
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}
function renderPrivateMessages(messages) { chatDiv.innerHTML = ""; messages.forEach(m => addPrivateMessage(m)); clearUnread(`private_${currentPrivateWith}`); }
function addPrivateMessage(m) {

        div.appendChild(replyDiv);
    }
    if (m.image) {

        img.src = m.image;
        img.onclick = (e) => { e.stopPropagation(); openModal(m.image); };

// ===== КОНТЕКСТНОЕ МЕНЮ =====
function attachContextMenu(div, msg) {
    const showMenu = (x, y) => {
        contextMenu.innerHTML = "";
        const items = [
            { text: "✏️ Изменить", action: () => editMessage(msg) },
            { text: "📋 Копировать", action: () => copyMessage(msg) },
            { text: "↪️ Ответить", action: () => replyToMessage(msg) },
            { text: "➡️ Переслать", action: () => forwardMessage(msg) },
            { text: "🗑️ Удалить", action: () => deleteMessage(msg) }
        ];
        items.forEach(item => {
            const itemDiv = document.createElement("div");
            itemDiv.textContent = item.text;
            itemDiv.onclick = () => { contextMenu.style.display = "none"; item.action(); };
            contextMenu.appendChild(itemDiv);
        });
        let left = x + 10, top = y + 10;
        if (left + 200 > window.innerWidth) left = x - 210;
        if (top + 200 > window.innerHeight) top = y - 210;
        contextMenu.style.left = left + "px";
        contextMenu.style.top = top + "px";
        contextMenu.style.display = "block";
        const closeMenu = () => {
            contextMenu.style.display = "none";
            document.removeEventListener("click", closeMenu);
            document.removeEventListener("touchstart", closeMenu);
        };
        setTimeout(() => {
            document.addEventListener("click", closeMenu);
            document.addEventListener("touchstart", closeMenu);
        }, 50);
    };
    div.addEventListener("contextmenu", (e) => { e.preventDefault(); showMenu(e.clientX, e.clientY); });
    let timer;
    div.addEventListener("touchstart", (e) => {
        timer = setTimeout(() => {
            const touch = e.touches[0];
            showMenu(touch.clientX, touch.clientY);
        }, 600);
    });
    div.addEventListener("touchend", () => clearTimeout(timer));
    div.addEventListener("touchmove", () => clearTimeout(timer));
}

function forwardMessage(msg) { msgInput.value = msg.text || ""; msgInput.focus(); }
function deleteMessage(msg) { if (confirm("Удалить сообщение?")) ws.send(JSON.stringify({ type: "delete", id: msg.id })); }
