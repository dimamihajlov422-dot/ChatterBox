<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Простой чат</title>
<style>
body { margin:0; display:flex; font-family:Arial; height:100vh; }
#contacts { width:200px; border-right:1px solid #ccc; overflow-y:auto; }
#chat { flex:1; display:flex; flex-direction:column; }
#header { padding:10px; border-bottom:1px solid #ccc; font-weight:bold; }
#messages { flex:1; padding:10px; overflow-y:auto; }
#input { display:flex; }
#input input { flex:1; padding:5px; }
#input button { padding:5px; }
.contact { padding:5px; cursor:pointer; border-bottom:1px solid #eee; display:flex; justify-content:space-between; }
.contact.online::before { content:"●"; color:green; margin-right:5px; }
.message { margin-bottom:5px; cursor:default; }
button.delete { background:red;color:white;border:none;padding:0 5px; cursor:pointer; }
</style>
</head>
<body>
<div id="contacts"></div>
<div id="chat">
  <div id="header"></div>
  <div id="messages"></div>
  <div id="input">
    <input id="msg" placeholder="Введите сообщение"/>
    <button id="send">Отправить</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let nick = prompt("Введите свой ник:");
let currentContact = "";
let messagesDB = {};

document.getElementById("header").textContent = `Вы: ${nick}`;

socket.emit("set nick", nick);

function updateContacts(users){
  const cDiv = document.getElementById("contacts");
  cDiv.innerHTML = "";
  users.forEach(u => {
    if(u.nick !== nick){
      const div = document.createElement("div");
      div.className = "contact" + (u.online?" online":"");
      div.textContent = u.nick;
      div.onclick = ()=>{
        currentContact = u.nick;
        document.getElementById("header").textContent = `Вы: ${nick} | Друг: ${currentContact}`;
        loadMessages();
      };
      const delBtn = document.createElement("button");
      delBtn.textContent="×"; delBtn.className="delete";
      delBtn.onclick = (e)=>{
        e.stopPropagation();
        socket.emit("delete contact", u.nick);
        div.remove();
      };
      div.appendChild(delBtn);
      cDiv.appendChild(div);
    }
  });
}

socket.on("update users", updateContacts);

function loadMessages(){
  const mDiv = document.getElementById("messages");
  mDiv.innerHTML = "";
  const key = [nick, currentContact].sort().join("|");
  const msgs = messagesDB[key] || [];
  msgs.forEach(m=>{
    const d = document.createElement("div");
    d.className="message";
    d.textContent = `${m.from}: ${m.msg}`;
    d.oncontextmenu = (e)=>{ e.preventDefault(); socket.emit("delete message",{fromNick:m.from,toNick:currentContact,msg:m.msg}); };
    mDiv.appendChild(d);
  });
  mDiv.scrollTop = mDiv.scrollHeight;
}

document.getElementById("send").onclick = ()=>{
  const msgInput = document.getElementById("msg");
  if(currentContact && msgInput.value.trim()){
    const msgData = { fromNick: nick, toNick: currentContact, msg: msgInput.value };
    socket.emit("private message", msgData);
    const key = [nick, currentContact].sort().join("|");
    if(!messagesDB[key]) messagesDB[key]=[];
    messagesDB[key].push(msgData);
    loadMessages();
    msgInput.value="";
  }
};

socket.on("private message", data=>{
  const key = [data.fromNick, data.toNick].sort().join("|");
  if(!messagesDB[key]) messagesDB[key]=[];
  if(data.deleted){
    messagesDB[key] = messagesDB[key].filter(m=>!(m.from===data.fromNick && m.msg===data.msg));
  } else {
    messagesDB[key].push(data);
  }
  if(currentContact===data.fromNick || currentContact===data.toNick) loadMessages();
});
</script>
</body>
</html>
