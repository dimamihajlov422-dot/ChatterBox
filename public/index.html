<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat v15.1 SAFE</title>

<style>
body{
    margin:0;
    font-family:Arial;
    display:flex;
    height:100vh;
}

#users{
    width:130px;
    border-right:1px solid #ccc;
    overflow:auto;
    padding:5px;
}

.user{
    padding:6px;
    background:#eee;
    margin-bottom:5px;
    border-radius:6px;
}

#chatWrap{
    flex:1;
    display:flex;
    flex-direction:column;
}

#chat{
    flex:1;
    overflow:auto;
    padding:10px;
}

.msg{
    background:#eee;
    margin:5px 0;
    padding:8px;
    border-radius:6px;
    word-break:break-word;
}

#top{
    padding:5px;
    border-bottom:1px solid #ccc;
    display:flex;
    gap:5px;
}

input,button{
    padding:6px;
}
</style>
</head>

<body>

<div id="users"></div>

<div id="chatWrap">

<div id="top">
    <input id="nickInput" placeholder="ник">
    <button id="loginBtn" onclick="login()">login</button>
</div>

<div id="chat"></div>

<div>
    <input id="msg">
    <button onclick="send()">➤</button>
</div>

</div>

<script>

const chat = document.getElementById("chat");
const users = document.getElementById("users");
const msg = document.getElementById("msg");
const nickInput = document.getElementById("nickInput");
const loginBtn = document.getElementById("loginBtn");

let ws;
let logged = false;
let audioCtx;

/* CONNECT */
function connect(){

    ws = new WebSocket(
        location.protocol === "https:"
        ? "wss://" + location.host
        : "ws://" + location.host
    );

    ws.onerror = (e)=>console.log("ws error", e);

    ws.onclose = ()=>setTimeout(connect, 1000);

    ws.onmessage = (e)=>{

        let d;
        try{ d = JSON.parse(e.data); }
        catch{return;}

        if(d.type === "error"){
            alert("❌ " + d.text);

            logged = false;
            nickInput.disabled = false;
            loginBtn.disabled = false;
            return;
        }

        if(d.type === "history"){
            chat.innerHTML = "";
            d.data.forEach(m=>add(m.text));
        }

        if(d.type === "msg") add(d.data.text);
        if(d.type === "system") add(d.text);

        if(d.type === "users") renderUsers(d.users);

        if(d.type === "voice") play(d.data);
    };
}

connect();

/* LOGIN */
function login(){

    if(logged) return;

    const nick = nickInput.value.trim();
    if(!nick) return;

    ws.send(JSON.stringify({
        type:"login",
        nick
    }));

    logged = true;

    nickInput.disabled = true;
    loginBtn.disabled = true;

    document.title = "Вы: " + nick;
}

/* CHAT */
function send(){

    if(ws.readyState !== 1) return;

    ws.send(JSON.stringify({
        type:"chat",
        text:msg.value
    }));

    msg.value = "";
}

/* UI */
function add(t){
    const d=document.createElement("div");
    d.className="msg";
    d.textContent=t;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
}

/* USERS */
function renderUsers(list){
    users.innerHTML="";
    list.forEach(u=>{
        const d=document.createElement("div");
        d.className="user";
        d.textContent=u;
        users.appendChild(d);
    });
}

/* VOICE SAFE */
function play(data){

    if(!audioCtx){
        audioCtx = new AudioContext();
    }

    audioCtx.resume().catch(()=>{});

    const buffer = audioCtx.createBuffer(1, data.length, audioCtx.sampleRate);
    buffer.copyToChannel(new Float32Array(data),0);

    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(audioCtx.destination);
    src.start();
}

/* ENTER */
msg.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") send();
});

</script>

</body>
</html>
