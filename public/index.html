<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ChatterBox</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#111;
    color:white;
}

/* TOP */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    border-bottom:1px solid #333;
}

button{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* CHAT */
#chat{
    height:70vh;
    overflow:auto;
    padding:10px;
}

.msg{
    margin:5px 0;
    padding:6px;
    background:#1e1e1e;
    border-radius:6px;
}

/* INPUT */
.bottom{
    display:flex;
    gap:10px;
    padding:10px;
    border-top:1px solid #333;
}

input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:6px;
    outline:none;
}

</style>
</head>

<body>

<div class="top">
    <div>💬 ChatterBox</div>

    <div>
        <input id="nick" placeholder="Ник" style="width:120px">
        <button onclick="setNick()">Войти</button>
    </div>
</div>

<div id="chat"></div>

<div class="bottom">
    <input id="msg" placeholder="Сообщение">
    <button onclick="send()">Отправить</button>
</div>

<script>

let ws;

function connect(){
    ws = new WebSocket(
        (location.protocol==="https:"?"wss://":"ws://")+location.host
    );

    ws.onmessage = (e)=>{
        const div=document.createElement("div");
        div.className="msg";
        div.textContent=e.data;
        chat.appendChild(div);
        chat.scrollTop=chat.scrollHeight;
    };
}

connect();

/* FIX TIME (UTC+3) */
function now(){
    const d=new Date();
    d.setHours(d.getHours()+3);

    return d.toLocaleTimeString("ru-RU",{
        hour:"2-digit",
        minute:"2-digit"
    });
}

function setNick(){
    const nick=document.getElementById("nick").value.trim();
    if(!nick) return;

    ws.send(JSON.stringify({
        type:"nick",
        nick
    }));
}

function send(){
    const text=document.getElementById("msg").value.trim();
    if(!text) return;

    ws.send(JSON.stringify({
        type:"chat",
        text
    }));

    msg.value="";
}

/* ENTER */
document.getElementById("msg")
.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") send();
});

</script>

</body>
</html>
