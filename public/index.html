<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Чат ОК-стиль</title>
<style>
body { font-family: Arial, sans-serif; display:flex; height:100vh; margin:0; }
#contacts { width:200px; border-right:1px solid #ccc; overflow-y:auto; }
#chat { flex:1; display:flex; flex-direction:column; }
#messages { flex:1; overflow-y:auto; padding:10px; }
#input { display:flex; }
#input input { flex:1; padding:5px; }
#input button { padding:5px; }
.contact { padding:5px; cursor:pointer; border-bottom:1px solid #eee; display:flex; align-items:center; }
.contact.online::before { content:"●"; color:green; margin-right:5px; }
.contact img { width:24px; height:24px; border-radius:50%; margin-right:5px; }
</style>
</head>
<body>
<div id="contacts"></div>
<div id="chat">
  <div id="messages"></div>
  <div id="input">
    <input id="msg" placeholder="Введите сообщение"/>
    <button id="send">Отправить</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

let currentNick = prompt("Ваш ник");
let currentAvatar = ""; // Можно добавить URL аватарки
let currentContact = "";

socket.emit("set nick", currentNick);

socket.on("update users", users => {
  const cDiv = document.getElementById("contacts");
  cDiv.innerHTML = "";
  users.forEach(u => {
    if(u.nick !== currentNick){
      const div = document.createElement("div");
      div.className = "contact" + (u.online?" online":"");
      div.innerHTML = `<img src="${u.avatar||'https://via.placeholder.com/24'}"/>${u.nick}`;
      div.onclick = () => { currentContact = u.nick; loadMessages(u.nick); };
      cDiv.appendChild(div);
    }
  });
});

function loadMessages(contact){
  fetch("/data").then(r=>r.json()).then(db=>{
    const key = [currentNick, contact].sort().join("|");
    const msgs = db.messages[key] || [];
    const mDiv = document.getElementById("messages");
    mDiv.innerHTML = "";
    msgs.forEach(m=>{
      const d = document.createElement("div");
      d.textContent = `${m.from}: ${m.msg}`;
      mDiv.appendChild(d);
    });
    mDiv.scrollTop = mDiv.scrollHeight;
  });
}

document.getElementById("send").onclick = ()=>{
  const msgInput = document.getElementById("msg");
  if(currentContact && msgInput.value.trim()){
    const msg = msgInput.value;
    socket.emit("private message",{fromNick:currentNick,toNick:currentContact,msg});
    msgInput.value = "";
    loadMessages(currentContact);
  }
};

socket.on("private message", data=>{
  if(data.fromNick === currentContact || data.toNick === currentContact){
    loadMessages(currentContact);
  }
});
</script>
</body>
</html>
