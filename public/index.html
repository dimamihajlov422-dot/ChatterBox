<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chat v21 — Mobile</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
}

/* ===== ТЕМЫ ===== */
body.light {
    background: #f5f5f5;
    color: #000;
}

body.dark {
    background: #121212;
    color: #fff;
}

body.dark #chatWrap {
    background: #1e1e1e;
}

body.dark .msg {
    background: #2d2d2d;
    color: #fff;
}

body.dark .msg.own {
    background: #005c4b;
    color: #fff;
}

body.dark .system {
    background: #2d2d2d;
    color: #aaa;
}

body.dark #inputArea {
    background: #1e1e1e;
    border-top-color: #333;
}

body.dark #msgInput {
    background: #2d2d2d;
    color: #fff;
    border-color: #444;
}

body.dark #menuPanel {
    background: #1e1e1e;
}

body.dark .user-item {
    background: #2d2d2d;
}

/* ===== ОСНОВНОЙ ЧАТ ===== */
#chatWrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

/* СООБЩЕНИЯ */
.msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    word-break: break-word;
    background: #e4e6eb;
    align-self: flex-start;
}

.msg.own {
    background: #0084ff;
    color: white;
    align-self: flex-end;
}

.system {
    text-align: center;
    font-size: 11px;
    color: #666;
    padding: 6px 12px;
    background: #e0e0e0;
    border-radius: 16px;
    align-self: center;
    max-width: 85%;
}

/* ГОЛОСОВЫЕ СООБЩЕНИЯ */
.voice-msg {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
}

.voice-msg button {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #0084ff;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

/* ===== НИЖНЯЯ ПАНЕЛЬ ===== */
#inputArea {
    background: white;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    border-top: 1px solid #ddd;
    flex-shrink: 0;
}

#msgInput {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 28px;
    font-size: 16px;
    background: #f9f9f9;
    outline: none;
}

#sendBtn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #0084ff;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

#voiceBtn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #f44336;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

#voiceBtn.recording {
    background: #ff9800;
    animation: pulse 0.8s infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

/* ===== МЕНЮ (слева сверху) ===== */
#menuBtn {
    position: fixed;
    top: 12px;
    left: 12px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #0084ff;
    border: none;
    color: white;
    font-size: 24px;
    z-index: 200;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

#menuPanel {
    position: fixed;
    top: 0;
    left: 0;
    width: 280px;
    height: 100%;
    background: white;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    z-index: 300;
    box-shadow: 2px 0 12px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
}

#menuPanel.open {
    transform: translateX(0);
}

#menuHeader {
    padding: 20px;
    background: #0084ff;
    color: white;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#closeMenu {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

#menuBody {
    flex: 1;
    padding: 16px;
}

.menu-item {
    padding: 14px;
    margin-bottom: 8px;
    background: #f0f0f0;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
}

.menu-item span:first-child {
    font-size: 20px;
}

body.dark .menu-item {
    background: #2d2d2d;
    color: white;
}

/* Список пользователей в меню */
#menuUsersList {
    margin-top: 16px;
    max-height: 300px;
    overflow-y: auto;
}

.user-item {
    padding: 12px;
    background: #f0f0f0;
    margin-bottom: 8px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.user-item button {
    background: #4caf50;
    border: none;
    padding: 6px 12px;
    border-radius: 20px;
    color: white;
    cursor: pointer;
}

.user-item button.active {
    background: #f44336;
}

/* Индикатор звонка */
#callIndicator {
    position: fixed;
    bottom: 80px;
    left: 16px;
    right: 16px;
    background: #4caf50;
    color: white;
    padding: 10px;
    border-radius: 28px;
    text-align: center;
    font-size: 13px;
    z-index: 150;
    display: none;
}

#callIndicator button {
    background: #f44336;
    border: none;
    padding: 4px 12px;
    border-radius: 20px;
    color: white;
    margin-left: 12px;
    cursor: pointer;
}

/* Стрелка ЛС (декоративная) */
#dmArrow {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #0084ff;
    border: none;
    color: white;
    font-size: 20px;
    z-index: 200;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.hidden {
    display: none;
}
</style>
</head>

<body class="light">

<button id="menuBtn">☰</button>
<button id="dmArrow" onclick="alert('Личные сообщения скоро')">💬</button>

<div id="menuPanel">
    <div id="menuHeader">
        <span>Меню</span>
        <button id="closeMenu">✕</button>
    </div>
    <div id="menuBody">
        <div class="menu-item" onclick="toggleTheme()">
            <span>🌓</span>
            <span>Сменить тему</span>
        </div>
        <div class="menu-item" onclick="toggleUsersInMenu()">
            <span>👥</span>
            <span>Кто в сети</span>
        </div>
        <div id="menuUsersList" style="display: none;"></div>
    </div>
</div>

<div id="chatWrap">
    <div id="chat"></div>
</div>

<div id="inputArea">
    <input type="text" id="msgInput" placeholder="Сообщение...">
    <button id="sendBtn">➤</button>
    <button id="voiceBtn">🎙️</button>
</div>

<div id="callIndicator"></div>

<script>

let ws;
let logged = false;
let currentNick = "";

// WebRTC
let pc = null;
let localStream = null;
let currentCallWith = null;

// Голосовые сообщения
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

const chatDiv = document.getElementById("chat");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const voiceBtn = document.getElementById("voiceBtn");
const menuBtn = document.getElementById("menuBtn");
const menuPanel = document.getElementById("menuPanel");
const closeMenu = document.getElementById("closeMenu");
const menuUsersList = document.getElementById("menuUsersList");
const callIndicator = document.getElementById("callIndicator");

let usersOnline = [];

const servers = {
    iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
    ]
};

/* ===== LOGIN ===== */
function login(){
    const nick = prompt("Введите ваш ник (2-16 символов)", currentNick || "");
    if(!nick || nick.length < 2) return;
    
    if(!ws || ws.readyState !== 1){
        alert("Подключение к серверу... попробуйте ещё раз");
        return;
    }
    
    ws.send(JSON.stringify({
        type: "login",
        nick: nick
    }));
    
    currentNick = nick;
}

/* ===== CONNECT ===== */
function connect(){
    ws = new WebSocket(
        (location.protocol === "https:" ? "wss://" : "ws://") + location.host
    );
    
    ws.onopen = () => {
        if(currentNick) login();
    };
    
    ws.onerror = (e) => console.log("ws error");
    ws.onclose = () => setTimeout(connect, 1000);
    
    ws.onmessage = (e) => {
        let d;
        try { d = JSON.parse(e.data); }
        catch { return; }
        
        if(d.type === "error"){
            alert("❌ " + d.text);
            if(d.text.includes("Ник")){
                logged = false;
                currentNick = "";
                login();
            }
            return;
        }
        
        if(d.type === "login" && !logged){
            logged = true;
            document.title = "Чат: " + currentNick;
            return;
        }
        
        if(d.type === "history"){
            chatDiv.innerHTML = "";
            d.data.forEach(addMessage);
        }
        
        if(d.type === "msg") addMessage(d.data);
        if(d.type === "delete") removeMessage(d.id);
        if(d.type === "system") addSystem(d.text);
        if(d.type === "users") {
            usersOnline = d.users;
            renderUsersInMenu();
        }
        if(d.type === "voiceMsg") receiveVoiceMsg(d.from, d.data);
        if(d.type === "signal") handleSignal(d.from, d.signal);
    };
}

connect();

/* ===== ADD MESSAGE ===== */
function addMessage(m){
    const div = document.createElement("div");
    div.className = "msg";
    if(m.owner === currentNick) div.classList.add("own");
    div.id = m.id;
    div.textContent = m.text;
    
    let pressTimer;
    div.ontouchstart = () => {
        pressTimer = setTimeout(() => {
            if(m.owner === currentNick && confirm("Удалить сообщение?")){
                ws.send(JSON.stringify({ type: "delete", id: m.id }));
            } else if(m.owner !== currentNick){
                alert("Можно удалять только свои сообщения");
            }
        }, 600);
    };
    div.ontouchend = () => clearTimeout(pressTimer);
    div.ontouchmove = () => clearTimeout(pressTimer);
    
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

function removeMessage(id){
    const el = document.getElementById(id);
    if(el) el.remove();
}

function addSystem(text){
    const div = document.createElement("div");
    div.className = "system";
    div.textContent = text;
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

/* ===== SEND TEXT ===== */
function sendText(){
    if(!logged){
        login();
        return;
    }
    const text = msgInput.value.trim();
    if(!text) return;
    
    ws.send(JSON.stringify({
        type: "chat",
        text: text
    }));
    
    msgInput.value = "";
}

msgInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter") sendText();
});
sendBtn.onclick = sendText;

/* ===== VOICE MESSAGE ===== */
async function toggleVoice(){
    if(!logged){
        login();
        return;
    }
    if(isRecording){
        stopRecording();
    } else {
        await startRecording();
    }
}

async function startRecording(){
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
        audioChunks = [];
        
        mediaRecorder.ondataavailable = (e) => {
            if(e.data.size > 0) audioChunks.push(e.data);
        };
        
        mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: "audio/webm" });
            const reader = new FileReader();
            reader.onload = () => {
                ws.send(JSON.stringify({
                    type: "voiceMsg",
                    data: reader.result
                }));
                addSystem("🎙️ Голосовое отправлено");
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach(t => t.stop());
        };
        
        mediaRecorder.start();
        isRecording = true;
        voiceBtn.classList.add("recording");
        voiceBtn.textContent = "⏹️";
        
        setTimeout(() => {
            if(isRecording) stopRecording();
        }, 10000);
    } catch(e){
        alert("Нет доступа к микрофону");
    }
}

function stopRecording(){
    if(mediaRecorder && isRecording){
        mediaRecorder.stop();
        isRecording = false;
        voiceBtn.classList.remove("recording");
        voiceBtn.textContent = "🎙️";
    }
}

voiceBtn.onclick = toggleVoice;

function receiveVoiceMsg(from, dataUrl){
    const div = document.createElement("div");
    div.className = "msg voice-msg";
    if(from === currentNick) div.classList.add("own");
    
    const btn = document.createElement("button");
    btn.textContent = "🔊";
    btn.onclick = () => {
        const audio = new Audio(dataUrl);
        audio.play();
    };
    
    const text = document.createElement("span");
    text.textContent = `🎙️ ${from}: голосовое`;
    
    div.appendChild(btn);
    div.appendChild(text);
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

/* ===== WEBRTC CALL ===== */
async function callUser(targetNick){
    if(currentCallWith === targetNick){
        endCall();
        return;
    }
    
    if(currentCallWith) endCall();
    currentCallWith = targetNick;
    updateCallIndicator();
    
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        pc = new RTCPeerConnection(servers);
        
        localStream.getTracks().forEach(track => {
            pc.addTrack(track, localStream);
        });
        
        pc.ontrack = (event) => {
            const audio = new Audio();
            audio.srcObject = event.streams[0];
            audio.play();
            addSystem(`🔊 Говорим с ${targetNick}`);
        };
        
        pc.onicecandidate = (event) => {
            if(event.candidate){
                ws.send(JSON.stringify({
                    type: "signal",
                    target: targetNick,
                    signal: { candidate: event.candidate }
                }));
            }
        };
        
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        
        ws.send(JSON.stringify({
            type: "signal",
            target: targetNick,
            signal: { sdp: offer }
        }));
        
        addSystem(`📞 Звоним ${targetNick}...`);
        renderUsersInMenu();
    } catch(e){
        addSystem("❌ Ошибка звонка");
        endCall();
    }
}

function endCall(){
    if(localStream){
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
    }
    if(pc){
        pc.close();
        pc = null;
    }
    if(currentCallWith){
        addSystem(`📴 Звонок с ${currentCallWith} завершён`);
        currentCallWith = null;
        updateCallIndicator();
        renderUsersInMenu();
    }
}

function updateCallIndicator(){
    if(currentCallWith){
        callIndicator.innerHTML = `📞 В звонке: ${currentCallWith} <button onclick="endCall()">Завершить</button>`;
        callIndicator.style.display = "flex";
        setTimeout(() => {
            callIndicator.style.display = "none";
        }, 3000);
    } else {
        callIndicator.style.display = "none";
    }
}

async function handleSignal(from, signal){
    if(!pc && signal.sdp && signal.sdp.type === "offer"){
        const answer = confirm(`📞 ${from} звонит. Ответить?`);
        if(!answer) return;
        
        currentCallWith = from;
        updateCallIndicator();
        
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            pc = new RTCPeerConnection(servers);
            
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });
            
            pc.ontrack = (event) => {
                const audio = new Audio();
                audio.srcObject = event.streams[0];
                audio.play();
                addSystem(`🔊 Говорим с ${from}`);
            };
            
            pc.onicecandidate = (event) => {
                if(event.candidate){
                    ws.send(JSON.stringify({
                        type: "signal",
                        target: from,
                        signal: { candidate: event.candidate }
                    }));
                }
            };
            
            await pc.setRemoteDescription(signal.sdp);
            const answerSdp = await pc.createAnswer();
            await pc.setLocalDescription(answerSdp);
            
            ws.send(JSON.stringify({
                type: "signal",
                target: from,
                signal: { sdp: answerSdp }
            }));
            
            addSystem(`📞 Разговор с ${from}`);
            renderUsersInMenu();
        } catch(e){
            endCall();
        }
        return;
    }
    
    if(!pc) return;
    if(signal.sdp) await pc.setRemoteDescription(signal.sdp);
    if(signal.candidate) await pc.addIceCandidate(signal.candidate);
}

/* ===== МЕНЮ ===== */
menuBtn.onclick = () => menuPanel.classList.add("open");
closeMenu.onclick = () => menuPanel.classList.remove("open");

function toggleTheme(){
    const body = document.body;
    if(body.classList.contains("light")){
        body.classList.remove("light");
        body.classList.add("dark");
        localStorage.setItem("theme", "dark");
    } else {
        body.classList.remove("dark");
        body.classList.add("light");
        localStorage.setItem("theme", "light");
    }
}

let usersVisible = false;
function toggleUsersInMenu(){
    usersVisible = !usersVisible;
    menuUsersList.style.display = usersVisible ? "block" : "none";
    if(usersVisible) renderUsersInMenu();
}

function renderUsersInMenu(){
    if(!usersVisible) return;
    menuUsersList.innerHTML = "";
    usersOnline.forEach(u => {
        if(u === currentNick) return;
        const div = document.createElement("div");
        div.className = "user-item";
        
        const name = document.createElement("span");
        name.textContent = u;
        
        const btn = document.createElement("button");
        btn.textContent = currentCallWith === u ? "В звонке" : "📞";
        if(currentCallWith === u) btn.classList.add("active");
        btn.onclick = () => callUser(u);
        
        div.appendChild(name);
        div.appendChild(btn);
        menuUsersList.appendChild(div);
    });
}

/* ===== INIT ===== */
const savedTheme = localStorage.getItem("theme");
if(savedTheme === "dark"){
    document.body.classList.remove("light");
    document.body.classList.add("dark");
}

login();

</script>

</body>
</html>
