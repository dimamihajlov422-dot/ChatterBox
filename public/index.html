<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ChatterBox DM</title>

<style>
body{
    font-family:Arial;
    background:#111;
    color:white;
    margin:0;
    display:flex;
    height:100vh;
}

/* USERS */
#users{
    width:200px;
    border-right:1px solid #333;
    padding:10px;
}

.user{
    padding:8px;
    cursor:pointer;
    border-radius:6px;
}

.user:hover{
    background:#222;
}

/* CHAT */
#main{
    flex:1;
    display:flex;
    flex-direction:column;
}

#chat{
    flex:1;
    overflow:auto;
    padding:10px;
}

.msg{
    margin:5px 0;
}

#input{
    display:flex;
    padding:10px;
    gap:10px;
}

input{
    flex:1;
    padding:10px;
}

button{
    padding:10px;
}

.private{
    color:#00ffcc;
}
</style>
</head>

<body>

<div id="users">
<h3>👥 Онлайн</h3>
<div id="list"></div>
</div>

<div id="main">

<div id="chat"></div>

<div id="input">
<input id="msg" placeholder="Сообщение">
<button onclick="send()">Send</button>
</div>

</div>

<script>

let ws;
let nick;
let currentDM = null;

function connect(){
    ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);

    ws.onopen = () => {
        nick = prompt("Ник:");
        ws.send(JSON.stringify({type:"nick",nick}));
    };

    ws.onmessage = (e)=>{
        const data = JSON.parse(e.data);

        const chat = document.getElementById("chat");

        if(data.type==="public"){
            addMsg(data.text);
        }

        if(data.type==="private"){
            addMsg("💬 "+data.text, true);
        }

        if(data.type==="notify"){
            notify(data.text);
        }
    };
}

function addMsg(text, isPrivate=false){
    const div=document.createElement("div");
    div.className="msg";
    if(isPrivate) div.classList.add("private");
    div.textContent=text;
    document.getElementById("chat").appendChild(div);
    chat.scrollTop=chat.scrollHeight;
}

function send(){
    const text=document.getElementById("msg").value;

    ws.send(JSON.stringify({
        type:"chat",
        text,
        to: currentDM
    }));

    document.getElementById("msg").value="";
}

function notify(t){
    if(Notification.permission==="granted"){
        new Notification(t);
    }
}

Notification.requestPermission();

connect();

</script>

</body>
</html>
