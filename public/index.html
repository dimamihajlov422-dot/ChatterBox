<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ChatterBox</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#f0f0f0;
  margin:0;
  display:flex;
  flex-direction:column;
  height:100vh;
}

#room-select{
  margin:5px;
  padding:8px;
  font-size:16px;
  border-radius:6px;
  border:none;
}

#messages{
  flex:1;
  overflow-y:auto;
  padding:10px;
  background:white;
  word-wrap: break-word;
}

.message{
  padding:6px 8px;
  margin:4px 0;
  background:#e3e3e3;
  border-radius:8px;
  display:flex;
  justify-content: space-between;
  align-items:center;
  flex-wrap:wrap;
}

.message span{
  flex:1;
  word-wrap: break-word;
}

.message button{
  background:red;
  color:white;
  border:none;
  border-radius:4px;
  padding:2px 6px;
  margin-left:8px;
  font-size:12px;
  cursor:pointer;
}

#form-container{
  display:flex;
  flex-direction: column;
  padding:5px;
  background:#ddd;
  box-sizing:border-box;
}

#form{
  display:flex;
  flex-direction:row;
}

#nick{
  padding:10px;
  font-size:16px;
  margin-bottom:5px;
  border-radius:6px;
  border:none;
}

#input{
  flex:1;
  padding:10px;
  font-size:16px;
  border:none;
  border-radius:6px 0 0 6px;
  resize:none;
}

#send{
  padding:10px 16px;
  border:none;
  background:#4CAF50;
  color:white;
  font-size:16px;
  border-radius:0 6px 6px 0;
  cursor:pointer;
}

@media (max-width:600px){
  #nick, #room-select{
    width:100%;
    font-size:18px;
    padding:12px;
  }
  #input{
    font-size:18px;
    padding:12px;
  }
  #send{
    font-size:18px;
    padding:12px 18px;
  }
}
</style>
</head>
<body>

<select id="room-select">
  <option>Общий</option>
  <option>Тест</option>
  <option>Игры</option>
</select>

<div id="messages"></div>

<div id="form-container">
  <input id="nick" placeholder="Ваш ник"/>
  <form id="form">
    <textarea id="input" autocomplete="off" placeholder="Сообщение..." rows="1"></textarea>
    <button type="submit" id="send">Отправить</button>
  </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const form = document.getElementById("form");
const input = document.getElementById("input");
const nickInput = document.getElementById("nick");
const messages = document.getElementById("messages");
const roomSelect = document.getElementById("room-select");

let currentRoom = roomSelect.value;

// подключаемся к комнате при старте
socket.emit("join room", currentRoom);

// переключение комнат
roomSelect.addEventListener("change", () => {
  currentRoom = roomSelect.value;
  messages.innerHTML = "";
  socket.emit("join room", currentRoom);
});

// авто-размер поля
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
});

// отправка сообщений
form.addEventListener("submit", function(e){
  e.preventDefault();
  if(input.value && nickInput.value){
    const data = {nick: nickInput.value, msg: input.value, room: currentRoom};
    socket.emit("chat message", data);
    input.value="";
    input.style.height = 'auto';
  }
});

// получение сообщений
socket.on("chat message", function(data){
  const item = document.createElement("div");
  item.className="message";

  const span = document.createElement("span");
  span.textContent = data.nick + ": " + data.msg;

  const delBtn = document.createElement("button");
  delBtn.textContent="X";
  delBtn.onclick = function(){ 
    messages.removeChild(item); 
  };

  // удаление по долгому нажатию на мобильных
  let pressTimer;
  item.addEventListener('touchstart', function(e){
    pressTimer = setTimeout(()=> messages.removeChild(item), 600);
  });
  item.addEventListener('touchend', function(e){
    clearTimeout(pressTimer);
  });

  item.appendChild(span);
  item.appendChild(delBtn);
  messages.appendChild(item);
  messages.scrollTop = messages.scrollHeight;
});
</script>

</body>
</html>
