<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat + Call v7</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#fff;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.top{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #ccc;
}

#chat{
    flex:1;
    overflow:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg{
    background:#eee;
    padding:10px;
    border-radius:10px;
}

.bottom{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid #ccc;
}

input{
    flex:1;
    padding:10px;
}

button{
    min-width:45px;
    min-height:45px;
}
</style>
</head>

<body>

<div class="top">
    <div>
        <input id="nick" placeholder="ник">
        <button onclick="setNick()">OK</button>
    </div>

    <div>
        <button onclick="startCall()">📞</button>
        <button onclick="toggleMute()">🔇</button>
    </div>
</div>

<div id="chat"></div>

<div class="bottom">
    <input id="msg">
    <button onclick="send()">➤</button>
</div>

<script>

let ws;
let localStream;
let peers = {};
let muted = false;

/* CONNECT */
function connect(){

    ws = new WebSocket(location.origin.replace("http","ws"));

    ws.onmessage = async (e)=>{

        let d = JSON.parse(e.data);

        if(d.type==="history"){
            d.data.forEach(m=>add(m.text));
        }

        if(d.type==="msg"){
            add(d.data.text);
        }

        if(d.type==="system"){
            add(d.text);
        }

        if(d.type==="signal"){
            handleSignal(d.from, d.data);
        }
    };
}

connect();

/* CHAT */
function send(){
    ws.send(JSON.stringify({
        type:"chat",
        text:msg.value
    }));
    msg.value="";
}

/* NICK */
function setNick(){
    ws.send(JSON.stringify({
        type:"nick",
        nick:nick.value
    }));
}

/* UI */
function add(t){
    const d = document.createElement("div");
    d.className="msg";
    d.textContent=t;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
}

/* ===== CALL ===== */

async function startCall(){

    localStream = await navigator.mediaDevices.getUserMedia({
        audio:true
    });

    ws.send(JSON.stringify({type:"call-start"}));
}

/* PEER */
async function createPeer(id){

    const pc = new RTCPeerConnection({
        iceServers:[{urls:"stun:stun.l.google.com:19302"}]
    });

    localStream.getTracks().forEach(t=>{
        pc.addTrack(t, localStream);
    });

    pc.ontrack = (e)=>{
        const audio = document.createElement("audio");
        audio.autoplay = true;
        audio.srcObject = e.streams[0];
        document.body.appendChild(audio);
    };

    pc.onicecandidate = (e)=>{
        if(e.candidate){
            ws.send(JSON.stringify({
                type:"signal",
                data:{type:"candidate", candidate:e.candidate, from:id}
            }));
        }
    };

    peers[id] = pc;
    return pc;
}

/* SIGNAL */
async function handleSignal(id, data){

    let pc = peers[id];
    if(!pc) pc = await createPeer(id);

    if(data.type==="candidate"){
        try{
            await pc.addIceCandidate(data.candidate);
        }catch{}
    }

    if(data.type==="offer"){
        await pc.setRemoteDescription(data.offer);
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);

        ws.send(JSON.stringify({
            type:"signal",
            data:{type:"answer", answer:pc.localDescription, from:id}
        }));
    }

    if(data.type==="answer"){
        await pc.setRemoteDescription(data.answer);
    }
}

/* MUTE */
function toggleMute(){

    if(!localStream) return;

    muted = !muted;

    localStream.getAudioTracks().forEach(t=>{
        t.enabled = !muted;
    });

    add(muted ? "🔇 mute" : "🎤 unmute");
}

</script>

</body>
</html>
