<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Мессенджер</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #f5f5f5;
    transition: background 0.3s;
}

body.dark {
    background: #121212;
}

/* ===== ЭКРАН ВХОДА ===== */
.auth-screen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #0084ff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
    transition: opacity 0.3s;
}

.auth-screen.hidden {
    display: none;
}

.auth-card {
    background: white;
    border-radius: 24px;
    padding: 32px 24px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

body.dark .auth-card {
    background: #1e1e1e;
    color: white;
}

.auth-card h2 {
    text-align: center;
    margin-bottom: 24px;
    font-size: 24px;
}

.auth-card input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 28px;
    font-size: 16px;
    outline: none;
}

body.dark .auth-card input {
    background: #2d2d2d;
    color: white;
    border-color: #444;
}

.auth-card button {
    width: 100%;
    padding: 14px;
    background: #0084ff;
    color: white;
    border: none;
    border-radius: 28px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 12px;
}

.auth-card .switch-btn {
    background: none;
    color: #0084ff;
    border: 1px solid #0084ff;
}

body.dark .auth-card .switch-btn {
    background: none;
    color: #0084ff;
}

.error-msg {
    color: #f44336;
    text-align: center;
    font-size: 13px;
    margin-top: 8px;
}

/* ===== ОСНОВНОЙ ИНТЕРФЕЙС ===== */
.main-app {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.main-app.hidden {
    display: none;
}

/* ШАПКА */
.header {
    background: #0084ff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}

.header .nick {
    color: white;
    font-weight: bold;
    flex: 1;
    font-size: 18px;
}

.header button {
    background: rgba(255,255,255,0.2);
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

/* ВЕРХНЯЯ ПАНЕЛЬ РЕЖИМА */
.mode-bar {
    background: #0084ff;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
}

.mode-bar button {
    background: white;
    color: #0084ff;
    border: none;
    padding: 8px 16px;
    border-radius: 24px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
}

.mode-bar span {
    color: white;
    font-weight: bold;
    flex: 1;
    text-align: center;
    font-size: 15px;
}

/* ЧАТ */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    background: #e4e6eb;
    align-self: flex-start;
    word-break: break-word;
}

body.dark .message {
    background: #2d2d2d;
    color: white;
}

.message.own {
    background: #0084ff;
    color: white;
    align-self: flex-end;
}

.system {
    text-align: center;
    font-size: 11px;
    color: #666;
    background: #e0e0e0;
    padding: 6px 12px;
    border-radius: 16px;
    align-self: center;
    max-width: 85%;
}

body.dark .system {
    background: #2d2d2d;
    color: #aaa;
}

/* НИЖНЯЯ ПАНЕЛЬ */
.input-bar {
    background: white;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    border-top: 1px solid #ddd;
    flex-shrink: 0;
}

body.dark .input-bar {
    background: #1e1e1e;
    border-top-color: #333;
}

.input-bar input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 28px;
    font-size: 16px;
    background: #f9f9f9;
    outline: none;
}

body.dark .input-bar input {
    background: #2d2d2d;
    color: white;
    border-color: #444;
}

.input-bar button {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #0084ff;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
}

/* КНОПКА МЕНЮ */
.menu-btn {
    position: fixed;
    bottom: 80px;
    right: 16px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #0084ff;
    border: none;
    color: white;
    font-size: 24px;
    z-index: 200;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* МЕНЮ */
.menu-panel {
    position: fixed;
    bottom: 140px;
    right: 16px;
    width: 260px;
    background: white;
    border-radius: 20px;
    transform: scale(0);
    transition: transform 0.2s ease;
    z-index: 300;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    transform-origin: bottom right;
}

body.dark .menu-panel {
    background: #1e1e1e;
}

.menu-panel.open {
    transform: scale(1);
}

.menu-header {
    padding: 16px;
    background: #0084ff;
    color: white;
    font-weight: bold;
    border-radius: 20px 20px 0 0;
    display: flex;
    justify-content: space-between;
}

.menu-header button {
    background: none;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.menu-body {
    padding: 12px;
}

.menu-item {
    padding: 12px;
    background: #f0f0f0;
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex;
    gap: 10px;
}

body.dark .menu-item {
    background: #2d2d2d;
    color: white;
}

.user-list {
    margin-top: 12px;
    max-height: 200px;
    overflow-y: auto;
}

.user-item {
    padding: 10px;
    background: #f0f0f0;
    margin-bottom: 6px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

body.dark .user-item {
    background: #2d2d2d;
}

.user-item .online-dot {
    width: 8px;
    height: 8px;
    background: #4caf50;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
}

.user-item .offline-dot {
    width: 8px;
    height: 8px;
    background: #999;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
}

.user-item button {
    background: #4caf50;
    border: none;
    padding: 4px 12px;
    border-radius: 16px;
    color: white;
    font-size: 12px;
    cursor: pointer;
}

/* ИНДИКАТОР ЗВОНКА */
.call-indicator {
    position: fixed;
    bottom: 140px;
    left: 16px;
    right: 16px;
    background: #4caf50;
    color: white;
    padding: 12px;
    border-radius: 28px;
    text-align: center;
    font-size: 14px;
    z-index: 150;
    display: none;
}

.call-indicator button {
    background: #f44336;
    border: none;
    padding: 4px 12px;
    border-radius: 20px;
    color: white;
    margin-left: 12px;
    cursor: pointer;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<!-- ЭКРАН ВХОДА -->
<div class="auth-screen" id="authScreen">
    <div class="auth-card">
        <h2 id="authTitle">Вход</h2>
        <input type="text" id="authNick" placeholder="Ник (2-16 символов)">
        <input type="password" id="authPassword" placeholder="Пароль">
        <button id="authActionBtn">Войти</button>
        <button id="authSwitchBtn" class="switch-btn">Нет аккаунта? Регистрация</button>
        <div id="authError" class="error-msg"></div>
    </div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
<div class="main-app hidden" id="mainApp">
    <div class="header">
        <span class="nick" id="currentNick">--</span>
        <button id="logoutBtn">Выйти</button>
    </div>

    <div class="mode-bar hidden" id="modeBar">
        <button id="backBtn">← Общий чат</button>
        <span id="modeTitle"></span>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-bar" id="inputBar">
        <input type="text" id="msgInput" placeholder="Сообщение...">
        <button id="sendBtn">➤</button>
    </div>
</div>

<button class="menu-btn hidden" id="menuBtn">☰</button>

<div class="menu-panel hidden" id="menuPanel">
    <div class="menu-header">
        <span>Меню</span>
        <button id="closeMenu">✕</button>
    </div>
    <div class="menu-body">
        <div class="menu-item" id="themeItem">
            <span>🌓</span> Сменить тему
        </div>
        <div class="menu-item" id="showUsersItem">
            <span>👥</span> Пользователи
        </div>
        <div id="usersList" class="user-list hidden"></div>
    </div>
</div>

<div class="call-indicator" id="callIndicator"></div>

<script>
// ========== DOM ЭЛЕМЕНТЫ ==========
const authScreen = document.getElementById("authScreen");
const authTitle = document.getElementById("authTitle");
const authNick = document.getElementById("authNick");
const authPassword = document.getElementById("authPassword");
const authActionBtn = document.getElementById("authActionBtn");
const authSwitchBtn = document.getElementById("authSwitchBtn");
const authError = document.getElementById("authError");

const mainApp = document.getElementById("mainApp");
const currentNickSpan = document.getElementById("currentNick");
const logoutBtn = document.getElementById("logoutBtn");
const modeBar = document.getElementById("modeBar");
const modeTitle = document.getElementById("modeTitle");
const backBtn = document.getElementById("backBtn");
const chatDiv = document.getElementById("chat");
const inputBar = document.getElementById("inputBar");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const menuBtn = document.getElementById("menuBtn");
const menuPanel = document.getElementById("menuPanel");
const closeMenu = document.getElementById("closeMenu");
const themeItem = document.getElementById("themeItem");
const showUsersItem = document.getElementById("showUsersItem");
const usersListDiv = document.getElementById("usersList");
const callIndicator = document.getElementById("callIndicator");

// ========== ПЕРЕМЕННЫЕ ==========
let ws;
let logged = false;
let currentNick = "";
let currentMode = "public";
let currentPrivateWith = "";
let usersOnline = [];
let isLoginMode = true;
let pc = null;
let localStream = null;
let currentCallWith = null;

const servers = {
    iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
    ]
};

// ========== ПОДКЛЮЧЕНИЕ ==========
function connect() {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);

    ws.onerror = (e) => console.log("ws error");

    ws.onclose = () => {
        if (logged) {
            addSystem("❌ Соединение потеряно, переподключение...");
        }
        setTimeout(connect, 2000);
    };

    ws.onmessage = (e) => {
        let d;
        try { d = JSON.parse(e.data); } catch { return; }

        if (d.type === "error") {
            if (authScreen && !authScreen.classList.contains("hidden")) {
                authError.textContent = d.text;
            } else {
                alert("❌ " + d.text);
            }
            return;
        }

        if (d.type === "register_success") {
            authError.style.color = "#4caf50";
            authError.textContent = d.text;
            setTimeout(() => {
                isLoginMode = true;
                authTitle.textContent = "Вход";
                authActionBtn.textContent = "Войти";
                authSwitchBtn.textContent = "Нет аккаунта? Регистрация";
                authError.textContent = "";
                authPassword.value = "";
            }, 1500);
            return;
        }

        if (d.type === "login_success") {
            logged = true;
            currentNick = d.nick;
            currentNickSpan.textContent = currentNick;
            authScreen.classList.add("hidden");
            mainApp.classList.remove("hidden");
            menuBtn.classList.remove("hidden");
            document.title = "Чат: " + currentNick;
            addSystem(`✅ Вы вошли как ${currentNick}`);
            switchToPublic();
            return;
        }

        if (!logged) return;

        if (d.type === "history" && currentMode === "public") {
            renderMessages(d.data);
            return;
        }

        if (d.type === "msg" && currentMode === "public") {
            addMessage(d.data);
            return;
        }

        if (d.type === "system") {
            addSystem(d.text);
            return;
        }

        if (d.type === "users") {
            usersOnline = d.users;
            renderUsersList();
        }

        if (d.type === "private_msg") {
            if (currentMode === "private" && currentPrivateWith === d.with) {
                addPrivateMessage(d.data);
            } else {
                addSystem(`💬 Новое сообщение от ${d.with}`);
            }
        }

        if (d.type === "private_history" && currentMode === "private" && currentPrivateWith === d.with) {
            renderPrivateMessages(d.data);
        }

        if (d.type === "delete") {
            const el = document.getElementById(d.id);
            if (el) el.remove();
        }

        if (d.type === "signal") {
            handleSignal(d.from, d.signal);
        }
    };
}

connect();

// ========== АВТОРИЗАЦИЯ ==========
function setAuthMode(login) {
    isLoginMode = login;
    if (isLoginMode) {
        authTitle.textContent = "Вход";
        authActionBtn.textContent = "Войти";
        authSwitchBtn.textContent = "Нет аккаунта? Регистрация";
    } else {
        authTitle.textContent = "Регистрация";
        authActionBtn.textContent = "Зарегистрироваться";
        authSwitchBtn.textContent = "Уже есть аккаунт? Вход";
    }
    authError.textContent = "";
    authError.style.color = "#f44336";
}

authActionBtn.onclick = () => {
    const nick = authNick.value.trim();
    const password = authPassword.value.trim();

    if (!nick || nick.length < 2) {
        authError.textContent = "Ник от 2 символов";
        return;
    }
    if (!password || password.length < 3) {
        authError.textContent = "Пароль от 3 символов";
        return;
    }

    if (isLoginMode) {
        ws.send(JSON.stringify({ type: "login", nick: nick, password: password }));
    } else {
        ws.send(JSON.stringify({ type: "register", nick: nick, password: password }));
    }
};

authSwitchBtn.onclick = () => {
    setAuthMode(!isLoginMode);
};

// ========== ВЫХОД ==========
logoutBtn.onclick = () => {
    if (ws) ws.close();
    logged = false;
    currentNick = "";
    authNick.value = "";
    authPassword.value = "";
    authError.textContent = "";
    setAuthMode(true);
    authScreen.classList.remove("hidden");
    mainApp.classList.add("hidden");
    menuBtn.classList.add("hidden");
    chatDiv.innerHTML = "";
    currentMode = "public";
    currentPrivateWith = "";
    location.reload();
};

// ========== СООБЩЕНИЯ ==========
function renderMessages(messages) {
    chatDiv.innerHTML = "";
    messages.forEach(m => addMessage(m));
}

function addMessage(m) {
    const div = document.createElement("div");
    div.className = "message";
    if (m.owner === currentNick) div.classList.add("own");
    div.id = m.id;
    div.textContent = m.text;
    attachDelete(div, m.id);
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

function renderPrivateMessages(messages) {
    chatDiv.innerHTML = "";
    messages.forEach(m => addPrivateMessage(m));
}

function addPrivateMessage(m) {
    const div = document.createElement("div");
    div.className = "message";
    const isOwn = (m.from === currentNick);
    if (isOwn) div.classList.add("own");
    div.id = m.id;
    div.textContent = (isOwn ? "→ " : "← ") + m.text;
    attachDelete(div, m.id);
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

function attachDelete(div, id) {
    let pressTimer;
    div.ontouchstart = () => {
        pressTimer = setTimeout(() => {
            if (confirm("Удалить сообщение?")) {
                ws.send(JSON.stringify({ type: "delete", id: id }));
            }
        }, 600);
    };
    div.ontouchend = () => clearTimeout(pressTimer);
    div.ontouchmove = () => clearTimeout(pressTimer);
}

function addSystem(text) {
    const div = document.createElement("div");
    div.className = "system";
    div.textContent = text;
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

function sendText() {
    if (!logged) return;
    const text = msgInput.value.trim();
    if (!text) return;

    if (currentMode === "public") {
        ws.send(JSON.stringify({ type: "chat", text: text }));
    } else if (currentMode === "private" && currentPrivateWith) {
        ws.send(JSON.stringify({
            type: "private_chat",
            target: currentPrivateWith,
            text: text
        }));
    }
    msgInput.value = "";
}

msgInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendText();
});
sendBtn.onclick = sendText;

// ========== РЕЖИМЫ ==========
function switchToPublic() {
    currentMode = "public";
    currentPrivateWith = "";
    modeBar.classList.add("hidden");
    chatDiv.innerHTML = "";
    ws.send(JSON.stringify({ type: "get_history" }));
}

function switchToPrivate(withNick) {
    if (withNick === currentNick) {
        addSystem("❌ Нельзя писать самому себе");
        return;
    }
    currentMode = "private";
    currentPrivateWith = withNick;
    modeBar.classList.remove("hidden");
    modeTitle.textContent = `💬 ЛС с ${withNick}`;
    chatDiv.innerHTML = "";
    ws.send(JSON.stringify({ type: "get_private_history", with: withNick }));
}

backBtn.onclick = switchToPublic;

// ========== ПОЛЬЗОВАТЕЛИ ==========
menuBtn.onclick = () => menuPanel.classList.toggle("open");
closeMenu.onclick = () => menuPanel.classList.remove("open");

let usersVisible = false;
showUsersItem.onclick = () => {
    usersVisible = !usersVisible;
    usersListDiv.classList.toggle("hidden", !usersVisible);
    if (usersVisible) renderUsersList();
};

function renderUsersList() {
    if (!usersVisible) return;
    usersListDiv.innerHTML = "";

    const allUsers = JSON.parse(localStorage.getItem("allUsers") || "[]");
    const uniqueUsers = [...new Set([...allUsers, ...usersOnline])];

    uniqueUsers.forEach(u => {
        if (u === currentNick) return;
        const isOnline = usersOnline.includes(u);

        const div = document.createElement("div");
        div.className = "user-item";
        div.innerHTML = `
            <div>
                <span class="${isOnline ? 'online-dot' : 'offline-dot'}"></span>
                ${u} ${isOnline ? '🟢' : '⚫'}
            </div>
            <button onclick="switchToPrivate('${u}'); menuPanel.classList.remove('open');">💬</button>
        `;
        usersListDiv.appendChild(div);
    });
}

setInterval(() => {
    const current = JSON.parse(localStorage.getItem("allUsers") || "[]");
    const updated = [...new Set([...current, ...usersOnline])];
    localStorage.setItem("allUsers", JSON.stringify(updated));
    if (usersVisible) renderUsersList();
}, 5000);

// ========== ТЕМА ==========
let isDark = localStorage.getItem("theme") === "dark";
if (isDark) document.body.classList.add("dark");

themeItem.onclick = () => {
    isDark = !isDark;
    if (isDark) {
        document.body.classList.add("dark");
    } else {
        document.body.classList.remove("dark");
    }
    localStorage.setItem("theme", isDark ? "dark" : "light");
};

// ========== WEBRTC ЗВОНКИ ==========
async function callUser(targetNick) {
    if (currentCallWith === targetNick) {
        endCall();
        return;
    }
    if (currentCallWith) endCall();
    currentCallWith = targetNick;
    updateCallIndicator();

    try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        pc = new RTCPeerConnection(servers);

        localStream.getTracks().forEach(track => {
            pc.addTrack(track, localStream);
        });

        pc.ontrack = (event) => {
            const audio = new Audio();
            audio.srcObject = event.streams[0];
            audio.play();
            addSystem(`🔊 Говорим с ${targetNick}`);
        };

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                ws.send(JSON.stringify({
                    type: "signal",
                    target: targetNick,
                    signal: { candidate: event.candidate }
                }));
            }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        ws.send(JSON.stringify({
            type: "signal",
            target: targetNick,
            signal: { sdp: offer }
        }));

        addSystem(`📞 Звоним ${targetNick}...`);
    } catch (e) {
        addSystem("❌ Ошибка звонка");
        endCall();
    }
}

function endCall() {
    if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
    }
    if (pc) {
        pc.close();
        pc = null;
    }
    if (currentCallWith) {
        addSystem(`📴 Звонок с ${currentCallWith} завершён`);
        currentCallWith = null;
        updateCallIndicator();
    }
}

function updateCallIndicator() {
    if (currentCallWith) {
        callIndicator.innerHTML = `📞 В звонке: ${currentCallWith} <button onclick="endCall()">Завершить</button>`;
        callIndicator.style.display = "block";
        setTimeout(() => {
            if (!currentCallWith) callIndicator.style.display = "none";
        }, 3000);
    } else {
        callIndicator.style.display = "none";
    }
}

async function handleSignal(from, signal) {
    if (!pc && signal.sdp && signal.sdp.type === "offer") {
        const answer = confirm(`📞 ${from} звонит. Ответить?`);
        if (!answer) return;

        currentCallWith = from;
        updateCallIndicator();

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            pc = new RTCPeerConnection(servers);

            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });

            pc.ontrack = (event) => {
                const audio = new Audio();
                audio.srcObject = event.streams[0];
                audio.play();
                addSystem(`🔊 Говорим с ${from}`);
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        type: "signal",
                        target: from,
                        signal: { candidate: event.candidate }
                    }));
                }
            };

            await pc.setRemoteDescription(signal.sdp);
            const answerSdp = await pc.createAnswer();
            await pc.setLocalDescription(answerSdp);

            ws.send(JSON.stringify({
                type: "signal",
                target: from,
                signal: { sdp: answerSdp }
            }));

            addSystem(`📞 Разговор с ${from}`);
        } catch (e) {
            endCall();
        }
        return;
    }

    if (!pc) return;
    if (signal.sdp) await pc.setRemoteDescription(signal.sdp);
    if (signal.candidate) await pc.addIceCandidate(signal.candidate);
}

window.callUser = callUser;
window.endCall = endCall;
window.switchToPrivate = switchToPrivate;
</script>
