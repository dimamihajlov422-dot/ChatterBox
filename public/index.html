<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatterBox Call v1.1</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#fff;
    color:#000;
    height:100vh;
    display:flex;
    flex-direction:column;
}

body.dark{
    background:#111;
    color:#fff;
}

.top{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #ccc;
}

#chat{
    flex:1;
    overflow:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg{
    background:#eee;
    padding:10px;
    border-radius:10px;
}

body.dark .msg{
    background:#1e1e1e;
}

.bottom{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid #ccc;
}

input{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    min-width:48px;
    min-height:48px;
    border:none;
    border-radius:10px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="top">
    <div>
        <input id="nick" placeholder="ник">
        <button onclick="setNick()">OK</button>
    </div>

    <div>
        <button onclick="toggleTheme()">🌙</button>
        <button onclick="toggleCall()">📞</button>
        <button onclick="toggleMute()">🔇</button>
    </div>
</div>

<div id="chat"></div>

<div class="bottom">
    <input id="msg" placeholder="сообщение">
    <button onclick="send()">➤</button>
</div>

<script>

let ws;
let micStream = null;
let callActive = false;
let muted = false;

/* CONNECT */
function connect(){

    ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);

    ws.onmessage = (e)=>{

        let d;
        try{ d = JSON.parse(e.data); }
        catch{return;}

        const div = document.createElement("div");
        div.className="msg";
        div.textContent = d.text;

        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    };
}

connect();

/* NICK */
function setNick(){
    ws.send(JSON.stringify({
        type:"nick",
        nick:nick.value
    }));
}

/* CHAT */
function send(){
    ws.send(JSON.stringify({
        type:"chat",
        text:msg.value
    }));

    msg.value="";
}

/* CALL START/STOP */
async function toggleCall(){

    callActive = !callActive;

    if(callActive){

        micStream = await navigator.mediaDevices.getUserMedia({
            audio:true
        });

        ws.send(JSON.stringify({
            type:"call-start"
        }));

        addMsg("📞 Вы в звонке");

    } else {

        if(micStream){
            micStream.getTracks().forEach(t=>t.stop());
            micStream = null;
        }

        ws.send(JSON.stringify({
            type:"call-end"
        }));

        addMsg("📴 звонок завершён");
    }
}

/* MUTE */
function toggleMute(){

    if(!micStream){
        alert("Сначала начни звонок");
        return;
    }

    muted = !muted;

    micStream.getAudioTracks().forEach(t=>{
        t.enabled = !muted;
    });

    addMsg(muted ? "🔇 микрофон выключен" : "🎤 микрофон включён");
}

/* UI MSG */
function addMsg(t){
    const d = document.createElement("div");
    d.className="msg";
    d.textContent=t;
    chat.appendChild(d);
}

/* ENTER */
msg.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") send();
});

/* THEME */
function toggleTheme(){
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
