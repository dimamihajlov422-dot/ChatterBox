<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мессенджер</title>
<script src="/socket.io/socket.io.js"></script>
<style>
body { font-family: Arial; display:flex; flex-direction: column; max-width: 600px; margin:auto; }
#chat { border:1px solid #ccc; height:300px; overflow-y:auto; padding:5px; margin-bottom:5px; }
#input { display:flex; }
#input input { flex:1; padding:5px; }
#input button { padding:5px; }
</style>
</head>
<body>
<h2>Простой Мессенджер</h2>
<div>
    Ник: <input id="nick" type="text">
    Друг: <input id="friend" type="text">
    <button onclick="start()">Открыть чат</button>
</div>
<div id="chat"></div>
<div id="input">
    <input id="msg" type="text" placeholder="Напиши сообщение...">
    <button onclick="send()">Отправить</button>
</div>

<script>
const socket = io();
let nick = "";
let friend = "";

function start(){
    nick = document.getElementById("nick").value.trim();
    friend = document.getElementById("friend").value.trim();
    if(!nick || !friend){ alert("Введите ник и друга"); return; }

    // Сохраняем
    localStorage.setItem("nick", nick);
    localStorage.setItem("friend", friend);

    socket.emit("join",{nick, friend});
    document.getElementById("chat").innerHTML = "";
}

// Подставляем значения из localStorage
window.onload = function(){
    const savedNick = localStorage.getItem("nick");
    const savedFriend = localStorage.getItem("friend");
    if(savedNick) document.getElementById("nick").value = savedNick;
    if(savedFriend) document.getElementById("friend").value = savedFriend;
    if(savedNick && savedFriend) start();
}

socket.on("chat history", (messages)=>{
    const chat = document.getElementById("chat");
    messages.forEach(m=>{
        const div = document.createElement("div");
        div.textContent = m.from + ": " + m.text;
        chat.appendChild(div);
    });
    chat.scrollTop = chat.scrollHeight;
});

socket.on("new message", (m)=>{
    if((m.from === nick && m.to === friend) || (m.from === friend && m.to === nick)){
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.textContent = m.from + ": " + m.text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }
});

function send(){
    const msg = document.getElementById("msg").value.trim();
    if(!msg) return;
    socket.emit("message", msg);
    document.getElementById("msg").value = "";
}
</script>
</body>
</html>
