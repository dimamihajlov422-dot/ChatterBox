<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatterBox v3.7</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    display:flex;
    flex-direction:column;
    height:100vh;
}

body.light{
    background:white;
    color:black;
}

/* TOP */
.top{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #333;
}

/* CHAT */
#chat{
    flex:1;
    overflow:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg{
    background:#1e1e1e;
    padding:10px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

body.light .msg{
    background:#eee;
}

button{
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

input{
    padding:10px;
    border-radius:8px;
    border:none;
    outline:none;
    font-size:16px;
}

/* BOTTOM */
.bottom{
    display:flex;
    gap:10px;
    padding:10px;
    border-top:1px solid #333;
}

body.light .bottom{
    border-top:1px solid #ddd;
}

.pinned{
    border:2px solid gold;
}
</style>
</head>

<body>

<div class="top">
    <div>💬 v3.7 Chat</div>

    <div style="display:flex; gap:6px;">
        <input id="nick" placeholder="Ник" style="width:90px">
        <button onclick="setNick()">OK</button>
        <button onclick="toggleTheme()">🌙</button>
    </div>
</div>

<div id="chat"></div>

<div class="bottom">
    <input id="msg" placeholder="Сообщение">
    <button onclick="send()">➤</button>
</div>

<script>

let ws;
let currentDM = null;

function connect(){
    ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);

    ws.onmessage = (e)=>{
        const data = JSON.parse(e.data);

        if(data.type==="msg"){
            render(data.data);
        }

        if(data.type==="dm"){
            renderDM(data);
        }

        if(data.type==="error"){
            alert(data.text);
        }
    };
}

connect();

/* =====================
   NICK
===================== */
function setNick(){
    const n = nick.value.trim();
    if(!n) return;

    ws.send(JSON.stringify({
        type:"nick",
        nick:n
    }));
}

/* =====================
   SEND
===================== */
function send(){
    const text = msg.value.trim();
    if(!text) return;

    if(currentDM){
        ws.send(JSON.stringify({
            type:"dm",
            to: currentDM,
            text
        }));
    }else{
        ws.send(JSON.stringify({
            type:"chat",
            text
        }));
    }

    msg.value="";
}

/* =====================
   RENDER CHAT
===================== */
function render(m){

    const div = document.createElement("div");
    div.className="msg";
    div.id=m.id;

    const text = document.createElement("div");
    text.textContent = m.text;

    const dmBtn = document.createElement("button");
    dmBtn.textContent="💌";
    dmBtn.onclick=()=>{
        const name = prompt("Кому ЛС?");
        if(name) currentDM = name;
    };

    div.appendChild(text);
    div.appendChild(dmBtn);

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* =====================
   DM RENDER
===================== */
function renderDM(d){

    const div = document.createElement("div");
    div.className="msg";

    div.textContent = `💌 ${d.from} → ${d.to}: ${d.text}`;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* =====================
   ENTER
===================== */
msg.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") send();
});

/* =====================
   THEME
===================== */
if(localStorage.getItem("theme")==="light"){
    document.body.classList.add("light");
}

function toggleTheme(){
    document.body.classList.toggle("light");

    localStorage.setItem(
        "theme",
        document.body.classList.contains("light")
            ? "light"
            : "dark"
    );
}

</script>

</body>
</html>
